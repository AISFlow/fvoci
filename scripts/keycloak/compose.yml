# Local, opt-in Keycloak for scripts/keycloak-oidc-e2e.sh only. Not part of
# the product stack (infra/rust/compose.yml) and not a deployment example:
# start-dev (plain HTTP, in-container dev database, no cluster), the realms
# rendered from the templates here, published on loopback only.
#
# The runner passes the project name (-p fvoci-kc-e2e-<run id>), the rendered
# realm directory and the per-run admin password; nothing here is a secret.
services:
  keycloak:
    # Official image, current stable release when this file was written,
    # pinned by the digest `docker pull` resolved for that tag.
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command:
      - start-dev
      - --import-realm
      # Path only (%R; %U would include the query string), so no state or
      # nonce reaches the log; Host and User-Agent tell the browser from the
      # FVOCI server.
      - --http-access-log-enabled=true
      - '--http-access-log-pattern=%h "%m %R" %s host=%{i,Host} ua="%{i,User-Agent}"'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set by scripts/keycloak-oidc-e2e.sh}
    ports:
      # Ephemeral host port on loopback; the runner reads it back with
      # `docker compose port keycloak 8080`.
      - "127.0.0.1::8080"
    volumes:
      # The rendered realm files of this run (--import-realm reads them all).
      - ${FVOCI_KC_REALM_DIR:?set by scripts/keycloak-oidc-e2e.sh}:/opt/keycloak/data/import:ro
    mem_limit: 1536m
    cpus: 2
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
