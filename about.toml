# cargo-about configuration: which licenses the third-party notices may contain, and
# which dependencies they cover. Generate the notices with
#
#   cargo about generate --manifest-path crates/server/Cargo.toml -o NOTICE about.hbs
#
# The list of licenses is the same as in deny.toml.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
# Only what ends up in the distributed server binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true
