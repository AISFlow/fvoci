name: Rust
description: >-
  Installs the Rust toolchain the workspace is built with and brings back the build of
  its dependencies.

inputs:
  cache:
    description: The name of the build cache. Jobs that build the same things share one.
    required: true
  save:
    description: >-
      Whether this job is the one that saves that cache. It does so only in a run on
      main: a pull request reads the caches and writes none.
    default: 'false'

runs:
  using: composite
  steps:
    # No file of the repository names the toolchain: this is the one the checks are run
    # with elsewhere. Clippy's lints change between releases, and they fail the check.
    - name: Install the toolchain
      shell: bash
      env:
        TOOLCHAIN: 1.99.1
      run: |
        rustup toolchain install "$TOOLCHAIN" --profile minimal \
          --component clippy,rustfmt --no-self-update
        rustup default "$TOOLCHAIN"

    # The registry and the compiled dependencies, without the workspace's own crates.
    # The key has the compiler and Cargo.lock in it.
    - name: Bring back the build of the dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache }}
        save-if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' }}
        cache-bin: 'false'
