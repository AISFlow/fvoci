name: Shipping cgroup observation

on:
  push:
    branches: [fvoci/v060-shipping-551-reviewed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipping-cgroup-observer
  cancel-in-progress: false

jobs:
  # Register through pure controls only; observation remains manual-only.
  bootstrap:
    if: github.event_name == 'push' && github.repository == 'AISFlow/fvoci' && github.ref == 'refs/heads/fvoci/v060-shipping-551-reviewed'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Pure observer controls
        run: python3 -B tooling/scripts/selected-backend-ci/test-shipping-cgroup-observer.py

  observe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'AISFlow/fvoci' && github.ref == 'refs/heads/fvoci/v060-shipping-551-reviewed'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cea0784defc3551d3ae0bfe0c8fa74350c2b464b
          path: reader
          persist-credentials: false
      - name: Pure observer controls
        run: python3 -B tooling/scripts/selected-backend-ci/test-shipping-cgroup-observer.py
      - name: One pinned installed stat metadata observation
        run: python3 -B tooling/scripts/selected-backend-ci/shipping-cgroup-observer.py --installed-stat-metadata
