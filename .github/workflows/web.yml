      - name: Normalize tracked source mtimes for native cache reuse
        run: |
          set -euo pipefail
          source_epoch="$(git show -s --format=%ct HEAD)"
          git ls-files -z | xargs -0 touch -h -d "@$source_epoch" --
      - name: Prepare locked dependencies
        shell: *web_builder_shell
        run: cargo fetch --locked
      - name: Compile native preparation
        shell: *web_builder_shell
        run: |
          set -euo pipefail
          cargo test --locked --offline --features db-tests,api-schema --lib --no-run
          cargo test --locked --offline --features db-tests,api-schema --test selected_install_lifetime --no-run
      - name: Pack current native preparation
        id: native
        shell: *web_builder_shell
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/fvoci-native-tests"
          tar --posix -cf - target | zstd -T0 --no-progress -o "$RUNNER_TEMP/fvoci-native-tests/target.tar.zst"
          sha256="$(sha256sum "$RUNNER_TEMP/fvoci-native-tests/target.tar.zst" | cut -d ' ' -f 1)"
          printf 'target_sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
      - name: Save current native preparation
        id: publish_native
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-native-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fvoci-native-tests/target.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - *retire_web_builder
      - *save_sqlite_input_hashes

