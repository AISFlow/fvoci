name: Web

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LIBCLANG_PATH: /usr/lib/llvm-18/lib
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_web_checks: ${{ steps.plan.outputs.select_web_checks }}
      select_web_static: ${{ steps.plan.outputs.select_web_static }}
      select_workspace_browser_shard: ${{ steps.plan.outputs.select_workspace_browser_shard }}
      select_collaboration_build: ${{ steps.plan.outputs.select_collaboration_build }}
      select_collaboration_flow: ${{ steps.plan.outputs.select_collaboration_flow }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user --break-system-packages -r scripts/ci_selection_requirements.txt
          python3 scripts/ci_selection.py plan \
            --workflow web \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  # Frontend static analysis runs once, without a Rust build or database.
  web-static:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_web_static == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Prepare locked frontend tools
        run: bun ci
      - name: Strict pinned ESLint and Vue support proofs
        run: |
          set -euo pipefail
          bun run lint:fixtures
          bun run lint
          bun run format:check
      - name: Strict web and editor TypeScript and Vue template types
        run: |
          set -euo pipefail
          (cd apps/web && bun --bun run typecheck)
          (cd packages/editor && bun --bun run typecheck)

  # API contract/schema and unit regressions run once per SHA. Native checks
  # have a separate mandatory 15-minute budget with the same selection condition.
  web-checks:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_web_checks == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Restore web gate Rust outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v3-web-checks-ubuntu-26.04-${{ runner.arch }}-1.98.1-default-api-schema-devdebug0-testdebug0-${{ github.sha }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', 'packages/**', 'apps/**', 'third-party/**', 'patches/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Prepare locked dependencies
        run: |
          cargo fetch --locked
          bun ci
      - name: Generate and verify the API contract
        run: |
          bash scripts/generate-api.sh
          git diff --exit-code -- apps/web/openapi.json apps/web/src/generated/api.ts
      - name: Check API schema
        run: |
          cargo test --locked --offline --lib --features api-schema api::openapi::tests
      - name: Web and editor unit regressions
        run: |
          (cd apps/web && bun run test)
          (cd packages/editor && bun run test)
          (cd apps/web && bun test e2e-pending/collab-playwright.config.test.ts --timeout 60000)
          python3 scripts/selected-backend-ci/test_off_registration.py
      - name: Verify normal web e2e shard plan
        run: |
          bash scripts/test-web-e2e-groups.sh
          python3 scripts/fixtures/web-e2e/test-build-handoff.py

  web-native-checks:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_web_checks == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Restore native web gate Rust outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v1-web-native-checks-ubuntu-26.04-${{ runner.arch }}-1.98.1-clippy-db-tests-api-schema-static-default-devdebug0-testdebug0-${{ github.sha }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', 'packages/**', 'apps/**', 'third-party/**', 'patches/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Prepare locked dependencies
        run: |
          cargo fetch --locked
          bun ci
      - name: Check strict Clippy and default static transport
        run: |
          cargo clippy --locked --offline --all-targets --features db-tests,api-schema -- -D warnings
          cargo test --locked --offline --test static_api

  workspace-browser-shard:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_workspace_browser_shard == 'true'
    name: web-browser-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Restore web gate Rust outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-web-ubuntu-26.04-${{ runner.arch }}-1.98.1-db-api-schema-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Restore production collaboration helper outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/collab-engine/target
          key: v1-web-collab-helper-ubuntu-26.04-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-${{ hashFiles('crates/collab-engine/src/**') }}
          restore-keys: v1-web-collab-helper-ubuntu-26.04-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-
      - name: Prepare locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
          bun ci
      - name: Prepare Chromium and system libraries
        working-directory: apps/web
        run: bun --bun x --no-install playwright install --with-deps chromium
      - name: Real React browser shard ${{ matrix.shard }} with PostgreSQL app role
        id: browser
        # web-checks generates/diffs the same committed outputs; the gate requires it.
        run: bash scripts/run-web-e2e.sh --ci-use-committed-api --ci-shard ${{ matrix.shard }}
      - name: Retain failed browser DOM diagnostics
        if: (failure() || cancelled()) && steps.browser.outputs.failure-artifacts != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-browser-shard-${{ matrix.shard }}-browser-failure-${{ github.run_attempt }}
          # Raw traces carry headers, cookies and bodies and stay on the runner;
          # upload the rendered DOM, the redacted trace digest, server logs and
          # the host netlink address/link event log.
          path: |
            ${{ steps.browser.outputs.failure-artifacts }}/playwright-output/**/error-context.md
            ${{ steps.browser.outputs.failure-artifacts }}/playwright-output/**/browser-summary.txt
            ${{ steps.browser.outputs.failure-artifacts }}/server.log
            ${{ steps.browser.outputs.failure-artifacts }}/owned-server/*.log
            ${{ steps.browser.outputs.failure-artifacts }}/net-events.log
          retention-days: 3
          if-no-files-found: warn

  collaboration-build:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_collaboration_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact-id }}
      handoff_sha256: ${{ steps.prepare.outputs.handoff_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Restore web gate Rust outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-web-ubuntu-26.04-${{ runner.arch }}-1.98.1-db-api-schema-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Restore production collaboration helper outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/collab-engine/target
          key: v1-web-collab-helper-ubuntu-26.04-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-${{ hashFiles('crates/collab-engine/src/**') }}
          restore-keys: v1-web-collab-helper-ubuntu-26.04-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-
      - name: Prepare locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
          bun ci
      - name: Prepare Chromium and system libraries
        working-directory: apps/web
        run: bun --bun x --no-install playwright install --with-deps chromium
      - name: Qualify current selected native outputs (no browser or DB)
        id: prepare
        env:
          FVOCI_E2E_PENDING: "1"
        run: |
          set -euo pipefail
          export FVOCI_SELECTED_CI_OUTPUT="$RUNNER_TEMP/fvoci-selected-current"
          export FVOCI_SELECTED_CI_SQLITE_PARENT="$RUNNER_TEMP/fvoci-sqlite"
          export FVOCI_WEB_BUILD_HANDOFF="$RUNNER_TEMP/fvoci-web-build-handoff"
          mkdir -m 0700 "$FVOCI_SELECTED_CI_OUTPUT"
          bash scripts/run-web-e2e.sh --ci-use-committed-api --ci-prepare-selected
      - name: Publish only the successful current-source build packet
        id: publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-current-build-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fvoci-web-build-handoff/handoff.json
            ${{ runner.temp }}/fvoci-web-build-handoff/payload.tar
          if-no-files-found: error
          retention-days: 1
      - name: Retain failed current compilation diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selected-current-compile-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fvoci-selected-current/*-stderr.log
            ${{ runner.temp }}/fvoci-selected-current/*-stage.json
            ${{ runner.temp }}/fvoci-selected-current/handoff-input-before-safe.json
            ${{ runner.temp }}/fvoci-selected-current/handoff-input-after-safe.json
            ${{ runner.temp }}/fvoci-selected-current/handoff-input-current-safe.json
            ${{ runner.temp }}/fvoci-selected-current/handoff-input-delta-safe.json

  collaboration-flow:
    needs: [ci-plan, collaboration-build]
    if: needs.ci-plan.outputs.select_collaboration_flow == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Prepare locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
          bun ci
      - name: Prepare Chromium and system libraries
        working-directory: apps/web
        run: bun --bun x --no-install playwright install --with-deps chromium
      - name: Require a successful exact producer artifact
        env:
          PRODUCER_RESULT: ${{ needs.collaboration-build.result }}
          PRODUCER_ARTIFACT: ${{ needs.collaboration-build.outputs.artifact_id }}
          PRODUCER_DIGEST: ${{ needs.collaboration-build.outputs.handoff_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RESULT" == success ]]
          [[ "$PRODUCER_ARTIFACT" =~ ^[0-9]+$ ]]
          [[ "$PRODUCER_DIGEST" =~ ^[0-9a-f]{64}$ ]]
      - name: Download this run's immutable producer artifact by ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.collaboration-build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/fvoci-web-build-handoff
      - name: Check collaborative browser fixtures
        # Same per-test bound as the web and editor test scripts (node --test had none).
        run: |
          bun test --isolate --timeout=60000 ./apps/web/e2e-pending/collab-wire.test.ts ./apps/web/e2e-pending/collab-restart.test.ts
          bun test --isolate --timeout=60000 ./apps/web/e2e-pending/collab-helpers.test.ts
          (cd apps/web && bun --bun x --no-install tsc -p e2e-pending/collab-tsconfig.json)
      - name: Pending collaboration and mandatory selected normal PostgreSQL/SQLite restart
        id: browser
        env:
          FVOCI_E2E_PENDING: "1"
          FVOCI_WEB_BUILD_HANDOFF_SHA256: ${{ needs.collaboration-build.outputs.handoff_sha256 }}
        run: |
          set -euo pipefail
          # Only this ephemeral CI job's checkout/SQLite input/target/report ownership.
          # No account creation/global Git setting or operating resource changes.
          export FVOCI_SELECTED_CI_OUTPUT="$RUNNER_TEMP/fvoci-selected-current"
          export FVOCI_SELECTED_CI_SQLITE_PARENT="$RUNNER_TEMP/fvoci-sqlite"
          export FVOCI_WEB_BUILD_HANDOFF="$RUNNER_TEMP/fvoci-web-build-handoff"
          mkdir -m 0700 "$FVOCI_SELECTED_CI_OUTPUT"
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
          bash scripts/run-web-e2e.sh --ci-use-committed-api --ci-consume-selected
      - name: Retain failed browser DOM diagnostics
        if: (failure() || cancelled()) && steps.browser.outputs.failure-artifacts != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collaboration-browser-failure-${{ github.run_attempt }}
          # Same selection as the browser shards; raw traces are never uploaded.
          path: |
            ${{ steps.browser.outputs.failure-artifacts }}/playwright-output/**/error-context.md
            ${{ steps.browser.outputs.failure-artifacts }}/playwright-output/**/browser-summary.txt
            ${{ steps.browser.outputs.failure-artifacts }}/server.log
            ${{ steps.browser.outputs.failure-artifacts }}/owned-server/*.log
            ${{ steps.browser.outputs.failure-artifacts }}/net-events.log
          retention-days: 3
          if-no-files-found: warn

      - name: Retain selected current build and runtime diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selected-normal-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fvoci-selected-current/*-stderr.log
            ${{ runner.temp }}/fvoci-selected-current/*-stage.json
            ${{ runner.temp }}/fvoci-selected-current/*-driver.log
            ${{ runner.temp }}/fvoci-selected-current/selected-ci-receipt.json
            ${{ runner.temp }}/fvoci-selected-current/handoff-input-before-safe.json
            ${{ runner.temp }}/fvoci-selected-current/handoff-input-after-safe.json
            ${{ runner.temp }}/fvoci-selected-current/handoff-input-current-safe.json
            ${{ runner.temp }}/fvoci-selected-current/handoff-input-delta-safe.json

  web-ci-gate:
    name: web-ci-gate
    needs:
      [
        ci-plan,
        web-static,
        web-checks,
        web-native-checks,
        workspace-browser-shard,
        collaboration-build,
        collaboration-flow,
      ]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail closed on selection results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci_selection.py gate --workflow web --needs-json "$NEEDS_JSON" --tested-sha "$TESTED_SHA"
