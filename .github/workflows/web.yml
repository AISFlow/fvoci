name: Web

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_web_checks: ${{ steps.plan.outputs.select_web_checks }}
      select_workspace_browser_shard: ${{ steps.plan.outputs.select_workspace_browser_shard }}
      select_collaboration_flow: ${{ steps.plan.outputs.select_collaboration_flow }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/ci_selection.py plan \
            --workflow web \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  # API contract, schema/static transport and unit regressions run once per SHA
  # here instead of in every browser job (same target, features and options).
  web-checks:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_web_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/editor/package-lock.json
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Restore web gate Rust outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-web-checks-${{ runner.os }}-${{ runner.arch }}-1.98.1-db-api-schema-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}
          restore-keys: v2-web-checks-${{ runner.os }}-${{ runner.arch }}-1.98.1-db-api-schema-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Prepare locked dependencies
        run: |
          cargo fetch --locked
          npm ci --prefix apps/web --no-audit --no-fund
          npm ci --prefix packages/editor --ignore-scripts --no-audit --no-fund
      - name: Generate and verify the API contract
        run: |
          bash scripts/generate-api.sh
          git diff --exit-code -- apps/web/openapi.json apps/web/src/generated/api.ts
      - name: Check schema and static transport
        run: |
          cargo clippy --locked --offline --all-targets --features db-tests,api-schema -- -D warnings
          cargo test --locked --offline --test static_api
          cargo test --locked --offline --lib --features api-schema api::openapi::tests
      - name: Web and editor unit regressions
        run: |
          npm test --prefix apps/web
          npm run typecheck --prefix packages/editor
          npm test --prefix packages/editor
      - name: Verify normal web e2e shard plan
        run: bash scripts/test-web-e2e-groups.sh

  workspace-browser-shard:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_workspace_browser_shard == 'true'
    name: web-browser-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/editor/package-lock.json
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Restore web gate Rust outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-web-${{ runner.os }}-${{ runner.arch }}-1.98.1-db-api-schema-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}
          restore-keys: v2-web-${{ runner.os }}-${{ runner.arch }}-1.98.1-db-api-schema-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Restore production collaboration helper outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/collab-engine/target
          key: v1-web-collab-helper-${{ runner.os }}-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-${{ hashFiles('crates/collab-engine/src/**') }}
          restore-keys: v1-web-collab-helper-${{ runner.os }}-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-
      - name: Prepare locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
          npm ci --prefix apps/web --no-audit --no-fund
          npm ci --prefix packages/editor --ignore-scripts --no-audit --no-fund
      - name: Prepare Chromium and system libraries
        working-directory: apps/web
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Real React browser shard ${{ matrix.shard }} with PostgreSQL app role
        id: browser
        run: bash scripts/run-web-e2e.sh --ci-shard ${{ matrix.shard }}
      - name: Retain failed browser DOM diagnostics
        if: failure() && steps.browser.outputs.failure-artifacts != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-browser-shard-${{ matrix.shard }}-browser-failure-${{ github.run_attempt }}
          # Traces contain network headers/cookies; retain only rendered test DOM.
          path: ${{ steps.browser.outputs.failure-artifacts }}/playwright-output/**/error-context.md
          retention-days: 3
          if-no-files-found: warn

  collaboration-flow:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_collaboration_flow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/editor/package-lock.json
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Restore web gate Rust outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-web-${{ runner.os }}-${{ runner.arch }}-1.98.1-db-api-schema-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}
          restore-keys: v2-web-${{ runner.os }}-${{ runner.arch }}-1.98.1-db-api-schema-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Restore production collaboration helper outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/collab-engine/target
          key: v1-web-collab-helper-${{ runner.os }}-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-${{ hashFiles('crates/collab-engine/src/**') }}
          restore-keys: v1-web-collab-helper-${{ runner.os }}-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-
      - name: Prepare locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
          npm ci --prefix apps/web --no-audit --no-fund
          npm ci --prefix packages/editor --ignore-scripts --no-audit --no-fund
      - name: Prepare Chromium and system libraries
        working-directory: apps/web
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Check collaborative browser fixtures
        run: |
          node --experimental-strip-types --test apps/web/e2e-pending/collab-wire.test.ts apps/web/e2e-pending/collab-restart.test.ts
          node --experimental-strip-types --test apps/web/e2e-pending/collab-helpers.test.ts
          apps/web/node_modules/.bin/tsc -p apps/web/e2e-pending/collab-tsconfig.json
      - name: Real React collaborative editing with PostgreSQL app role
        id: browser
        env:
          FVOCI_E2E_PENDING: '1'
        run: bash scripts/run-web-e2e.sh
      - name: Retain failed browser DOM diagnostics
        if: failure() && steps.browser.outputs.failure-artifacts != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collaboration-browser-failure-${{ github.run_attempt }}
          path: ${{ steps.browser.outputs.failure-artifacts }}/playwright-output/**/error-context.md
          retention-days: 3
          if-no-files-found: warn

  web-ci-gate:
    name: web-ci-gate
    needs: [ci-plan, web-checks, workspace-browser-shard, collaboration-flow]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail closed on selection results
        env:
          PLAN_READY: ${{ needs.ci-plan.result }}
          PLAN_JSON: ${{ needs.ci-plan.outputs.plan_json }}
          TESTED_SHA: ${{ github.sha }}
          JOB_WEB_CHECKS: ${{ needs.web-checks.result }}
          JOB_WORKSPACE_BROWSER_SHARD: ${{ needs.workspace-browser-shard.result }}
          JOB_COLLABORATION_FLOW: ${{ needs.collaboration-flow.result }}
        run: |
          set -euo pipefail
          if [[ "$PLAN_READY" != success ]]; then
            echo "ci-plan did not succeed"
            exit 1
          fi
          python3 scripts/ci_selection.py gate --workflow web \
            --plan-json "$PLAN_JSON" \
            --tested-sha "$TESTED_SHA" \
            --job-result web-checks="$JOB_WEB_CHECKS" \
            --job-result workspace-browser-shard="$JOB_WORKSPACE_BROWSER_SHARD" \
            --job-result collaboration-flow="$JOB_COLLABORATION_FLOW"
