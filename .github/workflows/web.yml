      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        shell: *web_builder_shell
        run: |
          set -euo pipefail
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
          test "$(bun --version)" = 1.4.3
          test -f "$LIBCLANG_PATH/libclang.so"
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - *sqlite_input_hashes
      - name: Restore native web gate Rust outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v1-web-native-checks-ubuntu-26.04-${{ runner.arch }}-1.99.0-clippy-db-tests-api-schema-static-default-devdebug0-testdebug0-${{ github.sha }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', 'packages/**', 'apps/**', 'third-party/**', 'patches/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Prepare locked dependencies
        shell: *web_builder_shell
        run: |
          cargo fetch --locked
          bun ci
      - name: Check strict Clippy and default static transport
        shell: *web_builder_shell
        run: |
          cargo clippy --locked --offline --all-targets --features db-tests,api-schema -- -D warnings
          cargo test --locked --offline --test static_api

      # Exact default-feature browser binaries and fresh dist, built once for all shards.
      - *retire_web_builder
      - *save_sqlite_input_hashes

  workspace-browser-build:
    needs: [ci-plan, web-builder]
    if: needs.ci-plan.outputs.select_workspace_browser_shard == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact-id }}
      handoff_sha256: ${{ steps.prepare.outputs.handoff_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - *download_web_builder
      - *admit_web_builder
      - shell: *web_builder_shell
        run: test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/fvoci-web-builder-state/cargo/registry
            ${{ runner.temp }}/fvoci-web-builder-state/cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare owned pinned Rustup component metadata before input capture
        shell: *web_builder_shell
        run: |
          env -u CARGO_BUILD_TARGET -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR \
            -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u CARGO_BUILD_RUSTFLAGS \
            RUSTUP_AUTO_INSTALL=0 \
            cargo build --quiet --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target
          xtask/target/debug/xtask prepare-rustup-ci-metadata --output "$RUNNER_TEMP/fvoci-rustup-ci-metadata"
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        shell: *web_builder_shell
        run: |
          set -euo pipefail
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
          test "$(bun --version)" = 1.4.3
          test -f "$LIBCLANG_PATH/libclang.so"
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - *sqlite_input_hashes
      - name: Restore web gate Rust outputs
        id: cache_workspace_browser_shard_5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v1-web-browser-default-fixture-ubuntu-26.04-${{ runner.arch }}-1.99.0-default-server-db-tests-fixture-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Restore production collaboration helper outputs
        id: cache_workspace_browser_shard_6
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/collab-engine/target
          key: v1-web-browser-worker-helper-ubuntu-26.04-${{ runner.arch }}-1.99.0-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-${{ hashFiles('crates/collab-engine/src/**') }}
          restore-keys: v1-web-browser-worker-helper-ubuntu-26.04-${{ runner.arch }}-1.99.0-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-
      - name: Prepare locked dependencies
        shell: *web_builder_shell
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
          bun ci
      - name: Prepare Chromium and system libraries
        shell: *web_builder_shell
        run: |
          cd apps/web
          test "$(bun --bun x --no-install playwright --version)" = 'Version 1.64.0'
          test -d "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Build and qualify ordinary browser outputs without DB credentials
        id: prepare
        shell: *web_builder_shell
        run: |
          set -euo pipefail
          export FVOCI_SELECTED_CI_OUTPUT="$RUNNER_TEMP/fvoci-browser-current"
          export FVOCI_WEB_BUILD_HANDOFF="$RUNNER_TEMP/fvoci-browser-build-handoff"
          mkdir -m 0700 "$FVOCI_SELECTED_CI_OUTPUT"
          bash scripts/run-web-e2e.sh --ci-use-committed-api --ci-prepare-browser
      - name: Publish the exact successful browser packet
        id: publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-build-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fvoci-browser-build-handoff/handoff.json
            ${{ runner.temp }}/fvoci-browser-build-handoff/payload.tar
          if-no-files-found: error
          retention-days: 1
      - name: Retain failed browser compilation diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-compile-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fvoci-browser-current/*-stderr.log
            ${{ runner.temp }}/fvoci-browser-current/*-stage.json
            ${{ runner.temp }}/fvoci-browser-current/handoff-input-*-safe.json
          if-no-files-found: warn
          retention-days: 3
      - name: Save web gate Rust outputs
        if: github.ref == 'refs/heads/main' && steps.cache_workspace_browser_shard_5.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v1-web-browser-default-fixture-ubuntu-26.04-${{ runner.arch }}-1.99.0-default-server-db-tests-fixture-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Save production collaboration helper outputs
        if: github.ref == 'refs/heads/main' && steps.cache_workspace_browser_shard_6.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/collab-engine/target
          key: v1-web-browser-worker-helper-ubuntu-26.04-${{ runner.arch }}-1.99.0-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-${{ hashFiles('crates/collab-engine/src/**') }}
      - *retire_web_builder
      - *save_sqlite_input_hashes

  workspace-browser-shard:
    needs: [ci-plan, workspace-browser-build, web-builder]
    if: needs.ci-plan.outputs.select_workspace_browser_shard == 'true'
    name: web-browser-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-26.04
    # Dependencies and groups retain their budgets; compilation is producer-only.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - *download_web_builder
      - *admit_web_builder
      - shell: *web_builder_shell
        run: test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/fvoci-web-builder-state/cargo/registry
            ${{ runner.temp }}/fvoci-web-builder-state/cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare owned pinned Rustup component metadata before input capture
        shell: *web_builder_shell
        run: |
          env -u CARGO_BUILD_TARGET -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR \
            -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u CARGO_BUILD_RUSTFLAGS \
            RUSTUP_AUTO_INSTALL=0 \
            cargo build --quiet --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target
          xtask/target/debug/xtask prepare-rustup-ci-metadata --output "$RUNNER_TEMP/fvoci-rustup-ci-metadata"
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        shell: *web_builder_shell
        run: |
          set -euo pipefail
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
          test "$(bun --version)" = 1.4.3
          test -f "$LIBCLANG_PATH/libclang.so"
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - *sqlite_input_hashes
      - name: Prepare locked dependencies
        shell: *web_builder_shell
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
          bun ci
      - name: Prepare Chromium and system libraries
        shell: *web_builder_shell
        run: |
          cd apps/web
          test "$(bun --bun x --no-install playwright --version)" = 'Version 1.64.0'
          test -d "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Require a successful exact browser producer artifact
        env:
          PRODUCER_RESULT: ${{ needs.workspace-browser-build.result }}
          PRODUCER_ARTIFACT: ${{ needs.workspace-browser-build.outputs.artifact_id }}
          PRODUCER_DIGEST: ${{ needs.workspace-browser-build.outputs.handoff_sha256 }}
        shell: *web_builder_shell
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RESULT" == success && "$PRODUCER_ARTIFACT" =~ ^[0-9]+$ && "$PRODUCER_DIGEST" =~ ^[0-9a-f]{64}$ ]]
      - name: Download this run's immutable browser producer artifact by ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.workspace-browser-build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/fvoci-browser-build-handoff
      - name: Real Vue browser shard ${{ matrix.shard }} with PostgreSQL app role
        id: browser
        env:
          FVOCI_WEB_BUILD_HANDOFF_SHA256: ${{ needs.workspace-browser-build.outputs.handoff_sha256 }}
        shell: *web_builder_shell
        run: |
          set -euo pipefail
          export FVOCI_SELECTED_CI_OUTPUT="$RUNNER_TEMP/fvoci-browser-current"
          export FVOCI_WEB_BUILD_HANDOFF="$RUNNER_TEMP/fvoci-browser-build-handoff"
          mkdir -m 0700 "$FVOCI_SELECTED_CI_OUTPUT"
          bash scripts/run-web-e2e.sh --ci-use-committed-api --ci-consume-browser --ci-shard ${{ matrix.shard }}
      - name: Retain failed browser DOM diagnostics
        if: (failure() || cancelled()) && steps.browser.outputs.failure-artifacts != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-shard-${{ matrix.shard }}-browser-failure-${{ github.run_attempt }}
          # Raw traces carry headers, cookies and bodies and stay on the runner;
          # upload the rendered DOM, the redacted trace digest, server logs and
          # the host netlink address/link event log.
          path: |
            ${{ steps.browser.outputs.failure-artifacts }}/playwright-output/**/error-context.md
            ${{ steps.browser.outputs.failure-artifacts }}/playwright-output/**/browser-summary.txt
            ${{ steps.browser.outputs.failure-artifacts }}/server.log
            ${{ steps.browser.outputs.failure-artifacts }}/owned-server/*.log
            ${{ steps.browser.outputs.failure-artifacts }}/net-events.log
          retention-days: 3
          if-no-files-found: warn

      - name: Retain failed browser handoff hash diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-shard-${{ matrix.shard }}-handoff-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fvoci-browser-current/handoff-input-*-safe.json
          if-no-files-found: warn
          retention-days: 3

      # Separate cold compilation budgets. Each phase hands its target to the next
      # job as a run-scoped artifact (caches can be evicted mid-run); these
      # artifacts are not qualified packets.
      - *retire_web_builder
      - *save_sqlite_input_hashes

  collaboration-main-build:
    needs: [ci-plan, web-builder]
    if: needs.ci-plan.outputs.select_collaboration_main_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.publish_native.outputs.artifact-id }}
      target_sha256: ${{ steps.native.outputs.target_sha256 }}
      native_identity: ${{ runner.arch }}-1.99.0-${{ github.sha }}-${{ github.run_attempt }}-${{ steps.sqlite.outputs.cache_identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - *download_web_builder
      - *admit_web_builder
      - shell: *web_builder_shell
        run: |
          fvoci_timing_started=$SECONDS
          printf 'ci-step stage=collaboration-main-build-step-05 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          trap 'fvoci_timing_exit=$?; printf "ci-step stage=collaboration-main-build-step-05 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
      - name: Restore Cargo downloads
        id: cache_main_cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/fvoci-web-builder-state/cargo/registry
            ${{ runner.temp }}/fvoci-web-builder-state/cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare owned pinned Rustup component metadata before input capture
        shell: *web_builder_shell
        run: |
          fvoci_timing_started=$SECONDS
          printf 'ci-step stage=collaboration-main-build-step-07 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          trap 'fvoci_timing_exit=$?; printf "ci-step stage=collaboration-main-build-step-07 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          env -u CARGO_BUILD_TARGET -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR \
            -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u CARGO_BUILD_RUSTFLAGS \
            RUSTUP_AUTO_INSTALL=0 \
            cargo build --quiet --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target
          xtask/target/debug/xtask prepare-rustup-ci-metadata --output "$RUNNER_TEMP/fvoci-rustup-ci-metadata"
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        shell: *web_builder_shell
        run: |
          fvoci_timing_started=$SECONDS
          printf 'ci-step stage=collaboration-main-build-step-08 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          trap 'fvoci_timing_exit=$?; printf "ci-step stage=collaboration-main-build-step-08 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          set -euo pipefail
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
          test "$(bun --version)" = 1.4.3
          test -f "$LIBCLANG_PATH/libclang.so"
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - *sqlite_input_hashes
      - name: Restore web gate Rust outputs
        id: cache_collaboration_main_seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v2-web-ubuntu-26.04-${{ runner.arch }}-1.99.0-db-api-schema-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Prepare locked dependencies
        shell: *web_builder_shell
        run: cargo fetch --locked
      - name: Compile native preparation
        shell: *web_builder_shell
        run: |
          set -euo pipefail
          cargo build --locked --offline --features db-tests,api-schema \
            --bin fvoci-server --bin fvoci-migrate --bin fvoci-e2e-fixture
      # tar keeps the modes and mtimes Cargo needs; the artifact zip would not.
      - name: Pack current native preparation
        id: native
        shell: *web_builder_shell
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/fvoci-native-main"
          tar --posix -cf - target | zstd -T0 --no-progress -o "$RUNNER_TEMP/fvoci-native-main/target.tar.zst"
          sha256="$(sha256sum "$RUNNER_TEMP/fvoci-native-main/target.tar.zst" | cut -d ' ' -f 1)"
          printf 'target_sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
      - name: Save current native preparation
        id: publish_native
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-native-main-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fvoci-native-main/target.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Save web gate Rust outputs
        if: github.ref == 'refs/heads/main' && steps.cache_collaboration_main_seed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
