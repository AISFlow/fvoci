        # Same per-test bound as the web and editor test scripts (node --test had none).
        shell: *web_builder_shell
        run: |
          fvoci_timing_started=$SECONDS
          printf 'ci-step stage=collaboration-install-on-step-14 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
