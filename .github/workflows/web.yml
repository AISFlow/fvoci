name: Web

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LIBCLANG_PATH: /usr/lib/llvm-18/lib
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_web_builder: ${{ steps.plan.outputs.select_web_builder }}
      select_web_checks: ${{ steps.plan.outputs.select_web_checks }}
      select_web_static: ${{ steps.plan.outputs.select_web_static }}
      select_workspace_browser_shard: ${{ steps.plan.outputs.select_workspace_browser_shard }}
      select_collaboration_main_build: ${{ steps.plan.outputs.select_collaboration_main_build }}
      select_collaboration_test_build: ${{ steps.plan.outputs.select_collaboration_test_build }}
      select_collaboration_build: ${{ steps.plan.outputs.select_collaboration_build }}
      select_collaboration_install_on: ${{ steps.plan.outputs.select_collaboration_install_on }}
      select_collaboration_postgres_on: ${{ steps.plan.outputs.select_collaboration_postgres_on }}
      select_collaboration_sqlite_on: ${{ steps.plan.outputs.select_collaboration_sqlite_on }}
      select_collaboration_postgres_off: ${{ steps.plan.outputs.select_collaboration_postgres_off }}
      select_collaboration_sqlite_off: ${{ steps.plan.outputs.select_collaboration_sqlite_off }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bun tools/ci/plan.ts \
            --workflow web \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  web-builder:
    needs: ci-plan
    if: "needs.ci-plan.outputs.select_web_builder == 'true'"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      artifact_id: "${{ steps.publish_builder.outputs.artifact-id }}"
      image_id: "${{ steps.builder.outputs.image_id }}"
      receipt_sha256: "${{ steps.builder.outputs.receipt_sha256 }}"
      archive_sha256: "${{ steps.builder.outputs.archive_sha256 }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Build and scan this source Web userspace
        id: builder
        env:
          DOCKER_CONFIG: "${{ runner.temp }}/fvoci-web-builder-docker"
        run: |
          set -euo pipefail
          [[ "$RUNNER_ARCH" == X64 && "$(uname -m)" == x86_64 && "$(id -u):$(id -g)" == 1001:1001 ]]
          bun tools/ci/ci-base-image.ts inputs
          bun test tools/ci/ci-base-image.test.ts
          client="$(readlink -f "$(command -v docker)")"
          [[ -f "$client" && ! -L "$client" && "$(stat -c %u "$client")" == 0 ]]
          test -z "$(find "$client" -perm /022 -print)"
          work="$(mktemp -d "$RUNNER_TEMP/fvoci-web-builder-work.XXXXXX")"
          packet="$RUNNER_TEMP/fvoci-web-builder"
          mkdir -m 0700 "$packet"
          install -m 0755 "$client" "$packet/docker-client"
          readelf -h "$packet/docker-client" | grep -Fq 'Advanced Micro Devices X86-64'
          if readelf -lW "$packet/docker-client" | grep -q INTERP; then exit 1; fi
          if readelf -dW "$packet/docker-client" | grep -q NEEDED; then exit 1; fi
          builder="fvoci-web-builder-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64"
          ref="fvoci-web-builder:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64"
          cleanup() {
            code=$?
            if ! docker buildx rm "$builder" >/dev/null 2>&1; then if [[ "$code" == 0 ]]; then code=1; fi; fi
            if ! docker image rm "$ref" >/dev/null 2>&1; then if [[ "$code" == 0 ]]; then code=1; fi; fi
            rm -rf "$work" "$DOCKER_CONFIG"
            exit "$code"
          }
          trap cleanup EXIT
          docker buildx create --name "$builder" --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build --platform linux/amd64 --file docker/ci-base/Dockerfile --target ci-web \
            --label "org.opencontainers.image.source=https://github.com/AISFlow/fvoci" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --provenance=false --progress=plain --tag "$ref" --load \
            --cache-from type=registry,ref=ghcr.io/aisflow/fvoci-ci-web:cache-amd64 docker/ci-base
          docker image inspect "$ref" --format '{{json .}}' > "$packet/image.json"
          docker image save "$ref" --output "$packet/image.tar"
          bun tools/ci/ci-base-image.ts web-export "$packet" "$GITHUB_OUTPUT"
          docker run --rm --network none "$ref" bash -e -o pipefail -c '
            test "$(id -u):$(id -g)" = 1000:1000
            test "$(rustc --version | cut -d" " -f2)" = 1.99.0
            test "$(bun --version)" = 1.4.3
            test -z "$(find /opt/rustup /opt/cargo ! -uid 0 -print -quit)"
            test -z "$(find -L /opt/rustup /opt/cargo -perm -0002 -print -quit)"
            test -z "$(find -L /opt/rustup /opt/cargo -writable -print -quit)"
            test -w "$CARGO_HOME/registry"
            test -w "$CARGO_HOME/git"
            cargo --version
            cargo fmt --version
            cargo clippy --version
            git --version
            zstd --version
            test ! -e /tmp/bootstrap-ca.crt
            dpkg-query -s ca-certificates
            grep -vE "  usr/share/(doc|man)/" /var/lib/dpkg/info/ca-certificates.md5sums | (cd / && md5sum --check --strict -)
            test -z "$(find /usr/local/share/ca-certificates -type f -print -quit)"
            test -s /etc/ssl/certs/ca-certificates.crt
            test -f "$LIBCLANG_PATH/libclang.so"
            browser=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -path "*/chrome-linux*/chrome" -print -quit)
            test -n "$browser"
            "$browser" --headless --no-sandbox --disable-gpu --dump-dom about:blank
          '
      - name: Publish this run scanned Web builder
        id: publish_builder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "web-builder-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/fvoci-web-builder/image.tar\n${{ runner.temp }}/fvoci-web-builder/image.json\n${{ runner.temp }}/fvoci-web-builder/docker-client\n${{ runner.temp }}/fvoci-web-builder/receipt.json"
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # Frontend static analysis runs once, without a Rust build or database.
  web-static:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_web_static == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Prepare locked frontend tools
        run: bun ci
      - name: Strict pinned ESLint and Vue support proofs
        run: |
          set -euo pipefail
          bun run lint:fixtures
          bun run lint
          bun run format:check
      - name: Strict web and editor TypeScript and Vue template types
        run: |
          set -euo pipefail
          (cd apps/web && bun --bun run typecheck)
          (cd packages/editor && bun --bun run typecheck)
      - name: Install smoke helper types and unit tests
        run: |
          set -euo pipefail
          bun --bun x --no-install tsc -p tools/install-smoke/tsconfig.json
          bun test ./tools/install-smoke/

  # API contract/schema and unit regressions run once per SHA. Native checks
  # keep a separate mandatory 15-minute budget with the same selection condition.
  web-checks:
    needs: [ci-plan, web-builder]
    if: needs.ci-plan.outputs.select_web_checks == 'true'
    runs-on: ubuntu-26.04
    # Cold target miss 113019000421 filled 913s, including 133s of an unfinished
    # test-profile compile. 23m is 780s before that compile, a measured 269s
    # test-profile envelope, a 112s larger-suite body analogue, 120s for the
    # unmeasured bun/plan steps, and 60s.
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - &download_web_builder
        name: Download this run exact scanned Web builder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: "${{ needs.web-builder.outputs.artifact_id }}"
          merge-multiple: true
          path: "${{ runner.temp }}/fvoci-web-builder"
      - &admit_web_builder
        name: Admit and load exact Web builder
        id: builder
        env:
          BUILDER_RESULT: "${{ needs.web-builder.result }}"
          BUILDER_ARTIFACT: "${{ needs.web-builder.outputs.artifact_id }}"
          BUILDER_RECEIPT: "${{ needs.web-builder.outputs.receipt_sha256 }}"
          BUILDER_IMAGE: "${{ needs.web-builder.outputs.image_id }}"
        run: |
          set -euo pipefail
          [[ "$BUILDER_RESULT" == success && "$BUILDER_ARTIFACT" =~ ^[0-9]+$ && "$BUILDER_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RUNNER_ARCH" == X64 && "$(uname -m)" == x86_64 && "$(id -u):$(id -g)" == 1001:1001 ]]
          bun tools/ci/ci-base-image.ts web-admit "$RUNNER_TEMP/fvoci-web-builder" "$BUILDER_RECEIPT" "$BUILDER_IMAGE"
          ref="fvoci-web-builder:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64"
          test -z "$(docker image ls --filter "reference=$ref" --format '{{.ID}}')"
          docker load --input "$RUNNER_TEMP/fvoci-web-builder/image.tar"
          printf 'image_loaded=true\n' >> "$GITHUB_OUTPUT"
          docker image inspect "$BUILDER_IMAGE" --format '{{json .}}' > "$RUNNER_TEMP/fvoci-web-builder-loaded.json"
          bun tools/ci/ci-base-image.ts web-loaded "$RUNNER_TEMP/fvoci-web-builder" "$BUILDER_RECEIPT" "$BUILDER_IMAGE" "$RUNNER_TEMP/fvoci-web-builder-loaded.json"
          chmod 0755 "$RUNNER_TEMP/fvoci-web-builder/docker-client"
          state="$RUNNER_TEMP/fvoci-web-builder-state"
          mkdir -m 0700 "$state"
          mkdir -m 0755 "$state/cargo" "$state/rustup"
          docker_gid="$(stat -c %g /var/run/docker.sock)"
          [[ "$docker_gid" =~ ^[1-9][0-9]*$ ]]
          printf 'docker_gid=%s\n' "$docker_gid" >> "$GITHUB_OUTPUT"
          docker run --rm --init --name "fvoci-web-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}" --network none --user 1001:1001 \
            --label "fvoci.web.run=$GITHUB_RUN_ID" --label "fvoci.web.attempt=$GITHUB_RUN_ATTEMPT" --label "fvoci.web.source=$GITHUB_SHA" \
            --mount "type=bind,source=$state/cargo,target=/home/runner/.cargo" \
            --mount "type=bind,source=$state/rustup,target=/home/runner/.rustup" \
            --env HOME=/home/runner --env CARGO_HOME=/home/runner/.cargo --env RUSTUP_HOME=/home/runner/.rustup \
            --env PATH=/home/runner/.cargo/bin:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            "$BUILDER_IMAGE" bash --noprofile --norc -e -o pipefail -c '
              test "$(id -u):$(id -g)" = 1001:1001
              test "$(/opt/cargo/bin/rustup --version | cut -d" " -f2)" = 1.29.1
              cp -a --no-preserve=ownership /opt/rustup/. "$RUSTUP_HOME/"
              mkdir -p "$CARGO_HOME/bin" "$CARGO_HOME/registry" "$CARGO_HOME/git"
              install -m 0755 /opt/cargo/bin/rustup "$CARGO_HOME/bin/rustup"
              for proxy in cargo cargo-clippy rustc rustdoc clippy-driver rust-gdb rust-gdbgui rust-lldb; do
                ln -s rustup "$CARGO_HOME/bin/$proxy"
              done
              rustup component remove rustfmt --toolchain 1.99.0
              test "$(rustc --version | cut -d" " -f2)" = 1.99.0
              diff -u <(printf "%s\n" cargo-x86_64-unknown-linux-gnu clippy-x86_64-unknown-linux-gnu rust-std-x86_64-unknown-linux-gnu rustc-x86_64-unknown-linux-gnu | sort) <(rustup component list --installed --toolchain 1.99.0 | sort)
            '
      - shell: &web_builder_shell >-
          docker run
          --rm
          --init
          --name fvoci-web-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
          --network host
          --ipc host
          --user 1001:1001
          --group-add ${{ steps.builder.outputs.docker_gid }}
          --label fvoci.web.run=${{ github.run_id }}
          --label fvoci.web.attempt=${{ github.run_attempt }}
          --label fvoci.web.source=${{ github.sha }}
          --mount type=bind,source=${{ github.workspace }},target=${{ github.workspace }}
          --mount type=bind,source=${{ runner.temp }},target=${{ runner.temp }}
          --mount type=bind,source=${{ runner.temp }}/fvoci-web-builder-state/cargo,target=/home/runner/.cargo
          --mount type=bind,source=${{ runner.temp }}/fvoci-web-builder-state/rustup,target=/home/runner/.rustup
          --mount type=bind,source=${{ runner.temp }}/fvoci-web-builder/docker-client,target=/usr/local/bin/docker,readonly
          --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock
          --workdir ${{ github.workspace }}
          --env HOME=/home/runner
          --env CARGO_HOME=/home/runner/.cargo
          --env RUSTUP_HOME=/home/runner/.rustup
          --env RUSTUP_TOOLCHAIN=1.99.0
          --env PATH=/home/runner/.cargo/bin:/usr/local/bin:/usr/bin:/bin
          --env PLAYWRIGHT_BROWSERS_PATH=/opt/playwright
          --env CI
          --env GITHUB_ACTIONS
          --env GITHUB_SHA
          --env GITHUB_REPOSITORY
          --env GITHUB_RUN_ID
          --env GITHUB_RUN_ATTEMPT
          --env GITHUB_JOB
          --env GITHUB_REF
          --env RUNNER_TEMP
          --env RUNNER_OS
          --env RUNNER_ARCH
          --env RUNNER_ENVIRONMENT
          --env GITHUB_WORKSPACE
          --env GITHUB_ENV
          --env GITHUB_OUTPUT
          --env GITHUB_STEP_SUMMARY
          --env LIBCLANG_PATH
          --env CARGO_BUILD_JOBS
          --env CARGO_INCREMENTAL
          --env CARGO_PROFILE_DEV_DEBUG
          --env CARGO_PROFILE_TEST_DEBUG
          --env SQLITE3_LIB_DIR
          --env SQLITE3_INCLUDE_DIR
          --env SQLITE3_NO_PKG_CONFIG
          --env SQLITE3_STATIC
          --env FVOCI_WEB_BUILD_PHASE
          --env FVOCI_E2E_PENDING
          --env FVOCI_COLLAB_LANE
          --env FVOCI_WEB_BUILD_HANDOFF_SHA256
          --env FVOCI_CLOSED_INSTALL_RECEIPT ${{ needs.web-builder.outputs.image_id }} bash
          --noprofile
          --norc -e -o pipefail "{0}"
        run: test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/fvoci-web-builder-state/cargo/registry
            ${{ runner.temp }}/fvoci-web-builder-state/cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        shell: *web_builder_shell
        run: |
          set -euo pipefail
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
          test "$(bun --version)" = 1.4.3
          test -f "$LIBCLANG_PATH/libclang.so"
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - &sqlite_input_hashes
        name: Record SQLite input hashes
        id: sqlite_diagnostics
        if: ${{ always() && steps.sqlite.outcome == 'success' }}
        run: |
          bun --no-env-file - <<'SQLITE_INPUT_HASHES'
          import { createHash } from "node:crypto";
          import { appendFileSync, lstatSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const parent = process.env.RUNNER_TEMP;
          const fail = () => { console.error("SQLite input diagnostics MISSING"); process.exit(0); };
          if (!parent) fail();
          const output = join(parent, "fvoci-sqlite-input-hashes");
          try { mkdirSync(output, { mode: 0o700 }); } catch { fail(); }
          const hash = (value) => createHash("sha256").update(value).digest("hex");
          const fields = ["inputs", "exports", "wrapper_sha256", "os_release", "architecture", "packages", "libclang_path", "libclang_sha256", "build_environment_sha256", "rustc"];
          const limit = 512;
          let diagnostic = { schema: 1, status: "unavailable" };
          try {
            const path = join(parent, "fvoci-sqlite/consumer-inputs.json");
            const stat = lstatSync(path);
            if (!stat.isFile() || stat.size > 4 * 1024 * 1024) throw new Error();
            const bytes = readFileSync(path);
            if (bytes.length > 4 * 1024 * 1024) throw new Error();
            const input = JSON.parse(bytes.toString("utf8"));
            if (!input || Array.isArray(input) || !fields.every((key) => Object.hasOwn(input, key)) ||
                !fields.every((key) => ["inputs", "exports"].includes(key)
                  ? input[key] && typeof input[key] === "object" && !Array.isArray(input[key])
                  : typeof input[key] === "string") || typeof input.cache_identity !== "string" ||
                !/^[0-9a-f]{64}$/.test(input.cache_identity)) throw new Error();
            const rows = input.packages.split("\n");
            if (rows.at(-1) === "") rows.pop();
            if (rows.length === 0) throw new Error();
            const seen = new Set();
            const packages = rows.map((line) => {
              const match = /^([a-z0-9][a-z0-9+.:_-]*)\t([0-9A-Za-z+.:~_-]+)$/.exec(line);
              if (!match || seen.has(match[1])) throw new Error();
              seen.add(match[1]);
              return [hash(match[1]), hash(match[2])];
            }).sort(([a], [b]) => a.localeCompare(b));
            diagnostic = {
              schema: 1, status: "available", identity_sha256: input.cache_identity,
              fields: Object.fromEntries(fields.map((key) => [key, hash(JSON.stringify(input[key]))])),
              packages_sha256: hash(input.packages), package_count: packages.length,
              package_entry_limit: limit, packages_truncated: packages.length > limit,
              package_entries: packages.slice(0, limit),
            };
          } catch { /* Non-authoritative diagnostics never replace preparation or refusal. */ }
          try {
            writeFileSync(join(output, "hashes.json"), JSON.stringify(diagnostic) + "\n", { mode: 0o600, flag: "wx" });
            if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, "written=true\n");
          } catch { fail(); }
          SQLITE_INPUT_HASHES
      - name: Restore web gate Rust outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v3-web-checks-ubuntu-26.04-${{ runner.arch }}-1.99.0-default-api-schema-devdebug0-testdebug0-${{ github.sha }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', 'packages/**', 'apps/**', 'third-party/**', 'patches/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Prepare locked dependencies
        shell: *web_builder_shell
        run: |
          cargo fetch --locked
          bun ci
      - name: Generate and verify the API contract
        shell: *web_builder_shell
        run: |
          bash scripts/generate-api.sh
          git diff --exit-code -- apps/web/openapi.json apps/web/src/generated/api.ts
      - name: Check API schema
        shell: *web_builder_shell
        run: |
          cargo test --locked --offline --lib --features api-schema api::openapi::tests
      - name: Web and editor unit regressions
        shell: *web_builder_shell
        run: |
          (cd apps/web && bun run test)
          (cd packages/editor && bun run test)
          (cd apps/web && bun test e2e-pending/collab-playwright.config.test.ts --timeout 60000)
      - name: Verify normal web e2e shard plan
        shell: *web_builder_shell
        run: |
          bash scripts/test-web-e2e-groups.sh
      - &retire_web_builder
        name: Retire this job owned Web builder
        if: always()
        env:
          BUILDER_LOADED: ${{ steps.builder.outputs.image_loaded }}
          BUILDER_IMAGE: "${{ needs.web-builder.outputs.image_id }}"
        run: |
          set -euo pipefail
          name="fvoci-web-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}"
          ids="$(docker container ls -aq --filter "name=^$name$")"
          if [[ -n "$ids" ]]; then
            [[ "$ids" =~ ^[0-9a-f]+$ ]]
            [[ "$(docker inspect "$ids" --format '{{index .Config.Labels "fvoci.web.run"}}')" == "$GITHUB_RUN_ID" ]]
            [[ "$(docker inspect "$ids" --format '{{index .Config.Labels "fvoci.web.attempt"}}')" == "$GITHUB_RUN_ATTEMPT" ]]
            [[ "$(docker inspect "$ids" --format '{{index .Config.Labels "fvoci.web.source"}}')" == "$GITHUB_SHA" ]]
            docker stop "$ids"
            remaining="$(docker container ls -aq --filter "name=^$name$")"
            if [[ -n "$remaining" ]]; then docker rm -v "$ids"; fi
          fi
          test -z "$(docker container ls -aq --filter "name=^$name$")"
          ref="fvoci-web-builder:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64"
          if [[ "$BUILDER_LOADED" == true && -n "$(docker image ls --filter "reference=$ref" --format '{{.ID}}')" ]]; then
            [[ "$(docker image inspect "$ref" --format '{{.Id}}')" == "$BUILDER_IMAGE" ]]
            docker image rm "$ref"
          fi
      - &save_sqlite_input_hashes
        name: Retain SQLite input hashes
        if: ${{ always() && steps.sqlite_diagnostics.outputs.written == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-input-hashes-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fvoci-sqlite-input-hashes/hashes.json
