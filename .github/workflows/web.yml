      target_sha256: ${{ steps.native.outputs.target_sha256 }}
      native_identity: ${{ runner.arch }}-1.99.0-${{ github.sha }}-${{ github.run_attempt }}-${{ steps.sqlite.outputs.cache_identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - *download_web_builder
      - *admit_web_builder
      - shell: *web_builder_shell
        run: |
          fvoci_timing_started=$SECONDS
          printf 'ci-step stage=collaboration-test-build-step-05 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          trap 'fvoci_timing_exit=$?; printf "ci-step stage=collaboration-test-build-step-05 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
      - name: Restore Cargo downloads
        id: cache_tests_cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/fvoci-web-builder-state/cargo/registry
            ${{ runner.temp }}/fvoci-web-builder-state/cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare owned pinned Rustup component metadata before input capture
        shell: *web_builder_shell
        run: |
          fvoci_timing_started=$SECONDS
          printf 'ci-step stage=collaboration-test-build-step-07 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          trap 'fvoci_timing_exit=$?; printf "ci-step stage=collaboration-test-build-step-07 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          env -u CARGO_BUILD_TARGET -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR \
            -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u CARGO_BUILD_RUSTFLAGS \
            RUSTUP_AUTO_INSTALL=0 \
            cargo build --quiet --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target
          xtask/target/debug/xtask prepare-rustup-ci-metadata --output "$RUNNER_TEMP/fvoci-rustup-ci-metadata"
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        shell: *web_builder_shell
        run: |
          fvoci_timing_started=$SECONDS
          printf 'ci-step stage=collaboration-test-build-step-08 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          trap 'fvoci_timing_exit=$?; printf "ci-step stage=collaboration-test-build-step-08 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          set -euo pipefail
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
          test "$(bun --version)" = 1.4.3
          test -f "$LIBCLANG_PATH/libclang.so"
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - *sqlite_input_hashes
      # The producer's arch/SHA/attempt/SQLite identity must equal this job's.
      - name: Require exact current native preparation
        env:
          PRODUCER_RESULT: ${{ needs.collaboration-main-build.result }}
          PRODUCER_ARTIFACT: ${{ needs.collaboration-main-build.outputs.artifact_id }}
          PRODUCER_DIGEST: ${{ needs.collaboration-main-build.outputs.target_sha256 }}
          PRODUCER_IDENTITY: ${{ needs.collaboration-main-build.outputs.native_identity }}
          CURRENT_IDENTITY: ${{ runner.arch }}-1.99.0-${{ github.sha }}-${{ github.run_attempt }}-${{ steps.sqlite.outputs.cache_identity }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RESULT" == success && "$PRODUCER_ARTIFACT" =~ ^[0-9]+$ && "$PRODUCER_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CURRENT_IDENTITY" =~ ^[A-Z0-9]+-1\.99\.0-[0-9a-f]{40}-[1-9][0-9]*-[0-9a-f]{64}$ && "$PRODUCER_IDENTITY" == "$CURRENT_IDENTITY" ]]
      - name: Download this run's exact native preparation by ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.collaboration-main-build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/fvoci-native-main
      - name: Restore current native preparation
        env:
          PRODUCER_DIGEST: ${{ needs.collaboration-main-build.outputs.target_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/fvoci-native-main/target.tar.zst"
          printf '%s  %s\n' "$PRODUCER_DIGEST" "$archive" | sha256sum --check --strict --quiet -
          zstd -dc --no-progress -- "$archive" | tar -xf -
          rm -- "$archive"
