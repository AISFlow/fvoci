name: Web

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LIBCLANG_PATH: /usr/lib/llvm-18/lib
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

# GitHub step timestamps and conclusions supply wall time and exit evidence;
# the existing Web runner records elapsed time and status for its inner stages.

jobs:
  ci-plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_web_checks: ${{ steps.plan.outputs.select_web_checks }}
      select_web_static: ${{ steps.plan.outputs.select_web_static }}
      select_workspace_browser_shard: ${{ steps.plan.outputs.select_workspace_browser_shard }}
      select_collaboration_build: ${{ steps.plan.outputs.select_collaboration_build }}
      select_collaboration_install_on: ${{ steps.plan.outputs.select_collaboration_install_on }}
      select_collaboration_postgres_on: ${{ steps.plan.outputs.select_collaboration_postgres_on }}
      select_collaboration_sqlite_on: ${{ steps.plan.outputs.select_collaboration_sqlite_on }}
      select_collaboration_postgres_off: ${{ steps.plan.outputs.select_collaboration_postgres_off }}
      select_collaboration_sqlite_off: ${{ steps.plan.outputs.select_collaboration_sqlite_off }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bun tools/ci/plan.ts \
            --workflow web \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  # Frontend static analysis runs once, without a Rust build or database.
  web-static:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_web_static == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Prepare locked frontend tools
        run: bun ci
      - name: Strict pinned ESLint and Vue support proofs
        run: |
          set -euo pipefail
          bun run lint:fixtures
          bun run lint
          bun run format:check
      - name: Strict web and editor TypeScript and Vue template types
        run: |
          set -euo pipefail
          (cd apps/web && bun --bun run typecheck)
          (cd packages/editor && bun --bun run typecheck)
      - name: Install smoke helper types and unit tests
        run: |
          set -euo pipefail
          bun --bun x --no-install tsc -p tools/install-smoke/tsconfig.json
          bun test ./tools/install-smoke/

  # API contract/schema and unit regressions run once per SHA. Native checks
  # keep a separate mandatory 15-minute budget with the same selection condition.
  web-checks:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_web_checks == 'true'
    runs-on: ubuntu-26.04
    # Cold target miss 113019000421 filled 913s, including 133s of an unfinished
    # test-profile compile. 23m is 780s before that compile, a measured 269s
    # test-profile envelope, a 112s larger-suite body analogue, 120s for the
    # unmeasured bun/plan steps, and 60s.
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'APT::Get::Always-Include-Phased-Updates "true";' 'APT::Get::Never-Include-Phased-Updates "false";' | sudo tee /etc/apt/apt.conf.d/99fvoci-phased-updates >/dev/null
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o APT::Update::Error-Mode=any update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-remove gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8 linux-libc-dev libcrypt-dev
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - &sqlite_input_hashes
        name: Record SQLite input hashes
        id: sqlite_diagnostics
        if: ${{ always() && steps.sqlite.outcome == 'success' }}
        run: |
          bun --no-env-file - <<'SQLITE_INPUT_HASHES'
          import { createHash } from "node:crypto";
          import { appendFileSync, lstatSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const parent = process.env.RUNNER_TEMP;
          const fail = () => { console.error("SQLite input diagnostics MISSING"); process.exit(0); };
          if (!parent) fail();
          const output = join(parent, "fvoci-sqlite-input-hashes");
          try { mkdirSync(output, { mode: 0o700 }); } catch { fail(); }
          const hash = (value) => createHash("sha256").update(value).digest("hex");
          const fields = ["inputs", "exports", "wrapper_sha256", "os_release", "architecture", "libclang_path", "libclang_sha256", "libclang_files", "build_environment_sha256", "rustc"];
          const limit = 512;
          let diagnostic = { schema: 1, status: "unavailable" };
          try {
            const path = join(parent, "fvoci-sqlite/consumer-inputs.json");
            const stat = lstatSync(path);
            if (!stat.isFile() || stat.size > 4 * 1024 * 1024) throw new Error();
            const bytes = readFileSync(path);
            if (bytes.length > 4 * 1024 * 1024) throw new Error();
            const input = JSON.parse(bytes.toString("utf8"));
            if (!input || Array.isArray(input) || !fields.every((key) => Object.hasOwn(input, key)) ||
                !fields.every((key) => ["inputs", "exports", "libclang_files"].includes(key)
                  ? input[key] && typeof input[key] === "object" && !Array.isArray(input[key])
                  : typeof input[key] === "string") || typeof input.cache_identity !== "string" ||
                !/^[0-9a-f]{64}$/.test(input.cache_identity)) throw new Error();
            const packagePath = join(parent, "fvoci-sqlite/build-packages.txt");
            const packageStat = lstatSync(packagePath);
            if (!packageStat.isFile() || packageStat.size > 4 * 1024 * 1024) throw new Error();
            const packageBytes = readFileSync(packagePath);
            if (packageBytes.length > 4 * 1024 * 1024) throw new Error();
            const packageText = packageBytes.toString("utf8");
            const rows = packageText.split("\n");
            if (rows.at(-1) === "") rows.pop();
            if (rows.length === 0) throw new Error();
            const seen = new Set();
            const packages = rows.map((line) => {
              const match = /^([a-z0-9][a-z0-9+.:_-]*)\t([0-9A-Za-z+.:~_-]+)$/.exec(line);
              if (!match || seen.has(match[1])) throw new Error();
              seen.add(match[1]);
              return [hash(match[1]), hash(match[2])];
            }).sort(([a], [b]) => a.localeCompare(b));
            diagnostic = {
              schema: 1, status: "available", identity_sha256: input.cache_identity,
              fields: Object.fromEntries(fields.map((key) => [key, hash(JSON.stringify(input[key]))])),
              packages_sha256: hash(packageText), package_count: packages.length,
              package_entry_limit: limit, packages_truncated: packages.length > limit,
              package_entries: packages.slice(0, limit),
            };
          } catch { /* Non-authoritative diagnostics never replace preparation or refusal. */ }
          try {
            writeFileSync(join(output, "hashes.json"), JSON.stringify(diagnostic) + "\n", { mode: 0o600, flag: "wx" });
            if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, "written=true\n");
          } catch { fail(); }
          SQLITE_INPUT_HASHES
      - name: Restore web gate Rust outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v3-web-checks-ubuntu-26.04-${{ runner.arch }}-1.99.0-default-api-schema-devdebug0-testdebug0-${{ github.sha }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', 'packages/**', 'apps/**', 'third-party/**', 'patches/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Prepare locked dependencies
        run: |
          cargo fetch --locked
          bun ci
      - name: Generate and verify the API contract
        run: |
          bash scripts/generate-api.sh
          git diff --exit-code -- apps/web/openapi.json apps/web/src/generated/api.ts
      - name: Check API schema
        run: |
          cargo test --locked --offline --lib --features api-schema api::openapi::tests
      - name: Web and editor unit regressions
        run: |
          (cd apps/web && bun run test)
          (cd packages/editor && bun run test)
          (cd apps/web && bun test e2e-pending/collab-playwright.config.test.ts --timeout 60000)
      - name: Verify normal web e2e shard plan
        run: |
          bash scripts/test-web-e2e-groups.sh
      - &save_sqlite_input_hashes
        name: Retain SQLite input hashes
        if: ${{ always() && steps.sqlite_diagnostics.outputs.written == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-input-hashes-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fvoci-sqlite-input-hashes/hashes.json
          if-no-files-found: warn
          retention-days: 3

  web-native-checks:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_web_checks == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'APT::Get::Always-Include-Phased-Updates "true";' 'APT::Get::Never-Include-Phased-Updates "false";' | sudo tee /etc/apt/apt.conf.d/99fvoci-phased-updates >/dev/null
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o APT::Update::Error-Mode=any update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-remove gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8 linux-libc-dev libcrypt-dev
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - *sqlite_input_hashes
      - name: Restore native web gate Rust outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v1-web-native-checks-ubuntu-26.04-${{ runner.arch }}-1.99.0-clippy-db-tests-api-schema-static-default-devdebug0-testdebug0-${{ github.sha }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', 'packages/**', 'apps/**', 'third-party/**', 'patches/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Prepare locked dependencies
        run: |
          cargo fetch --locked
          bun ci
      - name: Check strict Clippy and default static transport
        run: |
          cargo clippy --locked --offline --all-targets --features db-tests,api-schema -- -D warnings
          cargo test --locked --offline --test static_api

      # Exact default-feature browser binaries and fresh dist, built once for all shards.
      - *save_sqlite_input_hashes

  workspace-browser-build:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_workspace_browser_shard == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact-id }}
      handoff_sha256: ${{ steps.prepare.outputs.handoff_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare owned pinned Rustup component metadata before input capture
        run: |
          env -u CARGO_BUILD_TARGET -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR \
            -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u CARGO_BUILD_RUSTFLAGS \
            RUSTUP_AUTO_INSTALL=0 \
            cargo build --quiet --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target
          xtask/target/debug/xtask prepare-rustup-ci-metadata --output "$RUNNER_TEMP/fvoci-rustup-ci-metadata"
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'APT::Get::Always-Include-Phased-Updates "true";' 'APT::Get::Never-Include-Phased-Updates "false";' | sudo tee /etc/apt/apt.conf.d/99fvoci-phased-updates >/dev/null
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o APT::Update::Error-Mode=any update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-remove gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8 linux-libc-dev libcrypt-dev
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - *sqlite_input_hashes
      - name: Restore web gate Rust outputs
        id: cache_workspace_browser_shard_5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v1-web-browser-default-fixture-ubuntu-26.04-${{ runner.arch }}-1.99.0-default-server-db-tests-fixture-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Restore production collaboration helper outputs
        id: cache_workspace_browser_shard_6
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/collab-engine/target
          key: v1-web-browser-worker-helper-ubuntu-26.04-${{ runner.arch }}-1.99.0-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-${{ hashFiles('crates/collab-engine/src/**') }}
          restore-keys: v1-web-browser-worker-helper-ubuntu-26.04-${{ runner.arch }}-1.99.0-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-
      - name: Prepare locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
          bun ci
      - name: Prepare Chromium and system libraries
        working-directory: apps/web
        run: bun --bun x --no-install playwright install --with-deps chromium
      - name: Build and qualify ordinary browser outputs without DB credentials
        id: prepare
        run: |
          set -euo pipefail
          export FVOCI_SELECTED_CI_OUTPUT="$RUNNER_TEMP/fvoci-browser-current"
          export FVOCI_WEB_BUILD_HANDOFF="$RUNNER_TEMP/fvoci-browser-build-handoff"
          mkdir -m 0700 "$FVOCI_SELECTED_CI_OUTPUT"
          bash scripts/run-web-e2e.sh --ci-use-committed-api --ci-prepare-browser
      - name: Publish the exact successful browser packet
        id: publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-build-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fvoci-browser-build-handoff/handoff.json
            ${{ runner.temp }}/fvoci-browser-build-handoff/payload.tar
          if-no-files-found: error
          retention-days: 1
      - name: Retain failed browser compilation diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-compile-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fvoci-browser-current/*-stderr.log
            ${{ runner.temp }}/fvoci-browser-current/*-stage.json
            ${{ runner.temp }}/fvoci-browser-current/handoff-input-*-safe.json
          if-no-files-found: warn
          retention-days: 3
      - name: Save web gate Rust outputs
        if: github.ref == 'refs/heads/main' && steps.cache_workspace_browser_shard_5.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v1-web-browser-default-fixture-ubuntu-26.04-${{ runner.arch }}-1.99.0-default-server-db-tests-fixture-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Save production collaboration helper outputs
        if: github.ref == 'refs/heads/main' && steps.cache_workspace_browser_shard_6.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/collab-engine/target
          key: v1-web-browser-worker-helper-ubuntu-26.04-${{ runner.arch }}-1.99.0-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}-${{ hashFiles('crates/collab-engine/src/**') }}
      - *save_sqlite_input_hashes

  workspace-browser-container-build:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_workspace_browser_shard == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact-id }}
      handoff_sha256: ${{ steps.prepare.outputs.handoff_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Build and qualify ordinary container browser outputs
        id: prepare
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          bun --no-env-file tools/web-e2e/run-web-e2e.ts container-browser "$GITHUB_WORKSPACE"
          --prepare --handoff "$RUNNER_TEMP/fvoci-browser-container-packet"
      - name: Publish the exact successful container browser packet
        id: publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-browser-container-build-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fvoci-browser-container-packet/handoff.json
            ${{ runner.temp }}/fvoci-browser-container-packet/payload.tar
          if-no-files-found: error
          retention-days: 1

  workspace-browser-shard:
    needs: [ci-plan, workspace-browser-build, workspace-browser-container-build]
    if: needs.ci-plan.outputs.select_workspace_browser_shard == 'true'
    name: web-browser-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-26.04
    # Dependencies and groups retain their budgets; compilation is producer-only.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - if: contains(fromJSON('[5]'), matrix.shard)
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Restore Cargo downloads
        if: contains(fromJSON('[5]'), matrix.shard)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare owned pinned Rustup component metadata before input capture
        if: contains(fromJSON('[5]'), matrix.shard)
        run: |
          env -u CARGO_BUILD_TARGET -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR \
            -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u CARGO_BUILD_RUSTFLAGS \
            RUSTUP_AUTO_INSTALL=0 \
            cargo build --quiet --locked --manifest-path xtask/Cargo.toml --target-dir xtask/target
          xtask/target/debug/xtask prepare-rustup-ci-metadata --output "$RUNNER_TEMP/fvoci-rustup-ci-metadata"
      - name: Prepare pinned SQLite root build inputs
        if: contains(fromJSON('[5]'), matrix.shard)
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'APT::Get::Always-Include-Phased-Updates "true";' 'APT::Get::Never-Include-Phased-Updates "false";' | sudo tee /etc/apt/apt.conf.d/99fvoci-phased-updates >/dev/null
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o APT::Update::Error-Mode=any update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-remove gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8 linux-libc-dev libcrypt-dev
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - *sqlite_input_hashes
      - name: Prepare locked dependencies
        if: contains(fromJSON('[5]'), matrix.shard)
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
          bun ci
      - name: Prepare Chromium and system libraries
        if: contains(fromJSON('[5]'), matrix.shard)
        working-directory: apps/web
        run: bun --bun x --no-install playwright install --with-deps chromium
      - name: Require a successful exact browser producer artifact
        if: contains(fromJSON('[5]'), matrix.shard)
        env:
          PRODUCER_RESULT: ${{ needs.workspace-browser-build.result }}
          PRODUCER_ARTIFACT: ${{ needs.workspace-browser-build.outputs.artifact_id }}
          PRODUCER_DIGEST: ${{ needs.workspace-browser-build.outputs.handoff_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RESULT" == success && "$PRODUCER_ARTIFACT" =~ ^[0-9]+$ && "$PRODUCER_DIGEST" =~ ^[0-9a-f]{64}$ ]]
      - name: Download this run's immutable browser producer artifact by ID
        if: contains(fromJSON('[5]'), matrix.shard)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.workspace-browser-build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/fvoci-browser-build-handoff
      - name: Real Vue browser shard ${{ matrix.shard }} with PostgreSQL app role
        if: contains(fromJSON('[5]'), matrix.shard)
        id: browser
        env:
          FVOCI_WEB_BUILD_HANDOFF_SHA256: ${{ needs.workspace-browser-build.outputs.handoff_sha256 }}
        run: |
          set -euo pipefail
          export FVOCI_SELECTED_CI_OUTPUT="$RUNNER_TEMP/fvoci-browser-current"
          export FVOCI_WEB_BUILD_HANDOFF="$RUNNER_TEMP/fvoci-browser-build-handoff"
          mkdir -m 0700 "$FVOCI_SELECTED_CI_OUTPUT"
          bash scripts/run-web-e2e.sh --ci-use-committed-api --ci-consume-browser --ci-shard ${{ matrix.shard }}
      - name: Require a successful exact container browser producer artifact
        if: "!contains(fromJSON('[5]'), matrix.shard)"
        env:
          PRODUCER_RESULT: ${{ needs.workspace-browser-container-build.result }}
          PRODUCER_ARTIFACT: ${{ needs.workspace-browser-container-build.outputs.artifact_id }}
          PRODUCER_DIGEST: ${{ needs.workspace-browser-container-build.outputs.handoff_sha256 }}
        run: bun --no-env-file tools/web-e2e/run-web-e2e.ts require-browser-producer
      - name: Download this runs immutable container browser packet by ID
        if: "!contains(fromJSON('[5]'), matrix.shard)"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.workspace-browser-container-build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/fvoci-browser-container-packet
      - name: Real container Vue browser shard ${{ matrix.shard }} with PostgreSQL app role
        if: "!contains(fromJSON('[5]'), matrix.shard)"
        id: container_browser
        env:
          TMPDIR: ${{ runner.temp }}
          FVOCI_WEB_BUILD_HANDOFF_SHA256: ${{ needs.workspace-browser-container-build.outputs.handoff_sha256 }}
        run: >-
          bun --no-env-file tools/web-e2e/run-web-e2e.ts container-browser "$GITHUB_WORKSPACE"
          --consume ${{ matrix.shard }} --handoff "$RUNNER_TEMP/fvoci-browser-container-packet"
          --handoff-sha256 "$FVOCI_WEB_BUILD_HANDOFF_SHA256"

      - name: Retain failed browser DOM diagnostics
        if: (failure() || cancelled()) && (steps.browser.outputs.failure-artifacts || steps.container_browser.outputs.failure-artifacts) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-shard-${{ matrix.shard }}-browser-failure-${{ github.run_attempt }}
          # Raw traces carry headers, cookies and bodies and stay on the runner;
          # upload the rendered DOM, the redacted trace digest, server logs and
          # the host netlink address/link event log.
          path: |
            ${{ (steps.browser.outputs.failure-artifacts || steps.container_browser.outputs.failure-artifacts) }}/playwright-output/**/error-context.md
            ${{ (steps.browser.outputs.failure-artifacts || steps.container_browser.outputs.failure-artifacts) }}/playwright-output/**/browser-summary.txt
            ${{ (steps.browser.outputs.failure-artifacts || steps.container_browser.outputs.failure-artifacts) }}/server.log
            ${{ (steps.browser.outputs.failure-artifacts || steps.container_browser.outputs.failure-artifacts) }}/owned-server/*.log
            ${{ (steps.browser.outputs.failure-artifacts || steps.container_browser.outputs.failure-artifacts) }}/net-events.log
          retention-days: 3
          if-no-files-found: warn

      - name: Retain failed browser handoff hash diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-shard-${{ matrix.shard }}-handoff-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fvoci-browser-current/handoff-input-*-safe.json
          if-no-files-found: warn
          retention-days: 3

      - name: Retain failed container browser handoff hash diagnostics
        if: (failure() || cancelled()) && steps.container_browser.outputs.handoff-diagnostics != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-shard-${{ matrix.shard }}-container-handoff-diagnostics-${{ github.run_attempt }}
          path: ${{ steps.container_browser.outputs.handoff-diagnostics }}/handoff-input-*-safe.json
          if-no-files-found: warn
          retention-days: 3

      # Separate cold compilation budgets. Each phase hands its target to the next
      # job as a run-scoped artifact (caches can be evicted mid-run); these
      # artifacts are not qualified packets.
      - *save_sqlite_input_hashes

  collaboration-build:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_collaboration_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact-id }}
      handoff_sha256: ${{ steps.prepare.outputs.handoff_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
