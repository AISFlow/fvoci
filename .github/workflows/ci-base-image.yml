name: CI base image

on:
  pull_request:
    paths: &image-paths
      - docker/ci-base/**
      - .dockerignore
      - tools/ci/ci-base-image.ts
      - tools/ci/ci-base-image.test.ts
      - .github/workflows/ci-base-image.yml
      - rust-toolchain.toml
      - xtask/Cargo.toml
      - xtask/Cargo.lock
      - xtask/src/**
      - xtask/*.tsv
      - tests/support/official_sqld.rs
      - .bun-version
      - apps/web/package.json
  push:
    branches: [main]
    paths: *image-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-base-image-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request'
    strategy: &native-matrix
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [ci-base, ci-web]
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps: &image-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned Bun on native runner
        run: &bun-bootstrap |
          set -euo pipefail
          work="$RUNNER_TEMP/ci-base-bun"
          mkdir "$work"
          case "$(uname -m)" in
            x86_64) archive=bun-linux-x64; checksum=3e730528d89775f03f87f05c06787c4df4099d0a37f3f252e7b829cb23816e18 ;;
            aarch64) archive=bun-linux-aarch64; checksum=efa9813da5ed72423bf847f916e8d2c47c0d776add972354026a75e10da9aa21 ;;
            *) exit 1 ;;
          esac
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/$archive.zip" -o "$work/bun.zip"
          printf '%s  %s\n' "$checksum" "$work/bun.zip" | sha256sum --check --strict
          unzip -q "$work/bun.zip" -d "$work"
          test "$("$work/$archive/bun" --version)" = 1.4.3
          printf '%s\n' "$work/$archive" >> "$GITHUB_PATH"
      - name: GHCR login (publication only)
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/ci-base-docker
        run: bun tools/ci/ci-base-image.ts login
      - name: Native build, inspect and publish only after checks
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.image }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
          DOCKER_CONFIG: ${{ runner.temp }}/ci-base-docker
        run: bun tools/ci/ci-base-image.ts native-build

  push:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy: *native-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps: *image-steps

  push-manifest:
    if: github.ref == 'refs/heads/main'
    needs: push
    strategy:
      fail-fast: false
      matrix:
        image: [ci-base, ci-web]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned Bun on native runner
        run: *bun-bootstrap
      - name: Publish multi-arch manifest by verified digests
        env:
          GHCR_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.image }}
          DOCKER_CONFIG: ${{ runner.temp }}/ci-base-manifest-docker
        run: bun tools/ci/ci-base-image.ts publish-manifest
