name: Turso isolated primary connection and migration

on:
  push:
    branches: [fvoci/v060-turso-verified-connection]
  workflow_dispatch:
    inputs:
      phase:
        description: Connection read-only; migration requires both destructive gates; others NOT IMPLEMENTED
        type: choice
        default: connection
        options: [connection, crud, transactions, migration, persistence, restore, ui-ack]
      destructive:
        description: Explicit isolated test DB mutation confirmation (connection must be false)
        type: boolean
        default: false

permissions:
  contents: read

# One fixed Environment/test DB, including future mutating phases. Never cancel
# an earlier run or use a run ID as the serialization key.
concurrency:
  group: fvoci-turso-test-database
  cancel-in-progress: false

jobs:
  admission:
    if: github.repository == 'AISFlow/fvoci' && ((github.event_name == 'push' && github.ref == 'refs/heads/fvoci/v060-turso-verified-connection') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fvoci/v060-turso-verified-connection')))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      environment_id: ${{ steps.admit.outputs.environment_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pure admission fixtures (no credentials or network)
        run: python3 scripts/selected-backend-ci/turso-test-fixtures.py
      - name: Verify preexisting Environment (no configuration writes)
        id: admit
        run: python3 scripts/selected-backend-ci/turso-test-guard.py --admit

  turso-connection:
    needs: admission
    if: github.event_name == 'workflow_dispatch' && github.repository == 'AISFlow/fvoci' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fvoci/v060-turso-verified-connection') && needs.admission.result == 'success' && needs.admission.outputs.environment_id != ''
    environment: fvoci-turso-test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Credential-free compiler and maintained SQLite inputs
        run: |
          set -euo pipefail
          printf 'CARGO_TARGET_DIR=%s/turso-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
          cargo fetch --locked
      - name: Credential-free current library test compilation
        run: |
          set -euo pipefail
          cargo test --locked --offline --lib --features db-tests --jobs 4 --no-run --message-format=json > "$RUNNER_TEMP/turso-compile.json"
          python3 scripts/selected-backend-ci/turso-test-guard.py --freeze
      - name: Real primary selected phase (exactly one test)
        env:
          FVOCI_DATABASE_BACKEND: libsql-remote
          FVOCI_LIBSQL_URL: ${{ secrets.FVOCI_TEST_TURSO_DATABASE_URL }}
          FVOCI_LIBSQL_AUTH_TOKEN: ${{ secrets.FVOCI_TEST_TURSO_AUTH_TOKEN }}
          FVOCI_TEST_TURSO_ALLOW_DESTRUCTIVE: ${{ vars.FVOCI_TEST_TURSO_ALLOW_DESTRUCTIVE }}
        run: python3 scripts/selected-backend-ci/turso-test-guard.py --consume

# No upload of raw runtime output, credential files, SDK errors or traces.
