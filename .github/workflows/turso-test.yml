name: Turso isolated primary connection and migration

on:
  push:
    branches: [fvoci/v060-turso-verified-connection]
  workflow_dispatch:
    inputs:
      phase:
        description: Connection, inventory and ui-baseline read-only; migration, reset and ui-ack require both destructive gates; others NOT IMPLEMENTED
        type: choice
        default: connection
        options: [connection, crud, transactions, migration, inventory, reset, persistence, restore, ui-ack, ui-baseline]
      destructive:
        description: Explicit isolated test DB mutation confirmation (connection, inventory and ui-baseline must be false)
        type: boolean
        default: false
      ui_source_sha:
        description: ROOT reviewed exact UI source SHA (ui-baseline and ui-ack only)
        type: string
        default: ''
      ui_baseline_sha256:
        description: ROOT verified just-observed current dataset digest (ui-ack only)
        type: string
        default: ''
      ui_target_sha256:
        description: ROOT verified just-observed primary target digest (ui-ack only)
        type: string
        default: ''

permissions:
  contents: read

# One fixed Environment/test DB, including future mutating phases. Never cancel
# an earlier run or use a run ID as the serialization key.
concurrency:
  group: fvoci-turso-test-database
  cancel-in-progress: false

jobs:
  admission:
    if: github.repository == 'AISFlow/fvoci' && ((github.event_name == 'push' && github.ref == 'refs/heads/fvoci/v060-turso-verified-connection') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fvoci/v060-turso-verified-connection')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fvoci/v060-product-integration-20261005' && (github.event.inputs.phase == 'ui-baseline' || github.event.inputs.phase == 'ui-ack')))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      environment_id: ${{ steps.admit.outputs.environment_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pure admission fixtures (no credentials or network)
        run: bun test scripts/selected-backend-ci/turso-test-fixtures.test.ts
      - name: Verify preexisting Environment (no configuration writes)
        id: admit
        run: bun scripts/selected-backend-ci/turso-test-guard.ts --admit

  turso-connection:
    needs: admission
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.phase != 'ui-baseline' && github.event.inputs.phase != 'ui-ack' && github.repository == 'AISFlow/fvoci' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fvoci/v060-turso-verified-connection') && needs.admission.result == 'success' && needs.admission.outputs.environment_id != ''
    environment: fvoci-turso-test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Credential-free compiler and maintained SQLite inputs
        run: |
          set -euo pipefail
          printf 'CARGO_TARGET_DIR=%s/turso-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
          cargo fetch --locked
      - name: Credential-free current library test compilation
        run: |
          set -euo pipefail
          cargo test --locked --offline --lib --features db-tests --jobs 4 --no-run --message-format=json > "$RUNNER_TEMP/turso-compile.json"
          bun scripts/selected-backend-ci/turso-test-guard.ts --freeze
      - name: Credential-free frozen diagnostic unit (exactly one test)
        run: bun scripts/selected-backend-ci/turso-test-guard.ts --diagnostic-unit
      - name: Real primary selected phase (exactly one test)
        env:
          FVOCI_DATABASE_BACKEND: libsql-remote
          FVOCI_TEST_TURSO_DATABASE_URL: ${{ secrets.FVOCI_TEST_TURSO_DATABASE_URL }}
          FVOCI_TEST_TURSO_AUTH_TOKEN: ${{ secrets.FVOCI_TEST_TURSO_AUTH_TOKEN }}
          FVOCI_TEST_TURSO_ALLOW_DESTRUCTIVE: ${{ vars.FVOCI_TEST_TURSO_ALLOW_DESTRUCTIVE }}
        run: bun scripts/selected-backend-ci/turso-test-guard.ts --consume

  turso-ui:
    needs: admission
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.phase == 'ui-baseline' || github.event.inputs.phase == 'ui-ack') && github.repository == 'AISFlow/fvoci' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fvoci/v060-turso-verified-connection' || github.ref == 'refs/heads/fvoci/v060-product-integration-20261005') && needs.admission.result == 'success' && needs.admission.outputs.environment_id != ''
    environment: fvoci-turso-test
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      FVOCI_BUILD_SHA: ${{ github.sha }}
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Credential-free current UI input preparation
        run: |
          set -euo pipefail
          printf 'CARGO_TARGET_DIR=%s/turso-ui-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'BUN_INSTALL_CACHE_DIR=%s/turso-bun-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/turso-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
      # Setup action is pinned to the same maintained Web CI revision.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Credential-free fixed dependencies and fresh browser assets
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun --bun x playwright install --with-deps chromium
          bun scripts/selected-backend-ci/turso-ui.ts --record-before
          bun --bun run --cwd apps/web build
      - name: Credential-free current native UI cohort and freeze
        run: |
          set -euo pipefail
          cargo build --locked --offline --features api-schema,db-tests --jobs 2 --bin fvoci-server --bin fvoci-migrate --bin fvoci-e2e-fixture --message-format=json > "$RUNNER_TEMP/ui-compile.json"
          cargo build --locked --offline --manifest-path crates/collab-engine/Cargo.toml --features worker --jobs 2 --bin collab-engine --message-format=json > "$RUNNER_TEMP/ui-engine-compile.json"
          bun scripts/selected-backend-ci/turso-ui.ts --freeze
      - name: Actual current primary UI baseline or guarded ON restart OFF consumer
        env:
          FVOCI_DATABASE_BACKEND: libsql-remote
          FVOCI_LIBSQL_URL: ${{ secrets.FVOCI_TEST_TURSO_DATABASE_URL }}
          FVOCI_LIBSQL_AUTH_TOKEN: ${{ secrets.FVOCI_TEST_TURSO_AUTH_TOKEN }}
          FVOCI_TEST_TURSO_ALLOW_DESTRUCTIVE: ${{ vars.FVOCI_TEST_TURSO_ALLOW_DESTRUCTIVE }}
        run: bun scripts/selected-backend-ci/turso-test-guard.ts --consume

# No upload of raw runtime output, credential files, SDK errors or traces.
