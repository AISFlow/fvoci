name: Container install

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      run_shipping_producer:
        description: Producer-only exact joint551 image export; no application runtime (requires measured 32 GiB disk and 16 GiB available memory)
        type: boolean
        default: false
      run_upgrade_smoke_arm:
        description: Also run the image-to-image upgrade smoke on native ubuntu-26.04-arm (two cold image builds)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_install_smoke: ${{ steps.plan.outputs.select_install_smoke }}
      select_backup_restore_smoke: ${{ steps.plan.outputs.select_backup_restore_smoke }}
      select_upgrade_smoke_arm64: ${{ steps.plan.outputs.select_upgrade_smoke_arm64 }}
      select_shipping_image_producer: ${{ steps.plan.outputs.select_shipping_image_producer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user --break-system-packages -r scripts/ci_selection_requirements.txt
          python3 scripts/ci_selection.py plan \
            --workflow install \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  install-smoke:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_install_smoke == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            check: install-smoke
          - runner: ubuntu-26.04-arm
            check: install-smoke-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # scripts/install-smoke-collab.mjs needs a WebSocket client that sends headers (Bun's).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Run container install smoke
        run: bash scripts/install-smoke.sh

  # Native GitHub-hosted ubuntu-26.04 and ubuntu-26.04-arm (not a cross-build).
  backup-restore-smoke:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_backup_restore_smoke == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            check: backup-restore-smoke
          - runner: ubuntu-26.04-arm
            check: backup-restore-smoke-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Run container backup/restore smoke
        run: bash scripts/backup-restore-smoke.sh

  # Developer witness, never an ordinary PR/main/merge_group check: selected only by a
  # manual dispatch with run_upgrade_smoke_arm. It builds two cold historical images
  # (x64 reference with CARGO_BUILD_JOBS=2: 614 s + 708 s, ~59 s of assertions), so it
  # has its own VM, disk and 60 min budget instead of sharing install-smoke-arm64's.
  upgrade-smoke-arm64:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_upgrade_smoke_arm64 == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    env:
      UPGRADE_OLD: d0942f10f89248b385eeb3f83475dfa4cd441388
      UPGRADE_NEW: 1e0acbe15f903244ff7479c36dce2a90fa6e783d
      TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # git archive of both pinned SHAs and the first-parent check need full history.
          fetch-depth: 0
      # The smoke's collab client needs a WebSocket client that sends headers (Bun's).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check script, pair and disk (plan only)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          blob="$(git hash-object scripts/upgrade-smoke.sh)"
          echo "arch=$(uname -m) nproc=$(nproc) tested=$TESTED_SHA old=$UPGRADE_OLD new=$UPGRADE_NEW"
          echo "upgrade-smoke.sh blob=$blob sha256=$(sha256sum scripts/upgrade-smoke.sh | cut -d' ' -f1)"
          test "$(uname -m)" = aarch64
          # The tested checkout's script runs; step two re-checks it is unchanged.
          test "$blob" = "$(git rev-parse "$TESTED_SHA:scripts/upgrade-smoke.sh")"
          printf '%s\n' "$blob" >"$RUNNER_TEMP/upgrade-smoke.blob"
          docker_root="$(docker info -f '{{.DockerRootDir}}')"
          echo "DockerRootDir=$docker_root"
          df -P -BG "$docker_root"
          bash scripts/upgrade-smoke.sh --old "$UPGRADE_OLD" --new "$UPGRADE_NEW" \
            --main-ref "$TESTED_SHA" --evidence-dir "$RUNNER_TEMP/upgrade-evidence/plan" --plan-only
      - name: Run image-to-image upgrade smoke
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git hash-object scripts/upgrade-smoke.sh)" = "$(cat "$RUNNER_TEMP/upgrade-smoke.blob")"
          bash scripts/upgrade-smoke.sh --old "$UPGRADE_OLD" --new "$UPGRADE_NEW" \
            --main-ref "$TESTED_SHA" --evidence-dir "$RUNNER_TEMP/upgrade-evidence/run"
      # The evidence dirs hold redacted logs only; env files and keys stay in the
      # script's work dir, which is never printed.
      - name: Print redacted evidence
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Log lines must not act as workflow commands.
          token="$(openssl rand -hex 16)"
          for log in "$RUNNER_TEMP"/upgrade-evidence/*/*.log; do
            echo "== $log (last 80 lines)"
            echo "::stop-commands::$token"
            tail -n 80 "$log"
            echo "::$token::"
          done

  # Manual producer handback on a separate VM; ordinary smoke jobs are intact.
  # Tooling changes are NOT physical inputs of the fixed product snapshot.
  shipping-image-producer:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_shipping_image_producer == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 551583237a4cc31828d69fb1d3160c2e0f9179d6
          path: product
          persist-credentials: false
      - name: Produce one source-stamped image and closed public receipts
        env:
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -B tooling/scripts/selected-backend-ci/shipping-image-producer.py \
            --resource-profile hosted-exclusive-12g-plus-2g-experimental \
            --product-root "$GITHUB_WORKSPACE/product" \
            --tooling-root "$GITHUB_WORKSPACE/tooling" --tooling-sha "$TOOLING_SHA" \
            --work-dir "$RUNNER_TEMP/shipping-producer" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      # Public repository: NEVER upload the private work/log directory, env,
      # native capture traces, browser/DB/HTTP evidence, or runtime credentials.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shipping-image-551-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shipping-producer/public/shipping-image.tar
            ${{ runner.temp }}/shipping-producer/public/producer-receipt.json
            ${{ runner.temp }}/shipping-producer/public/tracked-inputs.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  install-ci-gate:
    name: install-ci-gate
    needs: [ci-plan, install-smoke, backup-restore-smoke, upgrade-smoke-arm64, shipping-image-producer]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail closed on selection results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci_selection.py gate --workflow install --needs-json "$NEEDS_JSON" --tested-sha "$TESTED_SHA"
