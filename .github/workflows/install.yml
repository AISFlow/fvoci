name: Container install

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      run_upgrade_smoke_arm:
        description: Also run the image-to-image upgrade smoke on native ubuntu-26.04-arm (two cold image builds)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_install_smoke: ${{ steps.plan.outputs.select_install_smoke }}
      select_backup_restore_smoke: ${{ steps.plan.outputs.select_backup_restore_smoke }}
      select_upgrade_smoke_arm64: ${{ steps.plan.outputs.select_upgrade_smoke_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bun tools/ci/plan.ts \
            --workflow install \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  # One image build per architecture; both smokes of that architecture load it.
  install-image:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_install_smoke == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            check: install-image
          - runner: ubuntu-26.04-arm
            check: install-image-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build and label the install image
        run: cargo xtask install-image build
      - name: Measure product Task scalar runtime
        run: cargo xtask task-scalar-qualification image-measure --image fvoci-rust-install:local --directory "$RUNNER_TEMP/task-scalar-runtime"
      - name: Retain product Task scalar runtime measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-scalar-product-${{ github.sha }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-scalar-runtime/runtime.json
          if-no-files-found: error
          retention-days: 90
      - name: Save the install image
        run: cargo xtask install-image save fvoci-rust-install:local "$RUNNER_TEMP/install-image"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-image-${{ github.sha }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/install-image/
          if-no-files-found: error
          retention-days: 1

      - name: Prepare native scalar qualification inputs
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          test -f /etc/apt/apt-mirrors.txt
          grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
          test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
          # The signed Ubuntu primary archive on x64, Ubuntu ports on ARM.
          case "$(dpkg --print-architecture)" in
            amd64) mirror='https://archive.ubuntu.com/ubuntu/' ;;
            arm64) mirror='https://ports.ubuntu.com/ubuntu-ports/' ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/task-scalar-native"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev curl > "$RUNNER_TEMP/task-scalar-native/build-packages.txt"
          cargo fetch --locked
          cargo xtask sqlite-ci --parent "$RUNNER_TEMP/task-scalar-native" --github-env "$GITHUB_ENV"
      - name: Qualify native Task scalar bootstrap in the product image
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CARGO_BUILD_JOBS: 2
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo xtask task-scalar-qualification bootstrap --image fvoci-rust-install:local --directory "$RUNNER_TEMP/task-scalar-bootstrap" --target-dir "$RUNNER_TEMP/task-scalar-target" --sqlite-inputs "$RUNNER_TEMP/task-scalar-native/consumer-inputs.json"
      - name: Retain native Task scalar bootstrap qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-scalar-bootstrap-${{ github.sha }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/task-scalar-bootstrap/*.json
            ${{ runner.temp }}/task-scalar-bootstrap/*.log
          if-no-files-found: error
          retention-days: 90

  install-smoke:
    needs: [ci-plan, install-image]
    if: needs.ci-plan.outputs.select_install_smoke == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            check: install-smoke
          - runner: ubuntu-26.04-arm
            check: install-smoke-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # scripts/install-smoke-collab.mjs needs a WebSocket client that sends headers (Bun's).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # tools/release/smoke-documents.ts parses Office XML with the locked saxes.
      - name: Prepare locked smoke dependencies
        run: bun ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-image-${{ github.sha }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/install-image
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Load and verify the install image
        run: cargo xtask install-image load "$RUNNER_TEMP/install-image" >>"$GITHUB_ENV"
      - name: Run container install smoke
        run: bash scripts/install-smoke.sh

  # Native GitHub-hosted ubuntu-26.04 and ubuntu-26.04-arm (not a cross-build).
  backup-restore-smoke:
    needs: [ci-plan, install-image]
    if: needs.ci-plan.outputs.select_backup_restore_smoke == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            check: backup-restore-smoke
          - runner: ubuntu-26.04-arm
            check: backup-restore-smoke-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-image-${{ github.sha }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/install-image
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Load and verify the install image
        run: cargo xtask install-image load "$RUNNER_TEMP/install-image" >>"$GITHUB_ENV"
      - name: Run container backup/restore smoke
        run: bash scripts/backup-restore-smoke.sh

  # Developer witness, never an ordinary PR/main/merge_group check: selected only by a
  # manual dispatch with run_upgrade_smoke_arm. It builds two cold historical images
  # (x64 reference with CARGO_BUILD_JOBS=2: 614 s + 708 s, ~59 s of assertions), so it
  # has its own VM, disk and 60 min budget instead of sharing install-smoke-arm64's.
  upgrade-smoke-arm64:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_upgrade_smoke_arm64 == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    env:
      UPGRADE_OLD: d0942f10f89248b385eeb3f83475dfa4cd441388
      UPGRADE_NEW: 1e0acbe15f903244ff7479c36dce2a90fa6e783d
      TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git archive of both pinned SHAs and the first-parent check need full history.
          fetch-depth: 0
      # The smoke's collab client needs a WebSocket client that sends headers (Bun's).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check script, pair and disk (plan only)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          blob="$(git hash-object scripts/upgrade-smoke.sh)"
          echo "arch=$(uname -m) nproc=$(nproc) tested=$TESTED_SHA old=$UPGRADE_OLD new=$UPGRADE_NEW"
          echo "upgrade-smoke.sh blob=$blob sha256=$(sha256sum scripts/upgrade-smoke.sh | cut -d' ' -f1)"
          test "$(uname -m)" = aarch64
          # The tested checkout's script runs; step two re-checks it is unchanged.
          test "$blob" = "$(git rev-parse "$TESTED_SHA:scripts/upgrade-smoke.sh")"
          printf '%s\n' "$blob" >"$RUNNER_TEMP/upgrade-smoke.blob"
          docker_root="$(docker info -f '{{.DockerRootDir}}')"
          echo "DockerRootDir=$docker_root"
          df -P -BG "$docker_root"
          bash scripts/upgrade-smoke.sh --old "$UPGRADE_OLD" --new "$UPGRADE_NEW" \
            --main-ref "$TESTED_SHA" --evidence-dir "$RUNNER_TEMP/upgrade-evidence/plan" --plan-only
      - name: Run image-to-image upgrade smoke
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git hash-object scripts/upgrade-smoke.sh)" = "$(cat "$RUNNER_TEMP/upgrade-smoke.blob")"
          bash scripts/upgrade-smoke.sh --old "$UPGRADE_OLD" --new "$UPGRADE_NEW" \
            --main-ref "$TESTED_SHA" --evidence-dir "$RUNNER_TEMP/upgrade-evidence/run"
      # The evidence dirs hold redacted logs only; env files and keys stay in the
      # script's work dir, which is never printed.
      - name: Print redacted evidence
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Log lines must not act as workflow commands.
          token="$(openssl rand -hex 16)"
          for log in "$RUNNER_TEMP"/upgrade-evidence/*/*.log; do
            echo "== $log (last 80 lines)"
            echo "::stop-commands::$token"
            tail -n 80 "$log"
            echo "::$token::"
          done

  install-ci-gate:
    name: install-ci-gate
    needs: [ci-plan, install-image, install-smoke, backup-restore-smoke, upgrade-smoke-arm64]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Fail closed on selection results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bun tools/ci/gate.ts --workflow install --needs-json "$NEEDS_JSON" --tested-sha "$TESTED_SHA"
