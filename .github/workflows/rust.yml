name: Rust

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Only obsolete runs of this workflow on the same PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LIBCLANG_PATH: /usr/lib/llvm-18/lib
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_fast: ${{ steps.plan.outputs.select_fast }}
      select_postgres: ${{ steps.plan.outputs.select_postgres }}
      select_native_arm64: ${{ steps.plan.outputs.select_native_arm64 }}
      select_collaboration: ${{ steps.plan.outputs.select_collaboration }}
      postgres_matrix: ${{ steps.plan.outputs.postgres_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user --break-system-packages -r scripts/ci_selection_requirements.txt
          bash scripts/test-ci-selection.sh
          python3 scripts/ci_selection.py plan \
            --workflow rust \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  fast:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_fast == 'true'
    runs-on: ubuntu-26.04
    # Cold target miss 113019589871 filled 911s through the 54 SQLite filters.
    # Seven later cargo test commands were not started. 19m is that wall,
    # plus one measured 165s profile compile for the unrun tail, plus 60s.
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Record runner uid, gid and groups once
        run: id
      - name: Collaboration CI runner fixture
        run: bash scripts/fixtures/rust-ci/run-collaboration-admission-fixture-test.sh
      - name: Pinned SQLite build wiring fixtures (no native compilation)
        run: python3 scripts/fixtures/sqlite-ci/test-wiring.py
      - name: Script unit tests without a database
        run: |
          python3 scripts/schema-baseline/test_compare_catalogs.py
          python3 scripts/fixtures/rustup-ci/test_metadata.py
          python3 scripts/selected-backend-ci/test_early_driver_failure.py
          python3 scripts/selected-backend-ci/test_restart_ledger.py
          python3 scripts/selected-backend-ci/test_current_binding_engine_features.py
      - name: restore.sh env-file parsing and app password argv checks
        run: bash scripts/test-restore-env.sh
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev python3 curl > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --identity-only --github-output "$GITHUB_OUTPUT"
      - name: Restore prepared SQLite prefix
        id: sqlite_prefix_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: v1-sqlite-prefix-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ steps.sqlite.outputs.cache_identity }}
      - name: Verify cached SQLite prefix or build
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --cache-fallback --expected-cache-identity "${{ steps.sqlite.outputs.cache_identity }}" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Restore server build outputs
        id: default_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/default
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-fast-default-test-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Restore clippy build outputs
        id: clippy_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/clippy
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-fast-db-tests-clippy-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Restore SQLite library build outputs
        id: db_lib_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/db-lib
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-fast-db-tests-lib-test-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: python3 scripts/encryption_keys.py self-test
      - run: cargo clippy --target-dir target/clippy --locked --offline --all-targets --features db-tests -- -D warnings
      - run: cargo test --locked --offline --lib --bin fvoci-server
        env:
          CARGO_TARGET_DIR: target/default
      - name: Selected SQLite library controls (54 exact tests)
        env:
          CARGO_TARGET_DIR: target/db-lib
        run: |
          set -euo pipefail
          python3 - <<'PYLIB'
          import subprocess
          from scripts.ci_selection import RUST_SELECTED_LIBRARY_FILTERS, selected_library_result_error

          for test_filter in RUST_SELECTED_LIBRARY_FILTERS:
              result = subprocess.run(
                  ["cargo", "test", "--locked", "--offline", "--features", "db-tests", "--lib", test_filter, "--", "--exact"],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              print(result.stdout, end="", flush=True)
              error = selected_library_result_error(test_filter, result.returncode, result.stdout)
              if error:
                  raise SystemExit(error)
          PYLIB
      - run: cargo test --locked --offline --test collab_wire
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --test markdown_process
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --test docx_export_process
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --test pdf_export_process
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --test pptx_export_process
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --test doctor_conversion
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --manifest-path vendor/markdown/Cargo.toml --target-dir target/default/vendor-markdown
      - name: Save server build outputs after validation
        if: steps.default_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/default
          key: ${{ steps.default_cache.outputs.cache-primary-key }}
      - name: Save clippy build outputs after validation
        if: steps.clippy_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/clippy
          key: ${{ steps.clippy_cache.outputs.cache-primary-key }}
      - name: Save SQLite library build outputs after validation
        if: steps.db_lib_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/db-lib
          key: ${{ steps.db_lib_cache.outputs.cache-primary-key }}

  # Default-feature build/policy previously ran only on PostgreSQL ARM A.
  # Give that same check its own budget so DB compilation/tests keep their 15m.
  native-arm64:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_native_arm64 == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # This runner's Azure mirror stalled the pinned ARM libclang download.
          # Change only its mirror list; keep the Ubuntu archive Signed-By policy.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          [[ "$(dpkg --print-architecture)" == arm64 ]]
          test -f /etc/apt/apt-mirrors.txt
          grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
          test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
          printf '%s\n' 'https://ports.ubuntu.com/ubuntu-ports/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev python3 curl > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --identity-only --github-output "$GITHUB_OUTPUT"
      - name: Restore prepared SQLite prefix
        id: sqlite_prefix_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: v1-sqlite-prefix-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ steps.sqlite.outputs.cache_identity }}
      - name: Verify cached SQLite prefix or build
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --cache-fallback --expected-cache-identity "${{ steps.sqlite.outputs.cache_identity }}" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Restore server build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-native-default-dev-test-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - run: cargo fetch --locked
      - name: Native server build and policy tests (ARM64)
        run: |
          cargo build --locked --offline --bins
          cargo test --locked --offline --lib

  postgres-build:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_postgres == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
          - runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev python3 curl > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --identity-only --github-output "$GITHUB_OUTPUT"
      - name: Restore prepared SQLite prefix
        id: sqlite_prefix_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: v1-sqlite-prefix-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ steps.sqlite.outputs.cache_identity }}
      - name: Verify cached SQLite prefix or build
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --cache-fallback --expected-cache-identity "${{ steps.sqlite.outputs.cache_identity }}" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Save verified SQLite prefix
        if: steps.sqlite_prefix_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: ${{ steps.sqlite_prefix_cache.outputs.cache-primary-key }}
      - name: Restore server build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/db-tests
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-postgres-db-tests-test-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Restore schema default build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/schema-default
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-schema-default-dev-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Restore production helper build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: crates/collab-engine/target
          key: v2-collab-product-helper-ubuntu-26.04-${{ runner.arch }}-1.98.1-worker-dev-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/collab-engine/**', 'crates/vendor/**', '.cargo/**') }}
      - name: Fetch locked dependencies before credential-free compilation
        run: |
          if [[ "${RUNNER_ARCH:-}" == X64 ]]; then
            fvoci_timing_started=$SECONDS
            printf 'ci-step stage=postgres-build-step-11 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            trap 'fvoci_timing_exit=$?; printf "ci-step stage=postgres-build-step-11 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          fi
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
      - name: Build all PostgreSQL test executables once per architecture
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/db-tests
        run: |
          mkdir "$RUNNER_TEMP/rust-binaries"
          python3 scripts/ci_selection.py rust-binaries build --directory "$RUNNER_TEMP/rust-binaries"
      - name: Build default-feature schema migrator
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/schema-default
        run: |
          if [[ "${RUNNER_ARCH:-}" == X64 ]]; then
            fvoci_timing_started=$SECONDS
            printf 'ci-step stage=postgres-build-step-13 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            trap 'fvoci_timing_exit=$?; printf "ci-step stage=postgres-build-step-13 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          fi
          cargo build --locked --offline --bin fvoci-migrate --message-format=json > "$RUNNER_TEMP/rust-binaries/schema.jsonl"
      - name: Build production helper once per architecture
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates/collab-engine/target
        run: |
          if [[ "${RUNNER_ARCH:-}" == X64 ]]; then
            fvoci_timing_started=$SECONDS
            printf 'ci-step stage=postgres-build-step-14 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            trap 'fvoci_timing_exit=$?; printf "ci-step stage=postgres-build-step-14 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          fi
          cargo build --locked --offline --manifest-path crates/collab-engine/Cargo.toml --features worker --bin collab-engine --message-format=json > "$RUNNER_TEMP/rust-binaries/helper.jsonl"
      - name: Seal finished executables and exact native inputs
        run: |
          if [[ "${RUNNER_ARCH:-}" == X64 ]]; then
            fvoci_timing_started=$SECONDS
            printf 'ci-step stage=postgres-build-step-15 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            trap 'fvoci_timing_exit=$?; printf "ci-step stage=postgres-build-step-15 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          fi
          python3 scripts/ci_selection.py rust-binaries pack --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - name: Verify zstd CLI for executable handoff
        run: zstd --version
      - name: Compress sealed executable archives with zstd
        run: |
          fvoci_timing_started=$SECONDS
          printf 'ci-step stage=rust-binaries-compress started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fvoci_finish_timing() {
            fvoci_timing_exit=$?
            printf 'ci-step stage=rust-binaries-compress finished at=%s elapsed_seconds=%s exit=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - fvoci_timing_started))" "$fvoci_timing_exit"
            exit "$fvoci_timing_exit"
          }
          trap fvoci_finish_timing EXIT
          zstd -T0 --no-progress -- "$RUNNER_TEMP/rust-binaries/postgres.tar" "$RUNNER_TEMP/rust-binaries/helper.tar"
      - name: Hash compressed executable archives
        run: |
          fvoci_timing_started=$SECONDS
          printf 'ci-step stage=rust-binaries-hash started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fvoci_finish_timing() {
            fvoci_timing_exit=$?
            printf 'ci-step stage=rust-binaries-hash finished at=%s elapsed_seconds=%s exit=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - fvoci_timing_started))" "$fvoci_timing_exit"
            exit "$fvoci_timing_exit"
          }
          trap fvoci_finish_timing EXIT
          cd "$RUNNER_TEMP/rust-binaries" || exit 1
          sha256sum postgres.tar.zst helper.tar.zst
      - name: Upload postgres finished executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-postgres-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-binaries/postgres.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Upload helper finished executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-helper-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-binaries/helper.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  postgres:
    needs: [ci-plan, postgres-build]
    if: needs.ci-plan.outputs.select_postgres == 'true'
    name: ${{ matrix.check }}
    # A/C split only task/comment from measured PG16 A: 160.19s moved,
    # 404.03s retained (cold compile/setup are separate). Both keep 15m.
    # B retains every target/helper/install/S3: x64 20m, ARM64 25m.
    # Measured ARM setup/PG 17m59.916s + install 3m30s + S3/post 34s
    # = 22m03.916s; 25m leaves 2m56.084s for hosted variation/cleanup.
    # Each major/architecture pair runs every suite exactly once across
    # A/B/C. PG18 covers both architectures; PG16/17 cover x64.
    # Pull requests run the PG 18 x64 rows only. merge_group, push, and
    # every other event run this full catalog. GitHub applies exclude
    # before include, so the job matrix is the plan JSON itself.
    # Keep image pins in sync with scripts/start-test-postgres.sh.
    env:
      FVOCI_POSTGRES_MATRIX_CATALOG: |
        [
          {
            "runner": "ubuntu-26.04",
            "pg_major": "18",
            "postgres_image": "postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db",
            "check": "postgres",
            "shard": "a",
            "tests": "--test db_integration --test collab_integration --test invitation_integration --test search_index --test api_token_integration --test mail_integration --test task_labels_integration --test workspace_lifecycle --test search_query --test notification_integration --test push_integration --test schedule_ics_integration --test search_meili --test secret_maintenance_integration --test outbox_reset_integration --test pool_release_integration"
          },
          {
            "runner": "ubuntu-26.04",
            "pg_major": "18",
            "postgres_image": "postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db",
            "check": "postgres-c",
            "shard": "c",
            "tests": "--test task_integration --test comment_integration"
          },
          {
            "runner": "ubuntu-26.04",
            "pg_major": "18",
            "postgres_image": "postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db",
            "check": "postgres-b",
            "shard": "b",
            "tests": "--test project_integration --test document_integration --test attachment_integration --test group_integration --test task_activity_integration --test background_jobs --test task_milestones_integration --test outbox_integration --test attachment_extract_integration --test share_stars_integration --test account_lifecycle --test admin_integration --test integrations_integration --test collections_integration --test identity_integration --test attachment_parents_integration --test attachment_preview_integration --test project_lifecycle_integration --test task_ops_integration --test document_export_docx_integration --test document_export_pdf_integration --test search_semantic --test mcp_integration --test doctor_integration --test templates_integration --test unfurl_integration"
          },
          {
            "runner": "ubuntu-26.04-arm",
            "pg_major": "18",
            "postgres_image": "postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db",
            "check": "postgres-arm64",
            "shard": "a",
            "tests": "--test db_integration --test collab_integration --test invitation_integration --test search_index --test api_token_integration --test mail_integration --test task_labels_integration --test workspace_lifecycle --test search_query --test notification_integration --test push_integration --test schedule_ics_integration --test search_meili --test secret_maintenance_integration --test outbox_reset_integration --test pool_release_integration"
          },
          {
            "runner": "ubuntu-26.04-arm",
            "pg_major": "18",
            "postgres_image": "postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db",
            "check": "postgres-arm64-c",
            "shard": "c",
            "tests": "--test task_integration --test comment_integration"
          },
          {
            "runner": "ubuntu-26.04-arm",
            "pg_major": "18",
            "postgres_image": "postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db",
            "check": "postgres-arm64-b",
            "shard": "b",
            "tests": "--test project_integration --test document_integration --test attachment_integration --test group_integration --test task_activity_integration --test background_jobs --test task_milestones_integration --test outbox_integration --test attachment_extract_integration --test share_stars_integration --test account_lifecycle --test admin_integration --test integrations_integration --test collections_integration --test identity_integration --test attachment_parents_integration --test attachment_preview_integration --test project_lifecycle_integration --test task_ops_integration --test document_export_docx_integration --test document_export_pdf_integration --test search_semantic --test mcp_integration --test doctor_integration --test templates_integration --test unfurl_integration"
          },
          {
            "runner": "ubuntu-26.04",
            "pg_major": "16",
            "postgres_image": "postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54",
            "check": "postgres-pg16",
            "shard": "a",
            "tests": "--test db_integration --test collab_integration --test invitation_integration --test search_index --test api_token_integration --test mail_integration --test task_labels_integration --test workspace_lifecycle --test search_query --test notification_integration --test push_integration --test schedule_ics_integration --test search_meili --test secret_maintenance_integration --test outbox_reset_integration --test pool_release_integration"
          },
          {
            "runner": "ubuntu-26.04",
            "pg_major": "16",
            "postgres_image": "postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54",
            "check": "postgres-pg16-c",
            "shard": "c",
            "tests": "--test task_integration --test comment_integration"
          },
          {
            "runner": "ubuntu-26.04",
            "pg_major": "16",
            "postgres_image": "postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54",
            "check": "postgres-pg16-b",
            "shard": "b",
            "tests": "--test project_integration --test document_integration --test attachment_integration --test group_integration --test task_activity_integration --test background_jobs --test task_milestones_integration --test outbox_integration --test attachment_extract_integration --test share_stars_integration --test account_lifecycle --test admin_integration --test integrations_integration --test collections_integration --test identity_integration --test attachment_parents_integration --test attachment_preview_integration --test project_lifecycle_integration --test task_ops_integration --test document_export_docx_integration --test document_export_pdf_integration --test search_semantic --test mcp_integration --test doctor_integration --test templates_integration --test unfurl_integration"
          },
          {
            "runner": "ubuntu-26.04",
            "pg_major": "17",
            "postgres_image": "postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f",
            "check": "postgres-pg17",
            "shard": "a",
            "tests": "--test db_integration --test collab_integration --test invitation_integration --test search_index --test api_token_integration --test mail_integration --test task_labels_integration --test workspace_lifecycle --test search_query --test notification_integration --test push_integration --test schedule_ics_integration --test search_meili --test secret_maintenance_integration --test outbox_reset_integration --test pool_release_integration"
          },
          {
            "runner": "ubuntu-26.04",
            "pg_major": "17",
            "postgres_image": "postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f",
            "check": "postgres-pg17-c",
            "shard": "c",
            "tests": "--test task_integration --test comment_integration"
          },
          {
            "runner": "ubuntu-26.04",
            "pg_major": "17",
            "postgres_image": "postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f",
            "check": "postgres-pg17-b",
            "shard": "b",
            "tests": "--test project_integration --test document_integration --test attachment_integration --test group_integration --test task_activity_integration --test background_jobs --test task_milestones_integration --test outbox_integration --test attachment_extract_integration --test share_stars_integration --test account_lifecycle --test admin_integration --test integrations_integration --test collections_integration --test identity_integration --test attachment_parents_integration --test attachment_preview_integration --test project_lifecycle_integration --test task_ops_integration --test document_export_docx_integration --test document_export_pdf_integration --test search_semantic --test mcp_integration --test doctor_integration --test templates_integration --test unfurl_integration"
          }
        ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-plan.outputs.postgres_matrix) }}
    runs-on: ${{ matrix.runner }}
    # Main PG16 B measured ~818s PostgreSQL + ~48s S3, exceeding 15m with setup.
    # A/C stay at 15m and x64 B at 20m; ARM64 B uses the measured allowance above.
    timeout-minutes: ${{ matrix.shard == 'b' && (matrix.runner == 'ubuntu-26.04-arm' && 25 || 20) || 15 }}
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
      meilisearch:
        image: getmeili/meilisearch:v1.53.2@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
        env:
          MEILI_MASTER_KEY: ci-ephemeral-meili-master
          MEILI_NO_ANALYTICS: "true"
          MEILI_ENV: production
        ports:
          - 7700/tcp
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: PostgreSQL service major matches matrix
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          EXPECTED_PG_MAJOR: ${{ matrix.pg_major }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PG_MAJOR" =~ ^(16|17|18)$ ]] || { echo "unsupported pg_major: $EXPECTED_PG_MAJOR" >&2; exit 1; }
          num="$(docker exec "$PG_CONTAINER" psql -U postgres -tAc 'SHOW server_version_num')"
          echo "server_version_num=$num"
          [[ "$num" =~ ^${EXPECTED_PG_MAJOR}[0-9]{4}$ ]] || {
            echo "PostgreSQL major mismatch: expected $EXPECTED_PG_MAJOR, got $num" >&2
            exit 1
          }
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev python3 curl > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --identity-only --github-output "$GITHUB_OUTPUT"
      - name: Restore prepared SQLite prefix
        id: sqlite_prefix_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: v1-sqlite-prefix-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ steps.sqlite.outputs.cache_identity }}
      - name: Verify cached SQLite prefix or build
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --cache-fallback --expected-cache-identity "${{ steps.sqlite.outputs.cache_identity }}" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Download required postgres executables for this SHA and architecture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-postgres-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-binaries
      - name: Decompress sealed postgres executables
        run: |
          zstd --version
          zstd --decompress --no-progress -- "$RUNNER_TEMP/rust-binaries/postgres.tar.zst"
      - name: Validate and restore finished postgres executables (no rebuild fallback)
        run: python3 scripts/ci_selection.py rust-binaries unpack --cohort postgres --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - name: PostgreSQL integration tests
        env:
          FVOCI_COLLAB_ENGINE: ${{ matrix.shard == 'b' && format('{0}/crates/collab-engine/target/debug/collab-engine', github.workspace) || '' }}
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_MEILI_URL: http://127.0.0.1:${{ job.services.meilisearch.ports['7700'] }}
          FVOCI_MEILI_KEY: ci-ephemeral-meili-master
        run: python3 scripts/ci_selection.py rust-binaries run --directory "$RUNNER_TEMP/rust-binaries" ${{ matrix.tests }}

      - name: Schema baseline SQLite controls and prepared PostgreSQL catalog
        if: matrix.shard == 'a'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PREPARATION_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: |
          set -euo pipefail
          python3 - <<'PYSCHEMA'
          import hashlib, json, os, pathlib, re, secrets, stat, subprocess, tempfile, urllib.parse
          assert os.environ['CI'] == os.environ['GITHUB_ACTIONS'] == 'true'
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          container = os.environ['PG_CONTAINER']
          assert re.fullmatch('[0-9a-f]{64}', container)
          url = urllib.parse.urlsplit(os.environ['PREPARATION_DATABASE_URL'])
          assert url.scheme == 'postgres' and url.hostname == '127.0.0.1' and url.port and url.path == '/postgres'
          assert url.username == 'postgres' and not url.query and not url.fragment
          root = pathlib.Path(tempfile.mkdtemp(prefix='fvoci-schema-ci-', dir=os.environ['RUNNER_TEMP']))
          assert stat.S_IMODE(root.stat().st_mode) == 0o700 and root.stat().st_uid == os.getuid()
          identity = secrets.token_hex(8)
          database, role = 'fvoci_schema_ci_' + identity, 'fvoci_schema_app_' + identity
          password = secrets.token_hex(32)
          created_db = created_role = False
          failed = False
          # Owner URL is confined to preparation and this documented read-only catalog
          # extractor, never exported to normal product servers or other test targets.
          def private(name, data):
              with (root / name).open('xb') as handle:
                  os.fchmod(handle.fileno(), 0o600); handle.write(data)
          def command(name, args, *, env=None, sql=None):
              result = subprocess.run(args, env=env, input=sql, capture_output=True)
              private(name + '.stdout.log', result.stdout); private(name + '.stderr.log', result.stderr)
              if result.returncode:
                  raise RuntimeError(name + ' exit=' + str(result.returncode))
              return result.stdout.decode()
          def sql(name, text, db='postgres'):
              return command(name, ['docker','exec','-i',container,'psql','-X','-U','postgres','-d',db,'-v','ON_ERROR_STOP=1'], sql=text.encode())
          owner_url = urllib.parse.urlunsplit(url._replace(path='/' + database))
          migrate = str(pathlib.Path('target/schema-default/debug/fvoci-migrate').resolve())
          assert stat.S_ISREG(pathlib.Path(migrate).lstat().st_mode)
          try:
              # CREATE has no IF NOT EXISTS: collision is a refusal, not adoption.
              sql('create-role', f"CREATE ROLE \"{role}\" LOGIN PASSWORD '{password}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;")
              created_role = True
              sql('create-database', f'CREATE DATABASE "{database}";')
              created_db = True
              preparation = {**os.environ, 'FVOCI_DATABASE_BACKEND':'postgres', 'DATABASE_URL':owner_url}
              command('normal-install', [migrate], env=preparation)
              command('normal-app-grants', [migrate,'--grant-app-role',role], env=preparation)
              catalog = root / 'catalog.private.json'; private(catalog.name, b'')
              observer = {**os.environ, 'FVOCI_SCHEMA_CATALOG_DATABASE_URL':owner_url,
                          'FVOCI_SCHEMA_CATALOG_APP_ROLE':role, 'FVOCI_SCHEMA_CATALOG_OUT':str(catalog)}
              # The fourth test owns a separate PG database/role on this isolated service.
              observer['TEST_DATABASE_URL'] = os.environ['PREPARATION_DATABASE_URL']
              observer.pop('PREPARATION_DATABASE_URL', None)
              stdout = command('schema-target', ['python3','scripts/ci_selection.py','rust-binaries','run','--directory',
                                os.environ['RUNNER_TEMP'] + '/rust-binaries','--test','schema_baseline_integration','--nocapture'], env=observer)
              assert re.search(r'test result: ok\. 4 passed; 0 failed; 0 ignored;', stdout), 'exact four actual controls required'
              assert 'SKIP postgres_catalog_dump' not in (root/'schema-target.stderr.log').read_text()
              facts = json.loads(catalog.read_bytes())
              assert facts['tables'] and len(facts['ledger']) == 12
              authority = facts['app_role']; attrs = authority['attributes']
              assert authority['role'] == role and attrs['exists'] and attrs['login']
              assert all(attrs[k] is False for k in ('superuser','createdb','createrole','replication','bypassrls'))
              assert attrs['member_of'] == []
              private('scope.json', json.dumps({'source':os.environ['GITHUB_SHA'],'catalog_sha256':hashlib.sha256(catalog.read_bytes()).hexdigest(),
                  'actual_controls':4,'sqlite_controls':2,'postgres_catalog_reads':1,'postgres_app_role_gate_controls':1,
                  'normal_product_role_tests':'separate existing PostgreSQL integration suites'}).encode())
          except BaseException:
              failed = True
              # Keep all raw tool output private; do not expose URLs or seed fields.
              print('schema baseline controls failed; private evidence retained', flush=True)
              raise RuntimeError('schema baseline CI preparation/execution failed') from None
          finally:
              # Only identities positively created by this invocation can be retired.
              if created_db:
                  sql('drop-database', f'DROP DATABASE "{database}" WITH (FORCE);')
              if created_role:
                  sql('drop-role', f'DROP ROLE "{role}";')
              if not failed:
                  print('schema baseline: 2 SQLite controls + 1 prepared-owner catalog read + 1 PostgreSQL app-role gate passed; owned DB/role retired', flush=True)
          PYSCHEMA

      - name: Selected SQLite install lifetime controls
        if: matrix.shard == 'b' && matrix.pg_major == '18'
        env:
          FVOCI_COLLAB_ENGINE: ${{ github.workspace }}/crates/collab-engine/target/debug/collab-engine
        run: |
          set -euo pipefail
          sudo python3 - "$RUNNER_TEMP/rust-binaries/selected-install-build.jsonl" "$FVOCI_COLLAB_ENGINE" <<'PYINSTALL'
          import hashlib, json, os, pathlib, re, secrets, shutil, stat, subprocess, sys, tempfile
          records = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          artifacts = [r for r in records if r.get("reason") == "compiler-artifact" and r.get("executable")]
          def executable(name, kind, test):
              matches = [r for r in artifacts if r["target"]["name"] == name and kind in r["target"]["kind"] and r["profile"]["test"] == test]
              assert len(matches) == 1, (name, matches)
              assert "db-tests" in matches[0]["features"], name
              return pathlib.Path(matches[0]["executable"])
          server = executable("fvoci-server", "bin", False)
          migrate = executable("fvoci-migrate", "bin", False)
          test = executable("selected_install_lifetime", "test", True)
          assert server.parent == migrate.parent
          engine = pathlib.Path(sys.argv[2])
          for file in (server, migrate, test, engine):
              assert file.is_absolute() and stat.S_ISREG(file.lstat().st_mode), file
              os.chown(file, 0, 0)
              os.chmod(file, 0o755)
          run_root = pathlib.Path(tempfile.mkdtemp(prefix="fvoci-selected-install-", dir="/run"))
          try:
              os.chown(run_root, 0, 1000)
              os.chmod(run_root, 0o710)
              storage = run_root / "storage"
              storage.mkdir(mode=0o700)
              os.chown(storage, 1000, 1000)
              environment = {
                  "PATH": "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                  "PASSWORD_PEPPER_KEYS": json.dumps({"fixture": secrets.token_hex(32)}),
                  "PASSWORD_PEPPER_ACTIVE_KEY_ID": "fixture",
                  "ENCRYPTION_KEYS": json.dumps({"fixture": secrets.token_hex(32)}),
                  "ENCRYPTION_ACTIVE_KEY_ID": "fixture",
                  "FVOCI_PUBLIC_ORIGIN": "http://127.0.0.1:8080",
                  "FVOCI_COOKIE_SECURE": "0",
                  "STORAGE_DRIVER": "local",
                  "FVOCI_STORAGE_DIR": str(storage),
                  "FVOCI_COLLAB_ENGINE": str(engine),
                  "FVOCI_COLLAB_FAMILY_LEASE_MS": "30000",
                  "FVOCI_COLLAB_FAMILY_RENEW_MS": "5000",
              }
              private = run_root / "environment.json"
              with private.open("x") as handle:
                  os.fchmod(handle.fileno(), 0o600)
                  json.dump(environment, handle)
              env = {"PATH": environment["PATH"], "FVOCI_SELECTED_INSTALL_RUN_ROOT": str(run_root), "FVOCI_SELECTED_INSTALL_ENV_FILE": str(private)}
              for file, name in ((migrate, "MIGRATE"), (server, "SERVER")):
                  env["FVOCI_SELECTED_INSTALL_" + name + "_SHA256"] = hashlib.sha256(file.read_bytes()).hexdigest()
              result = subprocess.run([str(test), "--test-threads=1", "--nocapture"], env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout, end="", flush=True)
              for receipt in sorted(run_root.glob("receipts-*/*.json")):
                  print("selected-install receipt", receipt.name, receipt.read_text(), flush=True)
              assert result.returncode == 0, result.returncode
              assert re.search(r"test result: ok\. 4 passed; 0 failed; 0 ignored;", result.stdout), "selected install actual execution count"
          finally:
              shutil.rmtree(run_root)
          PYINSTALL

      - name: S3-compatible storage integration tests (pinned test server)
        if: matrix.shard == 'b'
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: bash scripts/start-test-minio.sh python3 scripts/ci_selection.py rust-binaries run --directory "$RUNNER_TEMP/rust-binaries" --test attachment_s3_integration

  collaboration:
    needs: [ci-plan, postgres-build]
    if: needs.ci-plan.outputs.select_collaboration == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            check: collaboration
          - runner: ubuntu-26.04-arm
            check: collaboration-arm64
    runs-on: ${{ matrix.runner }}
    # x64 cold miss 113019589982 filled 913s at 13/75 of the serial binary.
    # 62 tests at the observed 20s/13 pace is 95s; that pace is doubled, plus 60s.
    # ARM is not in that cancelled log and keeps 15m.
    timeout-minutes: ${{ matrix.check == 'collaboration' && 20 || 15 }}
    services:
      postgres:
        image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore Cargo downloads
        id: cache_collaboration_3
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v1-cargo-collaboration-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/collab-engine/Cargo.lock', 'crates/collab-engine/Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev python3 curl > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --identity-only --github-output "$GITHUB_OUTPUT"
      - name: Restore prepared SQLite prefix
        id: sqlite_prefix_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: v1-sqlite-prefix-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ steps.sqlite.outputs.cache_identity }}
      - name: Verify cached SQLite prefix or build
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --cache-fallback --expected-cache-identity "${{ steps.sqlite.outputs.cache_identity }}" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Restore server build outputs
        id: cache_collaboration_4
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-collaboration-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Download required helper executables for this SHA and architecture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-helper-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-binaries
      - name: Decompress sealed helper executables
        run: |
          zstd --version
          zstd --decompress --no-progress -- "$RUNNER_TEMP/rust-binaries/helper.tar.zst"
      - name: Validate and restore finished helper executables (no rebuild fallback)
        run: python3 scripts/ci_selection.py rust-binaries unpack --cohort helper --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - run: cargo fetch --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install editor schema oracle dependencies (development only)
        run: bun ci
      - name: Editor schema matches the Yjs seed fixture
        run: bash scripts/check-yjs-seed-schema.sh
      - name: WebSocket, PostgreSQL and native helper integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_COLLAB_ENGINE: ${{ github.workspace }}/crates/collab-engine/target/debug/collab-engine
        run: bash scripts/run-rust-collaboration-ci-tests.sh
      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && steps.cache_collaboration_3.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v1-cargo-collaboration-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/collab-engine/Cargo.lock', 'crates/collab-engine/Cargo.toml') }}
      - name: Save server build outputs
        if: github.ref == 'refs/heads/main' && steps.cache_collaboration_4.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-server-ubuntu-26.04-${{ runner.arch }}-1.98.1-collaboration-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}

  rust-ci-gate:
    name: rust-ci-gate
    needs: [ci-plan, fast, native-arm64, postgres-build, postgres, collaboration]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail closed on selection results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci_selection.py gate --workflow rust --needs-json "$NEEDS_JSON" --tested-sha "$TESTED_SHA"
