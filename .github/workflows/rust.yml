name: Rust

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Only obsolete runs of this workflow on the same PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_fast: ${{ steps.plan.outputs.select_fast }}
      select_postgres: ${{ steps.plan.outputs.select_postgres }}
      select_collaboration: ${{ steps.plan.outputs.select_collaboration }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user --break-system-packages -r scripts/ci_selection_requirements.txt
          bash scripts/test-ci-selection.sh
          python3 scripts/ci_selection.py plan \
            --workflow rust \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  fast:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_fast == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Collaboration CI runner fixture
        run: bash scripts/fixtures/rust-ci/run-collaboration-admission-fixture-test.sh
      - name: restore.sh env-file parsing and app password argv checks
        run: bash scripts/test-restore-env.sh
      - name: Restore Cargo downloads
        id: cache_fast_5
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Restore server build outputs
        id: cache_fast_6
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-fast-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}
          restore-keys: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-fast-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: python3 scripts/encryption_keys.py self-test
      - run: cargo clippy --locked --offline --all-targets --features db-tests -- -D warnings
      - run: cargo test --locked --offline --lib --bin fvoci-server
      - run: cargo test --locked --offline --test collab_wire
      - run: cargo test --locked --offline --test markdown_process
      - run: cargo test --locked --offline --test docx_export_process
      - run: cargo test --locked --offline --test pdf_export_process
      - run: cargo test --locked --offline --test pptx_export_process
      - run: cargo test --locked --offline --test doctor_conversion
      - run: cargo test --locked --offline --manifest-path vendor/markdown/Cargo.toml --target-dir target/vendor-markdown
      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && steps.cache_fast_5.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Save server build outputs
        if: github.ref == 'refs/heads/main' && steps.cache_fast_6.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-fast-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}
  postgres:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_postgres == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        # Two DB shards on x64; ARM64 also has a small C shard for the native
        # default-feature build and policy tests. The cold native checks took
        # 483s before A's DB build, exhausting its 15m budget on main 6fb29931.
        # Each PostgreSQL suite runs in exactly one shard per major/architecture.
        # Keep the lists in sync when adding a suite. PG18 runs on both; the
        # other source-supported majors (16, 17) run both shards on x64 only.
        # Keep image pins in sync with scripts/start-test-postgres.sh.
        include:
          - runner: ubuntu-24.04
            pg_major: "18"
            postgres_image: public.ecr.aws/docker/library/postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
            check: postgres
            shard: a
            tests: --test db_integration --test task_integration --test collab_integration --test invitation_integration --test search_index --test comment_integration --test api_token_integration --test mail_integration --test task_labels_integration --test workspace_lifecycle --test search_query --test notification_integration --test push_integration --test schedule_ics_integration --test search_meili --test secret_maintenance_integration --test outbox_reset_integration --test pool_release_integration
          - runner: ubuntu-24.04
            pg_major: "18"
            postgres_image: public.ecr.aws/docker/library/postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
            check: postgres-b
            shard: b
            tests: --test project_integration --test document_integration --test attachment_integration --test group_integration --test task_activity_integration --test background_jobs --test task_milestones_integration --test outbox_integration --test attachment_extract_integration --test share_stars_integration --test account_lifecycle --test admin_integration --test integrations_integration --test collections_integration --test identity_integration --test attachment_parents_integration --test attachment_preview_integration --test project_lifecycle_integration --test task_ops_integration --test document_export_docx_integration --test document_export_pdf_integration --test search_semantic --test mcp_integration --test doctor_integration --test templates_integration --test unfurl_integration
          - runner: ubuntu-24.04-arm
            pg_major: "18"
            postgres_image: public.ecr.aws/docker/library/postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
            check: postgres-arm64
            shard: a
            tests: --test db_integration --test task_integration --test collab_integration --test invitation_integration --test search_index --test comment_integration --test api_token_integration --test mail_integration --test task_labels_integration --test workspace_lifecycle --test search_query --test notification_integration --test push_integration --test search_meili --test secret_maintenance_integration --test outbox_reset_integration
          - runner: ubuntu-24.04-arm
            pg_major: "18"
            postgres_image: public.ecr.aws/docker/library/postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
            check: postgres-arm64-c
            shard: c
            tests: --test schedule_ics_integration --test pool_release_integration
          - runner: ubuntu-24.04-arm
            pg_major: "18"
            postgres_image: public.ecr.aws/docker/library/postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
            check: postgres-arm64-b
            shard: b
            tests: --test project_integration --test document_integration --test attachment_integration --test group_integration --test task_activity_integration --test background_jobs --test task_milestones_integration --test outbox_integration --test attachment_extract_integration --test share_stars_integration --test account_lifecycle --test admin_integration --test integrations_integration --test collections_integration --test identity_integration --test attachment_parents_integration --test attachment_preview_integration --test project_lifecycle_integration --test task_ops_integration --test document_export_docx_integration --test document_export_pdf_integration --test search_semantic --test mcp_integration --test doctor_integration --test templates_integration --test unfurl_integration
          - runner: ubuntu-24.04
            pg_major: "16"
            postgres_image: public.ecr.aws/docker/library/postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
            check: postgres-pg16
            shard: a
            tests: --test db_integration --test task_integration --test collab_integration --test invitation_integration --test search_index --test comment_integration --test api_token_integration --test mail_integration --test task_labels_integration --test workspace_lifecycle --test search_query --test notification_integration --test push_integration --test schedule_ics_integration --test search_meili --test secret_maintenance_integration --test outbox_reset_integration --test pool_release_integration
          - runner: ubuntu-24.04
            pg_major: "16"
            postgres_image: public.ecr.aws/docker/library/postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
            check: postgres-pg16-b
            shard: b
            tests: --test project_integration --test document_integration --test attachment_integration --test group_integration --test task_activity_integration --test background_jobs --test task_milestones_integration --test outbox_integration --test attachment_extract_integration --test share_stars_integration --test account_lifecycle --test admin_integration --test integrations_integration --test collections_integration --test identity_integration --test attachment_parents_integration --test attachment_preview_integration --test project_lifecycle_integration --test task_ops_integration --test document_export_docx_integration --test document_export_pdf_integration --test search_semantic --test mcp_integration --test doctor_integration --test templates_integration --test unfurl_integration
          - runner: ubuntu-24.04
            pg_major: "17"
            postgres_image: public.ecr.aws/docker/library/postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
            check: postgres-pg17
            shard: a
            tests: --test db_integration --test task_integration --test collab_integration --test invitation_integration --test search_index --test comment_integration --test api_token_integration --test mail_integration --test task_labels_integration --test workspace_lifecycle --test search_query --test notification_integration --test push_integration --test schedule_ics_integration --test search_meili --test secret_maintenance_integration --test outbox_reset_integration --test pool_release_integration
          - runner: ubuntu-24.04
            pg_major: "17"
            postgres_image: public.ecr.aws/docker/library/postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
            check: postgres-pg17-b
            shard: b
            tests: --test project_integration --test document_integration --test attachment_integration --test group_integration --test task_activity_integration --test background_jobs --test task_milestones_integration --test outbox_integration --test attachment_extract_integration --test share_stars_integration --test account_lifecycle --test admin_integration --test integrations_integration --test collections_integration --test identity_integration --test attachment_parents_integration --test attachment_preview_integration --test project_lifecycle_integration --test task_ops_integration --test document_export_docx_integration --test document_export_pdf_integration --test search_semantic --test mcp_integration --test doctor_integration --test templates_integration --test unfurl_integration
    runs-on: ${{ matrix.runner }}
    # Main PG16 B measured ~818s PostgreSQL + ~48s S3, exceeding 15m with setup.
    # Keep A/C at 15m; B gets a finite 20m allowance for this observed cold path.
    timeout-minutes: ${{ matrix.shard == 'b' && 20 || 15 }}
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
      meilisearch:
        image: getmeili/meilisearch:v1.53.2@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
        env:
          MEILI_MASTER_KEY: ci-ephemeral-meili-master
          MEILI_NO_ANALYTICS: "true"
          MEILI_ENV: production
        ports:
          - 7700/tcp
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: PostgreSQL service major matches matrix
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          EXPECTED_PG_MAJOR: ${{ matrix.pg_major }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PG_MAJOR" =~ ^(16|17|18)$ ]] || { echo "unsupported pg_major: $EXPECTED_PG_MAJOR" >&2; exit 1; }
          num="$(docker exec "$PG_CONTAINER" psql -U postgres -tAc 'SHOW server_version_num')"
          echo "server_version_num=$num"
          [[ "$num" =~ ^${EXPECTED_PG_MAJOR}[0-9]{4}$ ]] || {
            echo "PostgreSQL major mismatch: expected $EXPECTED_PG_MAJOR, got $num" >&2
            exit 1
          }
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore Cargo downloads
        id: cache_postgres_4
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Restore server build outputs
        id: cache_postgres_5
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-db-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}
          restore-keys: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-db-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
      - run: cargo fetch --locked
      - name: Native server build and policy tests (ARM64)
        if: runner.arch == 'ARM64' && matrix.shard == 'c'
        run: |
          cargo build --locked --offline --bins
          cargo test --locked --offline --lib
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_MEILI_URL: http://127.0.0.1:${{ job.services.meilisearch.ports['7700'] }}
          FVOCI_MEILI_KEY: ci-ephemeral-meili-master
        run: cargo test --locked --offline --no-fail-fast --features db-tests ${{ matrix.tests }}

      - name: S3-compatible storage integration tests (pinned test server)
        if: matrix.shard == 'b'
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: bash scripts/start-test-minio.sh cargo test --locked --offline --no-fail-fast --features db-tests --test attachment_s3_integration
      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && steps.cache_postgres_4.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Save server build outputs
        if: github.ref == 'refs/heads/main' && steps.cache_postgres_5.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-db-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}

  collaboration:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_collaboration == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            check: collaboration
          - runner: ubuntu-24.04-arm
            check: collaboration-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore Cargo downloads
        id: cache_collaboration_3
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v1-cargo-collaboration-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/collab-engine/Cargo.lock', 'crates/collab-engine/Cargo.toml') }}
      - name: Restore server build outputs
        id: cache_collaboration_4
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-collaboration-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}
          restore-keys: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-collaboration-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Restore production helper build outputs
        id: cache_collaboration_5
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/collab-engine/target
          key: v1-collab-product-helper-${{ runner.os }}-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/collab-engine/src/**') }}
          restore-keys: v1-collab-product-helper-${{ runner.os }}-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Fetch locked dependencies before offline validation
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
      - name: Build production helper on the native runner
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates/collab-engine/target
        run: cargo build --locked --offline --manifest-path crates/collab-engine/Cargo.toml --features worker --bin collab-engine
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install editor schema oracle dependencies (development only)
        run: bun ci
      - name: Editor schema matches the Yjs seed fixture
        run: bash scripts/check-yjs-seed-schema.sh
      - name: WebSocket, PostgreSQL and native helper integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_COLLAB_ENGINE: ${{ github.workspace }}/crates/collab-engine/target/debug/collab-engine
        run: bash scripts/run-rust-collaboration-ci-tests.sh
      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && steps.cache_collaboration_3.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v1-cargo-collaboration-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/collab-engine/Cargo.lock', 'crates/collab-engine/Cargo.toml') }}
      - name: Save server build outputs
        if: github.ref == 'refs/heads/main' && steps.cache_collaboration_4.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-collaboration-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/collab-engine/src/**') }}
      - name: Save production helper build outputs
        if: github.ref == 'refs/heads/main' && steps.cache_collaboration_5.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/collab-engine/target
          key: v1-collab-product-helper-${{ runner.os }}-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/collab-engine/src/**') }}

  rust-ci-gate:
    name: rust-ci-gate
    needs: [ci-plan, fast, postgres, collaboration]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail closed on selection results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci_selection.py gate --workflow rust --needs-json "$NEEDS_JSON" --tested-sha "$TESTED_SHA"
