name: Rust

on:
  pull_request:
  push:
    branches: [main]

# Only obsolete runs of this workflow on the same PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Restore server build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-fast-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'crates/collab-engine/src/**') }}
          restore-keys: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-fast-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo check --locked --offline --all-targets --features db-tests
      - run: cargo clippy --locked --offline --all-targets --features db-tests -- -D warnings
      - run: cargo test --locked --offline --lib --bin fvoci-server
      - run: cargo test --locked --offline --test collab_wire
  postgres:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            check: postgres
          - runner: ubuntu-24.04-arm
            check: postgres-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
      meilisearch:
        image: getmeili/meilisearch:v1.53.2@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
        env:
          MEILI_MASTER_KEY: ci-ephemeral-meili-master
          MEILI_NO_ANALYTICS: "true"
          MEILI_ENV: production
        ports:
          - 7700/tcp
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Restore server build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-db-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'crates/collab-engine/src/**') }}
          restore-keys: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-db-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
      - run: cargo fetch --locked
      - name: Native server build and policy tests (ARM64)
        if: runner.arch == 'ARM64'
        run: |
          cargo build --locked --offline --bins
          cargo test --locked --offline --lib
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_MEILI_URL: http://127.0.0.1:${{ job.services.meilisearch.ports['7700'] }}
          FVOCI_MEILI_KEY: ci-ephemeral-meili-master
        run: cargo test --locked --offline --no-fail-fast --features db-tests --test db_integration --test document_integration --test collab_integration --test attachment_integration --test attachment_extract_integration --test project_integration --test task_integration --test invitation_integration --test search_meili --test comment_integration --test search_query --test outbox_integration

  collaboration:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            check: collaboration
          - runner: ubuntu-24.04-arm
            check: collaboration-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v1-cargo-collaboration-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/collab-engine/Cargo.lock', 'crates/collab-engine/Cargo.toml') }}
      - name: Restore server build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-collaboration-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'crates/collab-engine/src/**') }}
          restore-keys: v2-server-${{ runner.os }}-${{ runner.arch }}-1.98.1-collaboration-db-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Restore production helper build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/collab-engine/target
          key: v1-collab-product-helper-${{ runner.os }}-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/collab-engine/src/**') }}
          restore-keys: v1-collab-product-helper-${{ runner.os }}-${{ runner.arch }}-1.98.1-worker-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Fetch locked dependencies before offline validation
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
      - name: Build production helper on the native runner
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates/collab-engine/target
        run: cargo build --locked --offline --manifest-path crates/collab-engine/Cargo.toml --features worker --bin collab-engine
      - name: WebSocket, PostgreSQL and native helper integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_COLLAB_ENGINE: ${{ github.workspace }}/crates/collab-engine/target/debug/collab-engine
        run: |
          set -o pipefail
          cargo test --locked --offline --features db-tests --lib collab::validation::tests::validate_recovery_bundle_huge_varint_memory_is_rejected -- --exact | tee "$RUNNER_TEMP/native-admission-test.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/native-admission-test.log"
          cargo test --locked --offline --no-fail-fast --features db-tests --test collab_product --test collab_projection --test collab_lifecycle --test collab_shutdown --test document_collab_lifecycle --test revision_integration
