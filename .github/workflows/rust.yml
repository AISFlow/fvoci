    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-plan.outputs.postgres_matrix) }}
    runs-on: ${{ matrix.runner }}
    # Main PG16 B measured ~818s PostgreSQL + ~48s S3, exceeding 15m with setup.
    # A/C stay at 15m and x64 B at 20m; ARM64 B uses the measured allowance above.
    timeout-minutes: ${{ matrix.shard == 'b' && (matrix.runner == 'ubuntu-26.04-arm' && 25 || 20) || 15 }}
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
      meilisearch:
        image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
        env:
          MEILI_MASTER_KEY: ci-ephemeral-meili-master
          MEILI_NO_ANALYTICS: "true"
          MEILI_ENV: production
        ports:
          - 7700/tcp
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PostgreSQL service major matches matrix
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          EXPECTED_PG_MAJOR: ${{ matrix.pg_major }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PG_MAJOR" =~ ^(16|17|18)$ ]] || { echo "unsupported pg_major: $EXPECTED_PG_MAJOR" >&2; exit 1; }
          num="$(docker exec "$PG_CONTAINER" psql -U postgres -tAc 'SHOW server_version_num')"
          echo "server_version_num=$num"
          [[ "$num" =~ ^${EXPECTED_PG_MAJOR}[0-9]{4}$ ]] || {
            echo "PostgreSQL major mismatch: expected $EXPECTED_PG_MAJOR, got $num" >&2
            exit 1
          }
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'APT::Get::Always-Include-Phased-Updates "true";' 'APT::Get::Never-Include-Phased-Updates "false";' | sudo tee /etc/apt/apt.conf.d/99fvoci-phased-updates >/dev/null
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o APT::Update::Error-Mode=any update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-remove gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8 linux-libc-dev libcrypt-dev
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev curl > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --identity-only --github-output "$GITHUB_OUTPUT"
      - name: Restore prepared SQLite prefix
        id: sqlite_prefix_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: v1-sqlite-prefix-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ steps.sqlite.outputs.cache_identity }}
      - name: Verify cached SQLite prefix or build
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --cache-fallback --expected-cache-identity "${{ steps.sqlite.outputs.cache_identity }}" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Download required postgres executables for this SHA and architecture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-postgres-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-binaries
      - name: Decompress sealed postgres executables
        run: |
          zstd --version
          zstd --decompress --no-progress -- "$RUNNER_TEMP/rust-binaries/postgres.tar.zst"
      - name: Validate and restore finished postgres executables (no rebuild fallback)
        run: xtask/target/debug/xtask rust-binaries unpack --cohort postgres --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - name: PostgreSQL integration tests
        env:
          FVOCI_COLLAB_ENGINE: ${{ matrix.shard == 'b' && format('{0}/crates/collab-engine/target/debug/collab-engine', github.workspace) || '' }}
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_MEILI_URL: http://127.0.0.1:${{ job.services.meilisearch.ports['7700'] }}
          FVOCI_MEILI_KEY: ci-ephemeral-meili-master
        run: xtask/target/debug/xtask rust-binaries run --directory "$RUNNER_TEMP/rust-binaries" ${{ matrix.tests }}

      - name: Schema baseline SQLite controls and prepared PostgreSQL catalog
        if: matrix.shard == 'a'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PREPARATION_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: |
          set -euo pipefail
          xtask/target/debug/xtask schema-baseline

      - name: Native PostgreSQL library control (1 exact test)
        if: matrix.shard == 'a'
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: xtask/target/debug/xtask native-library run --cohort postgres --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"

      - name: Restricted PostgreSQL app library control (1 exact test)
        if: matrix.shard == 'a'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PREPARATION_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: xtask/target/debug/xtask native-library run --cohort pg-app --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"

      - name: Selected SQLite install lifetime controls
        if: matrix.shard == 'b' && matrix.pg_major == '18'
        env:
          FVOCI_COLLAB_ENGINE: ${{ github.workspace }}/crates/collab-engine/target/debug/collab-engine
        run: |
          set -euo pipefail
          sudo xtask/target/debug/xtask selected-install "$RUNNER_TEMP/rust-binaries/selected-install-build.jsonl" "$FVOCI_COLLAB_ENGINE"

      - name: S3-compatible storage integration tests (pinned test server)
        if: matrix.shard == 'b'
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: bash scripts/start-test-minio.sh xtask/target/debug/xtask rust-binaries run --directory "$RUNNER_TEMP/rust-binaries" --test attachment_s3_integration

      - name: Native S3 library control (1 exact test)
        if: matrix.shard == 'b'
        run: bash scripts/start-test-minio.sh xtask/target/debug/xtask native-library run --cohort s3 --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"

  collaboration:
    needs: [ci-plan, postgres-build]
    if: needs.ci-plan.outputs.select_collaboration == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            check: collaboration
          - runner: ubuntu-26.04-arm
            check: collaboration-arm64
    runs-on: ${{ matrix.runner }}
    # x64 cold miss 113019589982 filled 913s at 13/75 of the serial binary.
    # 62 tests at the observed 20s/13 pace is 95s; that pace is doubled, plus 60s.
    # ARM is not in that cancelled log and keeps 15m.
    timeout-minutes: ${{ matrix.check == 'collaboration' && 20 || 15 }}
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Restore Cargo downloads
        id: cache_collaboration_3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v1-cargo-collaboration-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/collab-engine/Cargo.lock', 'crates/collab-engine/Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'APT::Get::Always-Include-Phased-Updates "true";' 'APT::Get::Never-Include-Phased-Updates "false";' | sudo tee /etc/apt/apt.conf.d/99fvoci-phased-updates >/dev/null
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o APT::Update::Error-Mode=any update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-remove gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8 linux-libc-dev libcrypt-dev
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev curl > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --identity-only --github-output "$GITHUB_OUTPUT"
      - name: Restore prepared SQLite prefix
        id: sqlite_prefix_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: v1-sqlite-prefix-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ steps.sqlite.outputs.cache_identity }}
      - name: Verify cached SQLite prefix or build
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --cache-fallback --expected-cache-identity "${{ steps.sqlite.outputs.cache_identity }}" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Download required helper executables for this SHA and architecture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-helper-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-binaries
      - name: Decompress sealed helper executables
        run: |
          zstd --version
          zstd --decompress --no-progress -- "$RUNNER_TEMP/rust-binaries/helper.tar.zst"
      - name: Validate and restore finished helper executables (no rebuild fallback)
        run: xtask/target/debug/xtask rust-binaries unpack --cohort helper --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - name: Native collaboration library controls (28 exact tests)
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_COLLAB_ENGINE: ${{ github.workspace }}/crates/collab-engine/target/debug/collab-engine
          FVOCI_IMPORT_TEST_SERVER_BIN: ${{ github.workspace }}/target/db-tests/debug/fvoci-server
        run: xtask/target/debug/xtask native-library run --cohort collaboration --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - name: Native preview library controls (6 exact tests)
        env:
          FVOCI_PREVIEW_TEST_HELPER: ${{ github.workspace }}/target/db-tests/debug/fvoci-server
        run: xtask/target/debug/xtask native-library run --cohort preview --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - name: Prepare pinned official native sqld
        run: xtask/target/debug/xtask native-library prepare-sqld --directory "$RUNNER_TEMP/native-library-sqld"
      - name: Official sqld library controls (15 exact tests)
        env:
          FVOCI_TEST_SQLD: ${{ runner.temp }}/native-library-sqld/sqld
        run: xtask/target/debug/xtask native-library run --cohort sqld --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - name: Explicit official sqld library controls (15 exact tests)
        env:
          FVOCI_TEST_SQLD: ${{ runner.temp }}/native-library-sqld/sqld
          FVOCI_COLLAB_ENGINE: ${{ github.workspace }}/crates/collab-engine/target/debug/collab-engine
        run: xtask/target/debug/xtask native-library run --cohort sqld-ignored --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - name: Explicit local sqld migration controls (6 exact tests)
        env:
          FVOCI_TEST_SQLD: ${{ runner.temp }}/native-library-sqld/sqld
        run: xtask/target/debug/xtask native-library run --cohort sqld-migration --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install editor schema oracle dependencies (development only)
        run: bun ci
      - name: Editor schema matches the Yjs seed fixture
        run: bash scripts/check-yjs-seed-schema.sh
      - name: WebSocket, PostgreSQL and native helper integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_COLLAB_ENGINE: ${{ github.workspace }}/crates/collab-engine/target/debug/collab-engine
          FVOCI_IMPORT_TEST_SERVER_BIN: ${{ github.workspace }}/target/db-tests/debug/fvoci-server
        run: bash scripts/start-test-meili.sh xtask/target/debug/xtask rust-binaries collaboration --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && steps.cache_collaboration_3.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v1-cargo-collaboration-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/collab-engine/Cargo.lock', 'crates/collab-engine/Cargo.toml') }}

  rust-ci-gate:
    name: rust-ci-gate
    needs: [ci-plan, fast, fast-sqlite, native-arm64, postgres-build, postgres, collaboration]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Fail closed on selection results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bun tools/ci/gate.ts --workflow rust --needs-json "$NEEDS_JSON" --tested-sha "$TESTED_SHA"
