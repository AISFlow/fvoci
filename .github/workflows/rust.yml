name: Rust

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Only obsolete runs of this workflow on the same PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LIBCLANG_PATH: /usr/lib/llvm-18/lib
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_fast: ${{ steps.plan.outputs.select_fast }}
      select_fast_sqlite: ${{ steps.plan.outputs.select_fast_sqlite }}
      select_postgres: ${{ steps.plan.outputs.select_postgres }}
      select_native_arm64: ${{ steps.plan.outputs.select_native_arm64 }}
      select_collaboration: ${{ steps.plan.outputs.select_collaboration }}
      postgres_matrix: ${{ steps.plan.outputs.postgres_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bun tools/ci/verify-workflows.ts
          bun test ./tools/ci/planner/ ./tools/ci/gate/ ./tools/ci/verify/ ./tools/ci/argv.test.ts ./tools/ci/workflows.test.ts
          bun tools/ci/plan.ts \
            --workflow rust \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  fast:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_fast == 'true'
    runs-on: ubuntu-26.04
    # Measured cold steps: clippy 204s + default lib/bin 431s + process/vendor
    # tail 35s. Moving SQLite controls (345s) to fast-sqlite leaves about
    # 810s including setup, saves and post steps inside the unchanged 19m.
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Record runner uid, gid and groups once
        run: id
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Script unit tests without a database
        run: |
          bun test scripts/schema-baseline/compare-catalogs.test.ts
          bun test ./tools/selected-backend-ci/lane-controls.test.ts ./tools/selected-backend-ci/drivers/binding.test.ts ./tools/selected-backend-ci/drivers/common.test.ts ./tools/selected-backend-ci/drivers/restart.test.ts ./tools/selected-backend-ci/drivers/postgres.test.ts ./tools/selected-backend-ci/drivers/install.test.ts
      - name: restore.sh env-file parsing and app password argv checks
        run: bash scripts/test-restore-env.sh
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev curl > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --identity-only --github-output "$GITHUB_OUTPUT"
      - name: Restore prepared SQLite prefix
        id: sqlite_prefix_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: v1-sqlite-prefix-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ steps.sqlite.outputs.cache_identity }}
      - name: Verify cached SQLite prefix or build
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --cache-fallback --expected-cache-identity "${{ steps.sqlite.outputs.cache_identity }}" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Restore server build outputs
        id: default_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/default
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-fast-default-test-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Restore clippy build outputs
        id: clippy_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/clippy
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-fast-db-tests-clippy-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - name: Pinned SQLite build wiring (xtask, no native compilation)
        run: |
          cargo fmt --check --manifest-path xtask/Cargo.toml
          cargo test --locked --manifest-path xtask/Cargo.toml
      - run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
      - run: bun tools/oracle/encryption-keys.ts self-test
      - run: cargo clippy --target-dir target/clippy --locked --offline --all-targets --features db-tests -- -D warnings
      - run: cargo test --locked --offline --lib --bin fvoci-server
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --test collab_wire
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --test markdown_process
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --test docx_export_process
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --test pdf_export_process
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --test pptx_export_process
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --test doctor_conversion
        env:
          CARGO_TARGET_DIR: target/default
      - run: cargo test --locked --offline --manifest-path vendor/markdown/Cargo.toml --target-dir target/default/vendor-markdown
      - name: Save server build outputs after validation
        if: steps.default_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/default
          key: ${{ steps.default_cache.outputs.cache-primary-key }}
      - name: Save clippy build outputs after validation
        if: steps.clippy_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/clippy
          key: ${{ steps.clippy_cache.outputs.cache-primary-key }}

  fast-sqlite:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_fast_sqlite == 'true'
    runs-on: ubuntu-26.04
    # Measured cold SQLite controls: 345s, including the db-tests build.
    # Separate prefix/fetch/xtask setup and cache save allow about 450s total;
    # keep the same 19m budget independently of clippy and default tests.
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev curl > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --identity-only --github-output "$GITHUB_OUTPUT"
      - name: Restore prepared SQLite prefix
        id: sqlite_prefix_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: v1-sqlite-prefix-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ steps.sqlite.outputs.cache_identity }}
      - name: Verify cached SQLite prefix or build
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --cache-fallback --expected-cache-identity "${{ steps.sqlite.outputs.cache_identity }}" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Restore SQLite library build outputs
        id: db_lib_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/db-lib
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-fast-db-tests-lib-test-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - run: cargo fetch --locked
      - name: Selected SQLite library controls (56 exact tests)
        run: |
          xtask/target/debug/xtask selected-library --target-dir target/db-lib
      - name: Additional SQLite library controls (105 exact tests)
        run: xtask/target/debug/xtask selected-library --cohort no-input --target-dir target/db-lib
      - name: Save SQLite library build outputs after validation
        if: steps.db_lib_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/db-lib
          key: ${{ steps.db_lib_cache.outputs.cache-primary-key }}

  # Default-feature build/policy previously ran only on PostgreSQL ARM A.
  # Give that same check its own budget so DB compilation/tests keep their 15m.
  native-arm64:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_native_arm64 == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # This runner's Azure mirror stalled the pinned ARM libclang download.
          # Change only its mirror list; keep the Ubuntu archive Signed-By policy.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          [[ "$(dpkg --print-architecture)" == arm64 ]]
          test -f /etc/apt/apt-mirrors.txt
          grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
          test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
          printf '%s\n' 'https://ports.ubuntu.com/ubuntu-ports/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev curl > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --identity-only --github-output "$GITHUB_OUTPUT"
      - name: Restore prepared SQLite prefix
        id: sqlite_prefix_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: v1-sqlite-prefix-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ steps.sqlite.outputs.cache_identity }}
      - name: Verify cached SQLite prefix or build
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --cache-fallback --expected-cache-identity "${{ steps.sqlite.outputs.cache_identity }}" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Restore server build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-native-default-dev-test-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - run: cargo fetch --locked
      - name: Measure native ARM64 Task scalar runtime
        run: xtask/target/debug/xtask task-scalar-qualification measure > "$RUNNER_TEMP/task-scalar-runtime.json"
      - name: Retain native ARM64 Task scalar runtime measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-scalar-host-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-scalar-runtime.json
          if-no-files-found: error
          retention-days: 90
      - name: Native server build and policy tests (ARM64)
        run: |
          cargo build --locked --offline --bins
          cargo test --locked --offline --lib

  postgres-build:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_postgres == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
          - runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-cargo-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'APT::Get::Always-Include-Phased-Updates "true";' 'APT::Get::Never-Include-Phased-Updates "false";' | sudo tee /etc/apt/apt.conf.d/99fvoci-phased-updates >/dev/null
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o APT::Update::Error-Mode=any update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-remove gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8 linux-libc-dev libcrypt-dev
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W gcc binutils libc6 libc6-dev libclang-18-dev curl > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --identity-only --github-output "$GITHUB_OUTPUT"
      - name: Restore prepared SQLite prefix
        id: sqlite_prefix_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: v1-sqlite-prefix-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ steps.sqlite.outputs.cache_identity }}
      - name: Verify cached SQLite prefix or build
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --cache-fallback --expected-cache-identity "${{ steps.sqlite.outputs.cache_identity }}" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Save verified SQLite prefix
        if: steps.sqlite_prefix_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fvoci-sqlite/${{ steps.sqlite.outputs.target }}
          key: ${{ steps.sqlite_prefix_cache.outputs.cache-primary-key }}
      - name: Restore server build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/db-tests
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-postgres-db-tests-test-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Restore schema default build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/schema-default
          key: v3-server-ubuntu-26.04-${{ runner.arch }}-1.99.0-schema-default-dev-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'vendor/**', 'crates/**', '.cargo/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Restore production helper build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/collab-engine/target
          key: v2-collab-product-helper-ubuntu-26.04-${{ runner.arch }}-1.99.0-worker-dev-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/collab-engine/**', 'crates/vendor/**', '.cargo/**') }}
      - name: Fetch locked dependencies before credential-free compilation
        run: |
          if [[ "${RUNNER_ARCH:-}" == X64 ]]; then
            fvoci_timing_started=$SECONDS
            printf 'ci-step stage=postgres-build-step-11 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            trap 'fvoci_timing_exit=$?; printf "ci-step stage=postgres-build-step-11 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          fi
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/collab-engine/Cargo.toml
      - name: Build all PostgreSQL test executables once per architecture
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/db-tests
        run: |
          mkdir "$RUNNER_TEMP/rust-binaries"
          xtask/target/debug/xtask rust-binaries build --directory "$RUNNER_TEMP/rust-binaries"
      - name: Build default-feature schema migrator
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/schema-default
        run: |
          if [[ "${RUNNER_ARCH:-}" == X64 ]]; then
            fvoci_timing_started=$SECONDS
            printf 'ci-step stage=postgres-build-step-13 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            trap 'fvoci_timing_exit=$?; printf "ci-step stage=postgres-build-step-13 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          fi
          cargo build --locked --offline --bin fvoci-migrate --message-format=json > "$RUNNER_TEMP/rust-binaries/schema.jsonl"
      - name: Build production helper once per architecture
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates/collab-engine/target
        run: |
          if [[ "${RUNNER_ARCH:-}" == X64 ]]; then
            fvoci_timing_started=$SECONDS
            printf 'ci-step stage=postgres-build-step-14 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            trap 'fvoci_timing_exit=$?; printf "ci-step stage=postgres-build-step-14 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          fi
          cargo build --locked --offline --manifest-path crates/collab-engine/Cargo.toml --features worker --bin collab-engine --message-format=json > "$RUNNER_TEMP/rust-binaries/helper.jsonl"
      - name: Seal finished executables and exact native inputs
        run: |
          if [[ "${RUNNER_ARCH:-}" == X64 ]]; then
            fvoci_timing_started=$SECONDS
            printf 'ci-step stage=postgres-build-step-15 started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            trap 'fvoci_timing_exit=$?; printf "ci-step stage=postgres-build-step-15 finished at=%s elapsed_seconds=%s exit=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - ${fvoci_timing_started}))" "$fvoci_timing_exit"; exit "$fvoci_timing_exit"' EXIT
          fi
          xtask/target/debug/xtask rust-binaries pack --directory "$RUNNER_TEMP/rust-binaries" --sqlite-identity "${{ steps.sqlite.outputs.cache_identity }}"
      - name: Verify zstd CLI for executable handoff
        run: zstd --version
      - name: Compress sealed executable archives with zstd
        run: |
          fvoci_timing_started=$SECONDS
          printf 'ci-step stage=rust-binaries-compress started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fvoci_finish_timing() {
            fvoci_timing_exit=$?
            printf 'ci-step stage=rust-binaries-compress finished at=%s elapsed_seconds=%s exit=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - fvoci_timing_started))" "$fvoci_timing_exit"
            exit "$fvoci_timing_exit"
          }
          trap fvoci_finish_timing EXIT
          zstd -T0 --no-progress -- "$RUNNER_TEMP/rust-binaries/postgres.tar" "$RUNNER_TEMP/rust-binaries/helper.tar"
      - name: Hash compressed executable archives
        run: |
          fvoci_timing_started=$SECONDS
          printf 'ci-step stage=rust-binaries-hash started at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fvoci_finish_timing() {
            fvoci_timing_exit=$?
            printf 'ci-step stage=rust-binaries-hash finished at=%s elapsed_seconds=%s exit=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - fvoci_timing_started))" "$fvoci_timing_exit"
            exit "$fvoci_timing_exit"
          }
          trap fvoci_finish_timing EXIT
          cd "$RUNNER_TEMP/rust-binaries" || exit 1
          sha256sum postgres.tar.zst helper.tar.zst
      - name: Upload postgres finished executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-postgres-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-binaries/postgres.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Upload helper finished executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-helper-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-binaries/helper.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  postgres:
    needs: [ci-plan, postgres-build]
    if: needs.ci-plan.outputs.select_postgres == 'true'
    name: ${{ matrix.check }}
    # A/C split only task/comment from measured PG16 A: 160.19s moved,
    # 404.03s retained (cold compile/setup are separate). Both keep 15m.
    # B retains every target/helper/install/S3: x64 20m, ARM64 25m.
    # Measured ARM setup/PG 17m59.916s + install 3m30s + S3/post 34s
    # = 22m03.916s; 25m leaves 2m56.084s for hosted variation/cleanup.
    # Each major/architecture pair runs every suite exactly once across
    # A/B/C. PG18 covers both architectures; PG16/17 cover x64.
    # Pull requests run the PG 18 x64 rows only, even when their paths make
    # the plan full. merge_group, push, and workflow_dispatch run this full
    # catalog. ci-plan emits the rows as {"include": [...]} and the job
    # matrix is that plan output itself; rust-ci-gate recomputes the rows
    # for the run's event and fails on any other matrix.
    # Keep image pins in sync with scripts/start-test-postgres.sh.
    env:
      FVOCI_POSTGRES_MATRIX_CATALOG: |
        [
          {
            "runner": "ubuntu-26.04",
            "pg_major": "18",
            "postgres_image": "postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336",
            "check": "postgres",
