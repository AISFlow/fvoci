name: Native documents

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Only obsolete runs of this workflow on the same PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LIBCLANG_PATH: /usr/lib/llvm-18/lib
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_native_extraction: ${{ steps.plan.outputs.select_native_extraction }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bun tools/ci/plan.ts \
            --workflow documents \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  native-extraction:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_native_extraction == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            check: native-extraction
          - runner: ubuntu-26.04-arm
            check: native-extraction-arm64
    runs-on: ${{ matrix.runner }}
    # x64 113019003045 cancelled in apt after the extract crate had passed.
    # 30m is the 914s wall, 183s to finish the last 28.8MB at the observed
    # rate, 44s sqlite, 460s cross-feature compile analogue, 120s unmeasured
    # test bodies, and 60s. ARM has no shortage evidence and stays 15m.
    timeout-minutes: ${{ matrix.check == 'native-extraction' && 30 || 15 }}
    services:
      postgres:
        image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    defaults:
      run:
        working-directory: crates/document-extract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Restore Cargo downloads
        id: cache_native_extraction_3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: v3-cargo-documents-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/document-extract/Cargo.toml', 'crates/document-extract/Cargo.lock', 'crates/document-extract-client/Cargo.toml', 'crates/document-extract-client/Cargo.lock') }}
      - name: Restore document build outputs
        id: cache_native_extraction_4
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/document-extract/target
            crates/document-extract-client/target
          key: v2-documents-ubuntu-26.04-${{ runner.arch }}-1.99.0-test-hang-default-nodebug-${{ hashFiles('crates/document-extract/Cargo.toml', 'crates/document-extract/Cargo.lock', 'crates/document-extract-client/Cargo.toml', 'crates/document-extract-client/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/document-extract/src/**', 'crates/document-extract-client/src/**', 'crates/document-extract/tests/**', 'crates/document-extract/fetch-rhwp.sh') }}
          restore-keys: v2-documents-ubuntu-26.04-${{ runner.arch }}-1.99.0-test-hang-default-nodebug-${{ hashFiles('crates/document-extract/Cargo.toml', 'crates/document-extract/Cargo.lock', 'crates/document-extract-client/Cargo.toml', 'crates/document-extract-client/Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Thin process client without native parser dependencies
        working-directory: crates/document-extract-client
        run: |
          cargo fetch --locked
          cargo fmt --check
          cargo clippy --locked --offline --all-targets -- -D warnings
          cargo clippy --locked --offline --all-targets --features test-hang -- -D warnings
          cargo test --locked --offline --all-targets
          cargo test --locked --offline --all-targets --features test-hang
          cargo metadata --locked --offline --format-version 1 > "$RUNNER_TEMP/extract-client-metadata.json"
          bun ../../tools/ci/document-client-deps.ts "$RUNNER_TEMP/extract-client-metadata.json"
      - name: Restore pinned public rhwp source
        id: cache_native_extraction_6
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/document-extract/.vendor-src/rhwp
          key: rhwp-source-${{ hashFiles('crates/document-extract/Cargo.toml', 'crates/document-extract/fetch-rhwp.sh') }}
      - name: Prepare and verify pinned native source
        run: bash fetch-rhwp.sh
      - name: Fetch locked dependencies before offline validation
        run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --offline --all-targets -- -D warnings
      - run: cargo clippy --locked --offline --all-targets --features test-hang -- -D warnings
      - name: Native fixtures and process termination
        run: cargo test --locked --offline --all-targets --features test-hang
      - name: Production helper rejects test controls
        run: cargo test --locked --offline --all-targets
      - name: Build production and test-only native helpers separately
        run: |
          cargo build --locked --offline --bin document-extract
          cp target/debug/document-extract "$RUNNER_TEMP/document-extract-production"
          cargo build --locked --offline --bin document-extract --features test-hang
          cp target/debug/document-extract "$RUNNER_TEMP/document-extract-test-hang"
      - name: Restore pinned arm64 libclang packages
        id: clang18_arm64_cache
        if: runner.arch == 'ARM64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fvoci-clang18-arm64
          key: v1-clang18-debs-ubuntu-26.04-${{ runner.arch }}-1.99.0-18.1.8-20ubuntu8-arm64
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        working-directory: .
        run: |
          set -euo pipefail
          # x64 keeps the signed primary archive; ARM reuses verified large packages.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
              ;;
            arm64)
              # SHA-256 values from Ubuntu's signed resolute arm64 Packages index.
              # Check hits too: a corrupt cache must fail before privileged installation.
              command -v gcc ar curl >/dev/null
              deb_dir="$RUNNER_TEMP/fvoci-clang18-arm64"
              mkdir -p "$deb_dir"
              debs=()
              while read -r digest filename; do
                package="$deb_dir/$filename"
                if [[ ! -f "$package" ]]; then
                  curl --fail --silent --show-error --location \
                    "https://ports.ubuntu.com/ubuntu-ports/pool/universe/l/llvm-toolchain-18/$filename" \
                    --output "$package"
                fi
                printf '%s  %s\n' "$digest" "$package" | sha256sum --check --strict
                debs+=("$package")
              done <<'PACKAGES'
          061da069dfbb7f5e1215eebd06531e337927e64e7d5576c99f04fef27da0360a libclang-18-dev_18.1.8-20ubuntu8_arm64.deb
          63b7319ce3056cf67894864141ca18ba3aa234a1c2743a299d11a8df24833d5c libclang-common-18-dev_18.1.8-20ubuntu8_arm64.deb
          8451d5f5290f3a833bb301357c54936e932188ca125e08734071b08fb86b676e libclang1-18_18.1.8-20ubuntu8_arm64.deb
          bcc3bb04c81c97b9157df50801ac36628866692bf681830913874eeef3208491 libllvm18_18.1.8-20ubuntu8_arm64.deb
          PACKAGES
              # Unpack the verified files directly: apt can substitute an index
              # URI for a local operand of the same version. Resolve/configure
              # only the missing Depends after those exact bytes are unpacked.
              sudo apt-get update
              sudo dpkg --unpack -- "${debs[@]}"
              sudo apt-get install -y --no-install-recommends --fix-broken --no-remove --no-upgrade -- "${debs[@]}"
              ;;
            *) exit 1 ;;
          esac
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Save verified arm64 libclang packages
        if: runner.arch == 'ARM64' && github.ref == 'refs/heads/main' && steps.clang18_arm64_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fvoci-clang18-arm64
          key: v1-clang18-debs-ubuntu-26.04-${{ runner.arch }}-1.99.0-18.1.8-20ubuntu8-arm64
      - name: Restore attachment product build outputs
        id: cache_native_extraction_15
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v1-extract-product-ubuntu-26.04-${{ runner.arch }}-1.99.0-extract-native-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'crates/document-extract-client/src/**', 'crates/collab-engine/src/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Prepare locked server dependencies
        working-directory: .
        run: cargo fetch --locked
      - name: Check native product test feature
        working-directory: .
        run: cargo clippy --locked --offline --all-targets --features extract-native-tests -- -D warnings
      - name: Office documents through the isolated office child (rlimits, hostile inputs)
        working-directory: .
        run: cargo test --locked --offline --features extract-native-tests --test office_extract_process
      - name: Authenticated HWP and HWPX through the production helper
        working-directory: .
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_EXTRACTOR_BIN: ${{ runner.temp }}/document-extract-production
        run: cargo test --locked --offline --features extract-native-tests --test attachment_extract_native authenticated_
      - name: Native attachment cancellation and process recovery
        working-directory: .
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_EXTRACTOR_BIN: ${{ runner.temp }}/document-extract-test-hang
        run: cargo test --locked --offline --features extract-native-tests --test attachment_extract_native
      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && steps.cache_native_extraction_3.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: v3-cargo-documents-ubuntu-26.04-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/document-extract/Cargo.toml', 'crates/document-extract/Cargo.lock', 'crates/document-extract-client/Cargo.toml', 'crates/document-extract-client/Cargo.lock') }}
      - name: Save document build outputs
        if: github.ref == 'refs/heads/main' && steps.cache_native_extraction_4.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/document-extract/target
            crates/document-extract-client/target
          key: v2-documents-ubuntu-26.04-${{ runner.arch }}-1.99.0-test-hang-default-nodebug-${{ hashFiles('crates/document-extract/Cargo.toml', 'crates/document-extract/Cargo.lock', 'crates/document-extract-client/Cargo.toml', 'crates/document-extract-client/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/document-extract/src/**', 'crates/document-extract-client/src/**', 'crates/document-extract/tests/**', 'crates/document-extract/fetch-rhwp.sh') }}
      - name: Save pinned public rhwp source
        if: github.ref == 'refs/heads/main' && steps.cache_native_extraction_6.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/document-extract/.vendor-src/rhwp
          key: rhwp-source-${{ hashFiles('crates/document-extract/Cargo.toml', 'crates/document-extract/fetch-rhwp.sh') }}
      - name: Save attachment product build outputs
        if: github.ref == 'refs/heads/main' && steps.cache_native_extraction_15.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v1-extract-product-ubuntu-26.04-${{ runner.arch }}-1.99.0-extract-native-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'crates/document-extract-client/src/**', 'crates/collab-engine/src/**') }}-${{ steps.sqlite.outputs.cache_identity }}

  documents-ci-gate:
    name: documents-ci-gate
    needs: [ci-plan, native-extraction]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Fail closed on selection results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bun tools/ci/gate.ts --workflow documents --needs-json "$NEEDS_JSON" --tested-sha "$TESTED_SHA"
