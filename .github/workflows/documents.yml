name: Native documents

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/document-extract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            crates/document-extract/target
          key: rust-documents-${{ runner.os }}-1.98.1-${{ hashFiles('crates/document-extract/Cargo.toml', 'crates/document-extract/Cargo.lock') }}
      - name: Prepare and verify pinned native source
        run: bash fetch-rhwp.sh
      - name: Fetch locked dependencies before offline validation
        run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --offline --all-targets --features test-hang -- -D warnings
      - name: Native fixtures and process termination
        run: cargo test --locked --offline --all-targets --features test-hang
      - name: Production helper rejects test controls
        run: cargo test --locked --offline --all-targets
