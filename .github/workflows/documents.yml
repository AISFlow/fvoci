name: Native documents

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Only obsolete runs of this workflow on the same PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LIBCLANG_PATH: /usr/lib/llvm-18/lib
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_native_extraction: ${{ steps.plan.outputs.select_native_extraction }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user --break-system-packages -r scripts/ci_selection_requirements.txt
          python3 scripts/ci_selection.py plan \
            --workflow documents \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  native-extraction:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_native_extraction == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            check: native-extraction
          - runner: ubuntu-26.04-arm
            check: native-extraction-arm64
    runs-on: ${{ matrix.runner }}
    # x64 113019003045 cancelled in apt after the extract crate had passed.
    # 30m is the 914s wall, 183s to finish the last 28.8MB at the observed
    # rate, 44s sqlite, 460s cross-feature compile analogue, 120s unmeasured
    # test bodies, and 60s. ARM has no shortage evidence and stays 15m.
    timeout-minutes: ${{ matrix.check == 'native-extraction' && 30 || 15 }}
    services:
      postgres:
        image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    defaults:
      run:
        working-directory: crates/document-extract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Restore Cargo downloads
        id: cache_native_extraction_3
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry
          key: v3-cargo-documents-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/document-extract/Cargo.toml', 'crates/document-extract/Cargo.lock', 'crates/document-extract-client/Cargo.toml', 'crates/document-extract-client/Cargo.lock') }}
      - name: Restore document build outputs
        id: cache_native_extraction_4
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            crates/document-extract/target
            crates/document-extract-client/target
          key: v2-documents-ubuntu-26.04-${{ runner.arch }}-1.98.1-test-hang-default-nodebug-${{ hashFiles('crates/document-extract/Cargo.toml', 'crates/document-extract/Cargo.lock', 'crates/document-extract-client/Cargo.toml', 'crates/document-extract-client/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/document-extract/src/**', 'crates/document-extract-client/src/**', 'crates/document-extract/tests/**', 'crates/document-extract/fetch-rhwp.sh') }}
          restore-keys: v2-documents-ubuntu-26.04-${{ runner.arch }}-1.98.1-test-hang-default-nodebug-${{ hashFiles('crates/document-extract/Cargo.toml', 'crates/document-extract/Cargo.lock', 'crates/document-extract-client/Cargo.toml', 'crates/document-extract-client/Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Thin process client without native parser dependencies
        working-directory: crates/document-extract-client
        run: |
          cargo fetch --locked
          cargo fmt --check
          cargo clippy --locked --offline --all-targets -- -D warnings
          cargo clippy --locked --offline --all-targets --features test-hang -- -D warnings
          cargo test --locked --offline --all-targets
          cargo test --locked --offline --all-targets --features test-hang
          cargo metadata --locked --offline --format-version 1 > "$RUNNER_TEMP/extract-client-metadata.json"
          python3 - "$RUNNER_TEMP/extract-client-metadata.json" <<'PYTHON'
          import json, sys
          names = {p["name"] for p in json.load(open(sys.argv[1]))["packages"]}
          forbidden = names & {"rhwp", "cfb", "zip", "flate2", "skia-safe", "skia-bindings"}
          assert not forbidden, f"native dependencies leaked into process client: {forbidden}"
          PYTHON
      - name: Restore pinned public rhwp source
        id: cache_native_extraction_6
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/document-extract/.vendor-src/rhwp
          key: rhwp-source-${{ hashFiles('crates/document-extract/Cargo.toml', 'crates/document-extract/fetch-rhwp.sh') }}
      - name: Prepare and verify pinned native source
        run: bash fetch-rhwp.sh
      - name: Fetch locked dependencies before offline validation
        run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --offline --all-targets -- -D warnings
      - run: cargo clippy --locked --offline --all-targets --features test-hang -- -D warnings
      - name: Native fixtures and process termination
        run: cargo test --locked --offline --all-targets --features test-hang
      - name: Production helper rejects test controls
        run: cargo test --locked --offline --all-targets
      - name: Build production and test-only native helpers separately
        run: |
          cargo build --locked --offline --bin document-extract
          cp target/debug/document-extract "$RUNNER_TEMP/document-extract-production"
          cargo build --locked --offline --bin document-extract --features test-hang
          cp target/debug/document-extract "$RUNNER_TEMP/document-extract-test-hang"
      - name: Prepare pinned SQLite root build inputs
        id: sqlite
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        working-directory: .
        run: |
          set -euo pipefail
          # Select the signed Ubuntu primary archive only on x64; preserve ARM mirrors.
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          case "$(dpkg --print-architecture)" in
            amd64)
              test -f /etc/apt/apt-mirrors.txt
              grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
              grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
              test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              ;;
            arm64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gcc binutils curl libclang-18-dev=1:18.1.8-20ubuntu8
          mkdir "$RUNNER_TEMP/fvoci-sqlite"
          dpkg-query -W > "$RUNNER_TEMP/fvoci-sqlite/build-packages.txt"
          bash scripts/prepare-sqlite-ci.sh --parent "$RUNNER_TEMP/fvoci-sqlite" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Restore attachment product build outputs
        id: cache_native_extraction_15
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v1-extract-product-ubuntu-26.04-${{ runner.arch }}-1.98.1-extract-native-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'crates/document-extract-client/src/**', 'crates/collab-engine/src/**') }}-${{ steps.sqlite.outputs.cache_identity }}
      - name: Prepare locked server dependencies
        working-directory: .
        run: cargo fetch --locked
      - name: Check native product test feature
        working-directory: .
        run: cargo clippy --locked --offline --all-targets --features extract-native-tests -- -D warnings
      - name: Office documents through the isolated office child (rlimits, hostile inputs)
        working-directory: .
        run: cargo test --locked --offline --features extract-native-tests --test office_extract_process
      - name: Authenticated HWP and HWPX through the production helper
        working-directory: .
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_EXTRACTOR_BIN: ${{ runner.temp }}/document-extract-production
        run: cargo test --locked --offline --features extract-native-tests --test attachment_extract_native authenticated_
      - name: Native attachment cancellation and process recovery
        working-directory: .
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          FVOCI_EXTRACTOR_BIN: ${{ runner.temp }}/document-extract-test-hang
        run: cargo test --locked --offline --features extract-native-tests --test attachment_extract_native
      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && steps.cache_native_extraction_3.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry
          key: v3-cargo-documents-ubuntu-26.04-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/document-extract/Cargo.toml', 'crates/document-extract/Cargo.lock', 'crates/document-extract-client/Cargo.toml', 'crates/document-extract-client/Cargo.lock') }}
      - name: Save document build outputs
        if: github.ref == 'refs/heads/main' && steps.cache_native_extraction_4.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            crates/document-extract/target
            crates/document-extract-client/target
          key: v2-documents-ubuntu-26.04-${{ runner.arch }}-1.98.1-test-hang-default-nodebug-${{ hashFiles('crates/document-extract/Cargo.toml', 'crates/document-extract/Cargo.lock', 'crates/document-extract-client/Cargo.toml', 'crates/document-extract-client/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/document-extract/src/**', 'crates/document-extract-client/src/**', 'crates/document-extract/tests/**', 'crates/document-extract/fetch-rhwp.sh') }}
      - name: Save pinned public rhwp source
        if: github.ref == 'refs/heads/main' && steps.cache_native_extraction_6.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/document-extract/.vendor-src/rhwp
          key: rhwp-source-${{ hashFiles('crates/document-extract/Cargo.toml', 'crates/document-extract/fetch-rhwp.sh') }}
      - name: Save attachment product build outputs
        if: github.ref == 'refs/heads/main' && steps.cache_native_extraction_15.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: v1-extract-product-ubuntu-26.04-${{ runner.arch }}-1.98.1-extract-native-tests-nodebug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'migrations/**', 'scripts/**', 'crates/document-extract-client/src/**', 'crates/collab-engine/src/**') }}-${{ steps.sqlite.outputs.cache_identity }}

  documents-ci-gate:
    name: documents-ci-gate
    needs: [ci-plan, native-extraction]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail closed on selection results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci_selection.py gate --workflow documents --needs-json "$NEEDS_JSON" --tested-sha "$TESTED_SHA"
