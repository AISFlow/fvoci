name: Release

# 0.y.z trial releases (docs/RELEASING.md). Runs only for a pushed v0.* tag or a
# manual dispatch naming an existing tag; never for pull requests. Tags pushed
# with GITHUB_TOKEN do not start workflows, so a maintainer pushes the tag
# from an authenticated git/gh session (or dispatches this workflow).
on:
  push:
    tags: ['v0.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v0.y.z tag on main to release or re-run
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/aisflow/fvoci
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Tag -> main commit that CI already accepted; version policy; existing state.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      packages: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      update_minor: ${{ steps.version.outputs.update_minor }}
      existing_digest: ${{ steps.existing.outputs.digest }}
    steps:
      - name: Validate tag name
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::'$RELEASE_TAG' is not a v0.y.z tag"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - id: source
        name: Tag points to a first-parent commit of main
        run: |
          set -euo pipefail
          sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$sha"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git rev-list --first-parent refs/remotes/origin/main | grep -qx "$sha"; then
            echo "::error::${RELEASE_TAG} (${sha}) is not a commit on main"
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >>"$GITHUB_OUTPUT"
          echo "sha=${sha}" >>"$GITHUB_OUTPUT"
      - name: Every CI gate passed on that commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-check-ci.sh "${{ steps.source.outputs.sha }}"
      - id: version
        name: Version policy and release notes
        run: |
          set -euo pipefail
          version="$(bash scripts/release-check-version.sh --tag "$RELEASE_TAG")"
          if grep -n 'TODO(release)' scripts/release-notes-template.md; then
            echo "::error::scripts/release-notes-template.md still has TODO(release) markers at ${RELEASE_TAG}"
            exit 1
          fi
          minor="${version%.*}"
          newest="$(git tag -l "v${minor}.*" | grep -E '^v0\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          {
            echo "version=${version}"
            echo "minor=${minor}"
            echo "update_minor=$([[ "$newest" == "$RELEASE_TAG" ]] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: existing
        name: Reuse an image this version already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="$(bash scripts/release-existing.sh --tag "$RELEASE_TAG" \
            --version "${{ steps.version.outputs.version }}" --sha "${{ steps.source.outputs.sha }}" --image "$IMAGE")"
          echo "existing image index: ${digest:-none}"
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"

  # Native per-architecture builds (no QEMU), pushed by digest only.
  build:
    needs: verify
    if: needs.verify.outputs.existing_digest == ''
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - run: test "$(uname -m)" = "${{ matrix.machine }}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/rust/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            FVOCI_BUILD_SHA=${{ needs.verify.outputs.sha }}
          labels: |
            org.opencontainers.image.title=fvoci
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record digest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digest"
          echo "${{ steps.build.outputs.digest }}" | grep -Eqx 'sha256:[0-9a-f]{64}'
          echo "${{ steps.build.outputs.digest }}" >"$RUNNER_TEMP/digest/${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

  # One multi-arch index tagged 0.y.z (and 0.y when this is the newest 0.y.*).
  manifest:
    needs: [verify, build]
    if: always() && needs.verify.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.verify.outputs.existing_digest != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      index_digest: ${{ steps.index.outputs.index_digest }}
      amd64_digest: ${{ steps.index.outputs.amd64_digest }}
      arm64_digest: ${{ steps.index.outputs.arm64_digest }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      MINOR: ${{ needs.verify.outputs.minor }}
      UPDATE_MINOR: ${{ needs.verify.outputs.update_minor }}
      EXISTING: ${{ needs.verify.outputs.existing_digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: needs.verify.outputs.existing_digest == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digest
      - name: Create or reuse the index
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$VERSION")
          [[ "$UPDATE_MINOR" == true ]] && tags+=(-t "$IMAGE:$MINOR")
          if [[ -z "$EXISTING" ]]; then
            amd64="$(cat "$RUNNER_TEMP/digest/amd64")"
            arm64="$(cat "$RUNNER_TEMP/digest/arm64")"
            docker buildx imagetools create "${tags[@]}" "$IMAGE@$amd64" "$IMAGE@$arm64"
            printf '%s\n' "$amd64" >"$RUNNER_TEMP/expect-amd64"
            printf '%s\n' "$arm64" >"$RUNNER_TEMP/expect-arm64"
          elif [[ "$UPDATE_MINOR" == true ]]; then
            docker buildx imagetools create -t "$IMAGE:$MINOR" "$IMAGE@$EXISTING"
          fi
      - id: index
        name: Record the published index
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw >"$RUNNER_TEMP/index.json"
          index="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          [[ "$index" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -z "$EXISTING" || "$EXISTING" == "$index" ]] || { echo "::error::$IMAGE:$VERSION moved to $index"; exit 1; }
          python3 - "$RUNNER_TEMP/index.json" "$RUNNER_TEMP" "$index" >>"$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          index = json.load(open(sys.argv[1]))
          found = {m["platform"]["architecture"]: m["digest"] for m in index["manifests"] if m["platform"]["os"] == "linux"}
          assert sorted(found) == ["amd64", "arm64"] and len(index["manifests"]) == 2, index
          for arch, digest in found.items():
              expect = pathlib.Path(sys.argv[2], f"expect-{arch}")
              assert not expect.exists() or expect.read_text().strip() == digest, (arch, digest)
              print(f"{arch}_digest={digest}")
          print(f"index_digest={sys.argv[3]}")
          PY
          cat "$GITHUB_OUTPUT"

  # Release files rendered from the tagged tree and the published index.
  dist:
    needs: [verify, manifest]
    if: always() && needs.manifest.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Render compose.yml, release.json, notes and SHA256SUMS
        run: |
          bash scripts/release-dist.sh \
            --version "${{ needs.verify.outputs.version }}" \
            --sha "${{ needs.verify.outputs.sha }}" \
            --repository "${{ github.repository }}" \
            --image "$IMAGE" \
            --index-digest "${{ needs.manifest.outputs.index_digest }}" \
            --amd64-digest "${{ needs.manifest.outputs.amd64_digest }}" \
            --arm64-digest "${{ needs.manifest.outputs.arm64_digest }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out "$RUNNER_TEMP/dist"
          cat "$RUNNER_TEMP/dist/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: ${{ runner.temp }}/dist
          retention-days: 30
          if-no-files-found: error

  # Anonymous pull of the PUBLISHED index on each native architecture: no
  # registry login, no packages permission, no locally built image.
  smoke:
    needs: [verify, dist]
    if: always() && needs.dist.result == 'success'
    name: smoke-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/editor/package-lock.json
      - name: Prepare locked browser test dependencies
        run: |
          npm ci --prefix apps/web --no-audit --no-fund
          npm ci --prefix packages/editor --ignore-scripts --no-audit --no-fund
      - name: Prepare Chromium and system libraries
        working-directory: apps/web
        run: npm exec --no -- playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: ${{ runner.temp }}/dist
      - name: Release smoke against the published digest
        run: bash scripts/release-smoke.sh --dist "$RUNNER_TEMP/dist"

  # The only job that can write repository contents: the GitHub pre-release,
  # created once both architectures passed the smoke.
  release:
    needs: [verify, dist, smoke]
    if: always() && needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: ${{ runner.temp }}/dist
      - name: Create the pre-release (idempotent, never overwrites)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-publish.sh --tag "${{ needs.verify.outputs.tag }}" --dist "$RUNNER_TEMP/dist"
