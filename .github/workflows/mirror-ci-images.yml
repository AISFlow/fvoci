name: Mirror CI images

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install crane v0.22.1 by checksum
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != x86_64 ]]; then
            echo "pinned crane checksum is for x86_64" >&2
            exit 1
          fi
          version=0.22.1
          checksum=0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
          archive=go-containerregistry_Linux_x86_64.tar.gz
          work="$RUNNER_TEMP/crane-install"
          mkdir "$work"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/google/go-containerregistry/releases/download/v${version}/${archive}" \
            -o "$work/$archive"
          printf '%s  %s\n' "$checksum" "$work/$archive" | sha256sum --check --strict
          tar -xzf "$work/$archive" -C "$work" crane
          mkdir -p "$RUNNER_TEMP/bin"
          install "$work/crane" "$RUNNER_TEMP/bin/crane"
          test "$("$RUNNER_TEMP/bin/crane" version)" = "$version"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Copy each pinned image and require the same digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          copied=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            name="${line%% *}"
            src="${line#* }"
            if [[ "$name" == "$line" || -z "$name" ]]; then
              echo "mirror entry must be 'name source@sha256:digest': $line" >&2
              exit 1
            fi
            digest="${src##*@}"
            hex="${digest#sha256:}"
            if [[ "$digest" == "$src" || "$digest" != sha256:* || "${#hex}" -ne 64 || "$hex" != "${hex//[^0-9a-f]/}" ]]; then
              echo "source must be pinned by sha256 digest: $line" >&2
              exit 1
            fi
            dest="ghcr.io/aisflow/fvoci/ci/${name}@${digest}"
            crane copy "$src" "$dest"
            src_digest="$(crane digest "$src")"
            dst_digest="$(crane digest "$dest")"
            if [[ "$src_digest" != "$dst_digest" ]]; then
              echo "digest mismatch for ${name}: source ${src_digest} destination ${dst_digest}" >&2
              exit 1
            fi
            copied=$((copied + 1))
          done < "$GITHUB_WORKSPACE/.github/ci-image-mirrors.txt"
          if [[ "$copied" -eq 0 ]]; then
            echo "mirror list copied no images" >&2
            exit 1
          fi
