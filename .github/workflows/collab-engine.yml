name: Native collaboration engine

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Only obsolete runs of this workflow on the same PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason_code: ${{ steps.plan.outputs.reason_code }}
      plan_ok: ${{ steps.plan.outputs.plan_ok }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      select_native_collab_engine: ${{ steps.plan.outputs.select_native_collab_engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user --break-system-packages -r scripts/ci_selection_requirements.txt
          python3 scripts/ci_selection.py plan \
            --workflow collab-engine \
            --event-json "$GITHUB_EVENT_PATH" \
            --output-plan "$RUNNER_TEMP/ci-selection-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  native-collab-engine:
    needs: ci-plan
    if: needs.ci-plan.outputs.select_native_collab_engine == 'true'
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            check: native-collab-engine
          - runner: ubuntu-24.04-arm
            check: native-collab-engine-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/collab-engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Restore Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry
          key: v1-cargo-collab-engine-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock') }}
      - name: Restore engine build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/collab-engine/target
          key: v1-collab-engine-${{ runner.os }}-${{ runner.arch }}-1.98.1-worker-test-hang-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/collab-engine/src/**', 'crates/collab-engine/tests/**') }}
          restore-keys: v1-collab-engine-${{ runner.os }}-${{ runner.arch }}-1.98.1-worker-test-hang-nodebug-${{ hashFiles('crates/collab-engine/Cargo.toml', 'crates/collab-engine/Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Fetch locked dependencies before offline validation
        run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --offline --all-targets --features test-hang -- -D warnings
      - name: Yjs compatibility and process termination
        run: cargo test --locked --offline --all-targets --features test-hang
      - name: Production helper rejects test controls
        run: cargo test --locked --offline --all-targets --features worker
      - name: Parent API compiles without the CRDT engine
        run: cargo check --locked --offline --lib --no-default-features

  collab-engine-ci-gate:
    name: collab-engine-ci-gate
    needs: [ci-plan, native-collab-engine]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail closed on selection results
        env:
          PLAN_READY: ${{ needs.ci-plan.result }}
          PLAN_JSON: ${{ needs.ci-plan.outputs.plan_json }}
          TESTED_SHA: ${{ github.sha }}
          JOB_NATIVE_COLLAB_ENGINE: ${{ needs.native-collab-engine.result }}
        run: |
          set -euo pipefail
          if [[ "$PLAN_READY" != success ]]; then
            echo "ci-plan did not succeed"
            exit 1
          fi
          python3 scripts/ci_selection.py gate --workflow collab-engine \
            --plan-json "$PLAN_JSON" \
            --tested-sha "$TESTED_SHA" \
            --job-result native-collab-engine="$JOB_NATIVE_COLLAB_ENGINE"
