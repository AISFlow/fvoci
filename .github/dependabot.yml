version: 2

# Version PRs are reviewed and tested like other changes; this enables no auto-merge.
# Fixed-source oracles get security updates only; routine baseline changes and
# vendor/ snapshots are reviewed by hand.
# document-extract also needs a manual update: its required .vendor-src/rhwp
# path is fetched by crates/document-extract/fetch-rhwp.sh, not stored in Git.
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/collab-engine
      - /crates/document-extract-client
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /apps/web
      - /packages/editor
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Keep reproducible oracles fixed for ordinary version updates, but do not
  # suppress security fixes in development-only network/fixture dependencies.
  - package-ecosystem: npm
    directories:
      - /compat/js
      - /crates/collab-engine/js
      - /scripts/document-convert
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /compat
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    groups:
      ci-python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /infra/rust
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    groups:
      build-images-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /infra/rust
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    groups:
      services-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
