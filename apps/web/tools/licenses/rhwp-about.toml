# cargo-about configuration for the crates built into the WebAssembly of @rhwp/core
# (tools/licenses/rhwp-wasm.ts says how the notices are generated with it).
#
# The list is the repository's (about.toml, deny.toml) and one more, IJG: rhwp 0.9.0
# carries two JPEG crates patched after the Independent JPEG Group's code, under its
# licence (use and redistribution with the acknowledgement kept; nothing copyleft).
# It is accepted for this WebAssembly only, by the decision to take rhwp 0.9.0
# (2026-11-18), and its text is in the notices. Any other licence fails the generation.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
]
# Only what ends up in the WebAssembly.
ignore-dev-dependencies = true
ignore-build-dependencies = true
