[package]
name = "fvoci-compat-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Isolated Yjs/Yrs and attachment-format feasibility probe. Not product code."

[[bin]]
name = "yrs-bridge"
path = "src/yrs_bridge.rs"

[[bin]]
name = "extract-probe"
path = "src/extract_probe.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yrs = "=0.23.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
