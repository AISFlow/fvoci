[package]
name = "fvoci-server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "fvoci-server"
path = "src/main.rs"

[[bin]]
name = "fvoci-migrate"
path = "src/bin/fvoci-migrate.rs"

[[bin]]
name = "fvoci-export-openapi"
path = "src/bin/export-openapi.rs"
required-features = ["api-schema"]

[[bin]]
name = "fvoci-e2e-fixture"
path = "src/bin/e2e-fixture.rs"
required-features = ["db-tests"]

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["macros", "json", "form", "query", "matched-path", "original-uri", "tokio", "http1", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
collab-engine = { path = "crates/collab-engine", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
hex = "0.4"
hmac = "0.12"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "=0.1.25"
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
utoipa = { version = "=6.0.0", optional = true, default-features = false, features = ["macros", "uuid", "chrono"] }

[dev-dependencies]
tokio-tungstenite = "=0.29.0"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "test-util"] }

[features]
db-tests = []
api-schema = ["dep:utoipa"]

[[test]]
name = "db_integration"
path = "tests/db_integration.rs"
required-features = ["db-tests"]

[[test]]
name = "document_integration"
path = "tests/document_integration.rs"
required-features = ["db-tests"]

[[test]]
name = "collab_integration"
path = "tests/collab_integration.rs"
required-features = ["db-tests"]

[[test]]
name = "collab_product"
path = "tests/collab_product.rs"
required-features = ["db-tests"]

[[test]]
name = "collab_projection"
path = "tests/collab_projection.rs"
required-features = ["db-tests"]

[[test]]
name = "collab_lifecycle"
path = "tests/collab_lifecycle.rs"
required-features = ["db-tests"]

[[test]]
name = "collab_shutdown"
path = "tests/collab_shutdown.rs"
required-features = ["db-tests"]
