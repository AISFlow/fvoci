[package]
name = "document-extract-client"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Killable native extract process client and canonical outcome/limits/revision types"

# Revision constants in src/lib.rs are authoritative for ExtractReport.
# Parser-side fetch-rhwp.sh reads crates/document-extract Cargo.toml metadata.

[features]
default = []
# Compiles spawn tracing used by the parent helper's `--test-hang-ms` tests.
# Production builds omit it; this crate never compiles hang flags into a helper.
test-hang = []

[dependencies]
libc = { version = "=0.2.189", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
