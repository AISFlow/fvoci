[package]
name = "fvoci-store"
description = "SQL storage for the fvoci server (SQLite and PostgreSQL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fvoci-model.workspace = true
serde.workspace = true
serde_json.workspace = true
# The digest of a body, which tells whether it changed. License: MIT OR Apache-2.0.
sha2.workspace = true
sqlx.workspace = true
# The comparison of a read token with the stored one. License: BSD-3-Clause.
subtle.workspace = true
thiserror.workspace = true
# The queue of writers to an SQLite database.
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[features]
# Test support for this crate's tests and for the tests of crates that use a store.
test-util = []

[dev-dependencies]
fvoci-store = { path = ".", features = ["test-util"] }
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
