# Optional S3-compatible attachment storage overlay for the Rust install stack.
# Digest = source packages/storage silo pin at 393795261322b916e588043cf94feca999175843.
#
#   docker compose -f infra/rust/compose.yml -f infra/rust/compose.s3.yml --env-file infra/rust/.env up -d --wait server
#
# Requires S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY in .env. Local disk
# (`FVOCI_STORAGE_DIR`) stays the default when this overlay is omitted.
x-silo: &silo-image pgsty/silo:RELEASE.2026-08-06T00-00-00Z@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
x-s3-bucket: &s3-bucket ${S3_BUCKET:-fvoci}

services:
  server:
    environment:
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://silo:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: *s3-bucket
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-1}
      UPLOAD_INCOMPLETE_TTL_HOURS: ${UPLOAD_INCOMPLETE_TTL_HOURS:-24}
    depends_on:
      silo-init:
        condition: service_completed_successfully

  silo:
    image: *silo-image
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - silo-data:/data
    restart: unless-stopped

  silo-init:
    image: *silo-image
    depends_on:
      silo:
        condition: service_started
    restart: on-failure
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: *s3-bucket
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        i=0
        while [ "$$i" -lt 30 ]; do
          mcli alias set local http://silo:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && break
          i=$$((i + 1))
          sleep 1
        done
        mcli mb --ignore-existing "local/$$S3_BUCKET"

volumes:
  silo-data:
