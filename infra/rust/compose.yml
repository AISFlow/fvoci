# FVOCI Rust slice install stack: PostgreSQL, Meilisearch, one-shot init, and server.
# Secrets belong in .env (see .env.example); never commit real credentials.
name: fvoci-rust-install

services:
  postgres:
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    # Compose sets FVOCI_COLLAB_MAX_ROOMS=64 (the verified configuration): 64 room fences
    # (detached, outside the app pool) + app pool 64 + reserve 10 = 138; 150 leaves headroom.
    command: ["postgres", "-c", "max_connections=150"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fvoci}
      POSTGRES_USER: ${POSTGRES_USER:-fvoci_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fvoci_owner} -d ${POSTGRES_DB:-fvoci}"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.53.2@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - searchdata:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  init:
    image: ${FVOCI_IMAGE:?FVOCI_IMAGE is required}
    entrypoint: ["/opt/fvoci/sbin/init-db.sh"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fvoci_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fvoci}
      FVOCI_APP_ROLE: ${FVOCI_APP_ROLE:-fvoci_app}
      FVOCI_APP_PASSWORD: ${FVOCI_APP_PASSWORD:?FVOCI_APP_PASSWORD is required}
      FVOCI_MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      FVOCI_MEILI_KEY_FILE: /run/fvoci/meili/api_key
    volumes:
      - meili_key:/run/fvoci/meili
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: "no"

  server:
    image: ${FVOCI_IMAGE:?FVOCI_IMAGE is required}
    mem_limit: ${FVOCI_SERVER_MEM_LIMIT:-4g}
    ports:
      - "${FVOCI_PUBLISH_ADDR:-127.0.0.1}:${FVOCI_PUBLISH_PORT:-0}:8080"
    environment:
      DATABASE_APP_URL: postgres://${FVOCI_APP_ROLE:-fvoci_app}:${FVOCI_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-fvoci}
      PASSWORD_PEPPER_KEYS: ${PASSWORD_PEPPER_KEYS:?PASSWORD_PEPPER_KEYS is required}
      PASSWORD_PEPPER_ACTIVE_KEY_ID: ${PASSWORD_PEPPER_ACTIVE_KEY_ID:?PASSWORD_PEPPER_ACTIVE_KEY_ID is required}
      FVOCI_PUBLIC_ORIGIN: ${FVOCI_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      FVOCI_COOKIE_SECURE: ${FVOCI_COOKIE_SECURE:-false}
      FVOCI_BIND: 0.0.0.0:8080
      FVOCI_STORAGE_DIR: /data/storage
      FVOCI_STATIC_DIR: /opt/fvoci/static
      FVOCI_COLLAB_ENGINE: /opt/fvoci/bin/collab-engine
      FVOCI_COLLAB_MAX_ROOMS: ${FVOCI_COLLAB_MAX_ROOMS:-64}
      FVOCI_COLLAB_MEMORY_BUDGET: ${FVOCI_COLLAB_MEMORY_BUDGET:-2147483648}
      FVOCI_EXTRACTOR_BIN: /opt/fvoci/bin/document-extract
      FVOCI_EXTRACT_POLL_SECS: ${FVOCI_EXTRACT_POLL_SECS:-2}
      FVOCI_SHUTDOWN_DEADLINE_MS: ${FVOCI_SHUTDOWN_DEADLINE_MS:-30000}
      RUST_LOG: ${RUST_LOG:-}
      FVOCI_MEILI_URL: http://meilisearch:7700
      FVOCI_MEILI_KEY_FILE: /run/fvoci/meili/api_key
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
      ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_STATE_SECRET: ${GITHUB_STATE_SECRET:-}
      FVOCI_AI_ENABLED: ${FVOCI_AI_ENABLED:-}
      FVOCI_AI_SECRET: ${FVOCI_AI_SECRET:-}
      FVOCI_AI_EMBEDDINGS_BASE_URL: ${FVOCI_AI_EMBEDDINGS_BASE_URL:-}
      FVOCI_AI_EMBEDDINGS_MODEL: ${FVOCI_AI_EMBEDDINGS_MODEL:-}
      FVOCI_AI_EMBEDDINGS_ALLOW_PRIVATE: ${FVOCI_AI_EMBEDDINGS_ALLOW_PRIVATE:-}
    volumes:
      - storage:/data/storage
      - meili_key:/run/fvoci/meili:ro
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/setup >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
  storage:
  searchdata:
  meili_key:
