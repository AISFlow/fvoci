# The JavaScript workspace of fvoci: the web app, and what it builds in from
# source that npm does not carry (vendor/rhwp-studio, the HWP editor).
packages:
  - apps/*
  - vendor/*

engineStrict: true

# Dependencies are written as exact versions, never as ranges.
savePrefix: ''

# A version must have been public for a day before it is installed. This is
# pnpm's default; it is written out so that it also fails instead of falling back.
minimumReleaseAge: 1440

# Install scripts run only for packages listed here with `true`.
# esbuild: its postinstall only verifies the platform binary, which arrives as
# the optional dependency @esbuild/<platform>.
allowBuilds:
  esbuild: false

# openapi-typescript 7.13.0 names TypeScript ^5 only, and makes the client's types
# from the contract under TypeScript 6 as it did under 5 (web `check` compares them).
# Upstream the gap is only that range (openapi-ts/openapi-typescript#2550): remove
# this once a release names 6.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'

# typescript-eslint 8.72.2 pulls minimatch <11.0.1 through @typescript-eslint/typescript-estree
# (GHSA-g3hv-75wg-m249 affects >=7.0.0 <11.0.1): upgrade only that vulnerable range so older
# CJS/default-export consumers on minimatch 3 and 5 stay compatible.
overrides:
  katex: '0.19.1'
  minimatch@>=7.0.0 <11.0.1: '>=11.0.1'
