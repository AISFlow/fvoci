# reqwest is built with `rustls-no-provider`: a client that does not get
# FVOCI's TLS config (src/http_client.rs: ring, bundled Mozilla roots)
# panics when it is built. Only that module may call these.
# `reqwest::Client::default` and `reqwest::ClientBuilder::default` are not
# listed: clippy 1.98 resolves a path only to an inherent method or to the
# whole `Default::default` trait method, never to one type's `Default` impl.
# Calling either builds a client without that config, which panics at run
# time when the client is built.
disallowed-methods = [
    { path = "reqwest::Client::new", reason = "use fvoci_server::http_client::client()" },
    { path = "reqwest::Client::builder", reason = "use fvoci_server::http_client::builder()" },
    { path = "reqwest::ClientBuilder::new", reason = "use fvoci_server::http_client::builder()" },
    { path = "reqwest::get", reason = "use fvoci_server::http_client::client().get()" },
]
