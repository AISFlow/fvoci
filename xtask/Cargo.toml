[package]
name = "xtask"
description = "Development tasks of the fvoci workspace: cargo xtask check, test, openapi, measure, docker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
# Reading the sources for the checks of layers and lengths. Lines come from the spans,
# which `span-locations` keeps outside a procedural macro. License: MIT OR Apache-2.0.
proc-macro2 = { version = "1", features = ["span-locations"] }
# Writing a parsed trait back as text, for the name of a function of a trait's `impl`.
quote = { version = "1", default-features = false }
# The time file, `target/xtask-times.jsonl`.
serde.workspace = true
# Reading what docker and the server answer in `cargo xtask docker`, the time file, and
# the targets `cargo metadata` lists.
serde_json.workspace = true
# The digests by which the names check knows the words it bans.
sha2.workspace = true
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing", "visit"] }

[lints]
workspace = true
