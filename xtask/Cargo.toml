[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

# Keep development tasks independent of the product package and its lockfile.
[workspace]

# SQLite preparation prerequisites; SHA3 supplements the product lockfile.
# The task itself is intentionally not registered by this dependency commit.
[dependencies]
libc = "=0.2.189"
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
sha3 = { version = "=0.12.0", default-features = false }
shlex = "=2.0.1"
tokio = { version = "=1.53.1", features = ["rt", "process", "io-util", "time"] }
